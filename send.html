<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Set</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one arrangement board per song, lanes = players and production, sections across the top, then a per-player cue sheet. Single dark look by choice. */
:root {
  --bg: #1a1512;
  --surface: #2a2420;
  --line: #4a3d33;
  --fg: #f1e9da;
  --muted: #bcae9a;
  --accent: #e0a35e;
  --ab-1: #4f3826;
  --ab-2: #7d5634;
  --ab-3: #66584a;
  --mar: #8fc1d6;
  --she: #ebdfc8;
  --amr: #a7bd8f;
  --ink: #1f1813;
  --dim: #3b332c;
  --display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --body: "Work Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f6f1e7; --surface: #ffffff; --line: #d9d0c2; --fg: #2a2219; --muted: #6e6354; --accent: #b4752a;
  --ab-1: #d9c7b3; --ab-2: #c9a98a; --ab-3: #cfc4b6; --mar: #5b9bb5; --she: #c9b27f; --amr: #7a9a62; --ink: #1f1813; --dim: #e4ddd1;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 40px 64px;
}
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px; }
header { display: flex; flex-direction: column; gap: 10px; }
.eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
h1 { font-family: var(--display); font-weight: 500; font-size: clamp(34px, 5vw, 52px); line-height: 1.05; margin: 0; text-wrap: balance; }
h2 { font-family: var(--display); font-weight: 500; font-size: clamp(28px, 3.6vw, 40px); margin: 0; line-height: 1.1; }
h3 { margin: 0; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.lede { color: var(--muted); max-width: 62ch; margin: 0; }

.setlist { display: flex; flex-wrap: wrap; gap: 10px; list-style: none; margin: 0; padding: 0; }
.setlist li { display: flex; }
.setlist button { font: inherit; color: var(--fg); background: transparent; display: flex; align-items: baseline; gap: 10px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
.setlist button:hover { border-color: var(--muted); }
.setlist button[aria-selected="true"] { border-color: var(--accent); background: var(--surface); }
.setlist button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.later { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-top: 4px; }
.later ul { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
.later li { font-size: 13.5px; color: var(--muted); padding: 6px 12px; border: 1px dashed var(--line); border-radius: 6px; }
.song-title { display: flex; flex-direction: column; gap: 10px; min-width: 0; max-width: 72ch; }
.blurb { margin: 0; font-size: 16px; color: var(--fg); }
.meta-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
.meta-row li { font-size: 12.5px; color: var(--muted); padding: 4px 10px; border-radius: 4px; background: var(--surface); }
.meta-row li b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.setlist .n { font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 600; font-size: 13px; }
.setlist .todo { color: var(--muted); font-style: italic; }

.song { display: flex; flex-direction: column; gap: 22px; }
.song-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; }
.song-head .meta { color: var(--muted); font-size: 13px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: inherit; font-size: 13px; font-weight: 500; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px 6px 10px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.chip .dot { width: 10px; height: 10px; border-radius: 50%; }
.chip[aria-pressed="true"] { border-color: var(--fg); background: var(--surface); }
.chip:focus-visible, .setlist a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.board-scroll { overflow-x: auto; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.board { min-width: 1240px; display: grid; grid-template-columns: 132px 1fr; padding-block: 18px; }
.label { position: sticky; left: 0; z-index: 2; background: var(--bg); display: flex; flex-direction: column; justify-content: center; padding-right: 14px; min-height: 52px; }
.label b { font-weight: 600; font-size: 14px; }
.label span { font-size: 12px; color: var(--muted); }
.label.sub b { font-weight: 500; color: var(--muted); font-size: 13px; }
.track { position: relative; min-height: 64px; }
.track .grid { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); opacity: .55; }

.sections .track { min-height: 46px; }
.sec { position: absolute; top: 4px; padding: 6px 8px 0 6px; border-top: 2px solid var(--accent); font-size: 12.5px; color: var(--accent); font-weight: 500; line-height: 1.25; }
.sec small { display: block; color: var(--muted); font-weight: 400; font-size: 11.5px; }

.blk { position: absolute; top: 4px; min-height: 56px; border-radius: 5px; padding: 4px 7px; overflow: hidden; display: flex; flex-direction: column; justify-content: center; line-height: 1.2; transition: opacity .2s; }
.blk strong { font-size: 12.5px; font-weight: 500; overflow-wrap: anywhere; }
.blk em { font-style: normal; font-size: 11px; opacity: .8; overflow-wrap: anywhere; }
.blk.ab1 { background: var(--ab-1); color: var(--fg); }
.blk.ab2 { background: var(--ab-2); color: var(--fg); }
.blk.ab3 { background: var(--ab-3); color: var(--fg); }
.blk.mar { background: var(--mar); color: var(--ink); }
.blk.she { background: var(--she); color: var(--ink); }
.blk.amr { background: var(--amr); color: var(--ink); }
.blk.uni { box-shadow: inset 0 0 0 2px var(--ink); }

.cue { position: absolute; display: flex; align-items: center; gap: 7px; font-size: 12.5px; white-space: nowrap; transform: translateX(-5px); }
.cue::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex: none; }
.cue.r1 { top: 6px; } .cue.r2 { top: 28px; } .cue.r3 { top: 50px; }
.cues .track { min-height: 56px; }

.board.focus .blk:not(.hit) { background: var(--dim); color: var(--muted); box-shadow: none; opacity: 1; }
.board.focus .label[data-who]:not(.hit) { opacity: .55; }
.board.focus .label[data-who].hit b { color: var(--accent); }

.legend { display: flex; flex-wrap: wrap; gap: 18px; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 8px; }
.legend i { width: 22px; height: 12px; border-radius: 3px; display: inline-block; }

.sheets { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.sheet { background: var(--surface); border-radius: 8px; padding: 18px 18px 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; transition: opacity .2s; }
.sheet .who { display: flex; align-items: center; gap: 10px; }
.sheet .who .dot { width: 12px; height: 12px; border-radius: 50%; }
.sheet .who b { font-family: var(--display); font-size: 24px; font-weight: 600; }
.sheet .who span { color: var(--muted); font-size: 12.5px; }
.sheet ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; }
.sheet li { display: grid; grid-template-columns: 26px 1fr; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); }
.sheet li .k { font-variant-numeric: tabular-nums; color: var(--accent); font-size: 12px; font-weight: 600; padding-top: 2px; }
.sheet li .what { font-weight: 500; font-size: 14px; }
.sheet li .when { color: var(--accent); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; }
.sheet li .on { font-size: 12.5px; color: var(--fg); margin-top: 3px; } .sheet li .on::before { content: "→ "; color: var(--mar); }
.sheet li .with { font-size: 12px; color: var(--muted); margin-top: 2px; }
.sheet li.rest { opacity: .7; } .sheet li.rest .k { color: var(--muted); }
.sheet .open { color: var(--amr); font-size: 13.5px; }
.sheets.focus .sheet:not(.hit) { opacity: .3; }

.note { color: var(--muted); font-size: 13px; max-width: 70ch; margin: 0; }
@media (prefers-reduced-motion: reduce) { .blk, .sheet { transition: none; } }

/* ---- demo additions ---- */
body { font-size: 14.5px; }
.wrap { gap: 28px; }
.lede { font-size: 14px; }
.setlist button { padding: 6px 12px; font-size: 14px; }
details.later { color: var(--muted); font-size: 13px; } details.later summary { cursor: pointer; list-style: none; } details.later summary::before { content: "+ "; } details.later[open] summary::before { content: "– "; }
details.later ul { margin-top: 8px; }
.blurb { font-size: 13.5px; color: var(--muted); max-width: 60ch; }
.blk { min-height: 48px; padding: 4px 8px; gap: 2px; }
.blk strong { font-size: 12.5px; } .blk em { font-size: 10.5px; opacity: .65; }
.sec { font-size: 12px; } .sec small { font-size: 10.5px; }
.cue { font-size: 11.5px; opacity: .85; }
.label b { font-size: 13px; } .label span { font-size: 11px; }
details.legend { font-size: 12px; } details.legend summary { cursor: pointer; color: var(--muted); } details.legend[open] { display: flex; flex-wrap: wrap; gap: 14px; } details.legend summary { flex-basis: 100%; }
.sheet { padding: 14px 16px; } .sheet li { padding: 7px 0; } .sheet li .what { font-size: 13.5px; font-weight: 400; }
.night-song { padding: 12px 16px; gap: 6px; }
.night-song details { font-size: 13px; } .night-song summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
.night-song .changes { margin-top: 6px; } .night-song .cues { margin-top: 6px; }
.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.topbar .lbl { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.chip.sm { padding: 4px 10px; font-size: 12px; }
#stage[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.patch { display: inline-block; font-size: 10.5px; font-weight: 600; letter-spacing: .02em; padding: 1px 6px; border-radius: 4px; background: rgba(0,0,0,.28); color: inherit; margin-top: 2px; width: max-content; max-width: 100%; }
.sheet .patch, .night-song .patch, .now-strip .patch { background: var(--line); color: var(--fg); }
.cue.from-production::before { background: var(--ab-2); box-shadow: 0 0 0 1px var(--muted); }
.legend .cue-dot { width: 10px; height: 10px; border-radius: 50%; }
.sec.now { background: var(--surface); border-top-color: var(--fg); color: var(--fg); border-radius: 4px; }
.sec { cursor: pointer; }
.now-strip { display: none; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.ns { background: var(--surface); border-radius: 8px; padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ns b { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.ns span { font-size: 15px; }
.ns.cue-marawan b { color: var(--mar); } .ns.cue-ableton b { color: var(--muted); }
.sheets.folded .sheet:not(.mine) { display: none; }
.sheets.folded + .more { display: inline-flex; } .more { display: none; align-self: flex-start; }
.sheet.mine { outline: 1px solid var(--accent); }
#night { display: flex; flex-direction: column; gap: 18px; }
.night-song { background: var(--surface); border-radius: 8px; padding: 14px 18px; display: flex; flex-direction: column; gap: 8px; }
.night-song header { display: flex; align-items: baseline; gap: 12px; }
.night-song header .n { color: var(--accent); font-variant-numeric: tabular-nums; font-size: 12px; font-weight: 600; }
.night-song h3 { font-family: var(--display); font-size: 24px; text-transform: none; letter-spacing: 0; color: var(--fg); font-weight: 600; flex: 1; }
.night-song .entry { margin: 0; font-size: 15px; } .night-song .entry b { color: var(--amr); }
.night-song .wait { margin: 0; font-size: 13.5px; color: var(--muted); } .night-song .wait b { color: var(--fg); font-weight: 500; }
.night-song .rest { margin: 0; color: var(--muted); }
.night-song .changes { margin: 0; padding-left: 18px; font-size: 14px; display: flex; flex-direction: column; gap: 3px; }
.night-song .cues { margin: 0; padding: 0; list-style: none; font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
.night-song .cues li::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; background: var(--mar); }
.night-song .cues li.from-production::before { background: var(--ab-2); box-shadow: 0 0 0 1px var(--muted); }
.muted { color: var(--muted); }
/* stage mode */
body.stage { font-size: 17px; padding-block: 16px 40px; }
body.stage .lede, body.stage .later, body.stage .blurb, body.stage .meta-row, body.stage .legend, body.stage .note, body.stage .sheets, body.stage .more, body.stage h1, body.stage header .eyebrow { display: none !important; }
body.stage .wrap { gap: 18px; }
.stage-view { display: none; }
body.stage .stage-view { display: block; }
body.stage .board-scroll, body.stage .song-head .blurb, body.stage .song-head .eyebrow, body.stage h3, body.stage details.legend { display: none !important; }
body.stage .wrap { max-width: 720px; }
body.stage .song-head { display: none; }
.sbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 18px 0 0; }
.stitle { font-family: var(--display); font-size: 36px; font-weight: 600; line-height: 1.05; margin-bottom: 14px; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.steps li { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 14px; align-items: baseline; padding: 14px 0; border-top: 1px solid var(--line); }
.steps .cue { font-size: 15px; color: var(--muted); } .steps li:not(.rest) .cue { color: var(--fg); }
.steps .cue { position: static; transform: none; white-space: normal; display: block; opacity: 1; }
.steps .cue::before { content: "→ "; color: var(--mar); width: auto; height: auto; border-radius: 0; background: none; display: inline; }
@media (max-width: 560px) { .steps li { grid-template-columns: 1fr; gap: 2px; padding: 12px 0; } .steps .do { font-size: 20px; } }
.steps .do { font-size: 22px; font-weight: 500; }
.steps li.rest .do { color: var(--muted); font-size: 17px; font-weight: 400; }
.steps .patch { font-size: 13px; vertical-align: middle; }
.sbar .big { flex: 1; font: inherit; font-size: 18px; font-weight: 600; padding: 14px; border-radius: 10px; border: 0; background: var(--accent); color: var(--ink); cursor: pointer; }
.slist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.srow { background: var(--surface); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; border: 2px solid transparent; cursor: pointer; }
.srow .sname { font-family: var(--display); font-size: 22px; font-weight: 600; display: flex; gap: 10px; align-items: baseline; }
.srow .num { font-family: var(--body); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.srow .sdo { font-size: 17px; } .srow .sdo b { color: var(--amr); font-weight: 600; }
.srow.off .sdo { color: var(--muted); }
.srow .scue { font-size: 14px; color: var(--muted); } .srow .scue::before { content: "→ "; color: var(--mar); }
.srow.now { border-color: var(--accent); background: #2d241c; }
.srow.now .sdo { font-size: 20px; }
body.stage .song-head h2 { font-size: 30px; }
body.stage .blk strong { font-size: 14px; } body.stage .blk em { font-size: 12px; } body.stage .sec { font-size: 14px; } body.stage .cue { font-size: 14px; }
body.stage .setlist button { padding: 6px 10px; font-size: 14px; }
@media (max-width: 640px) { .now-strip { grid-template-columns: 1fr; } }

.pl-btn { font: inherit; font-size: 10px; line-height: 1; width: 22px; height: 22px; border-radius: 50%; border: 0; background: rgba(0,0,0,.35); color: #fff; cursor: pointer; margin-right: 6px; vertical-align: middle; flex: none; }
.sheet .pl-btn, .steps .pl-btn, .night-song .pl-btn { background: var(--accent); color: var(--ink); }
.blk strong { display: flex; align-items: center; }
/* sound actions */

.sp-cues li.from-production::before { background: var(--ab-2); box-shadow: 0 0 0 1px var(--muted); }

<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Next concert · running order</div>
    <h1>Loading the set…</h1>
    <p class="lede">Pick who you are, then a song. Each song is one board: a lane per player, the backing tracks, and the cues.</p>
    <div class="topbar"><span class="lbl">I am</span><div class="chips" id="me" role="group" aria-label="Who are you"></div><button class="chip" id="stage" type="button" aria-pressed="false">Stage mode</button><button class="chip" id="theme" type="button">Light</button></div>
    <ol class="setlist" id="setlist" role="tablist" aria-label="Songs in running order"><li role="presentation"><button role="tab" id="tab-night" aria-selected="false"><span class="n">★</span><span>My night</span></button></li></ol>
  </header>
  <section id="night" hidden></section>
  <div id="songs"></div>
</div>
<script type="module">
// ---- Shajara send-out: the set from the API, shaped like Marawan's set list ----
const API = (location.hostname === "localhost" || location.hostname === "127.0.0.1") ? "http://localhost:8787" : "https://shajara-api.amrabdelwahab.workers.dev";
const TOKEN = (location.hash.match(/^#([A-Za-z0-9]{10,40})/) || [])[1] || new URLSearchParams(location.search).get("k") || "";
const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const LAYER_WORD = { bloom: "Melody", bark: "Harmony", ground: "Bass", substrate: "Rhythm" };
const PALETTE = ["#8fc1d6", "#a7bd8f", "#ebdfc8", "#e3a7c0", "#c9a7e3", "#f0c27b", "#9fd3c7", "#d6b08f"];
let PLAYERS = {}, SONGS = [];
const actText = a => a.kind === "set" ? `Set your sound: <b>${a.to}</b>` : `Switch to <b>${a.to}</b>`;
const actWhen = (b, secName) => b.s === 0 || (b.act && b.act.kind === "set") ? "Before the song" : `Before ${secName}${b.act && b.act.rest ? ", while you rest" : ""}`;
const cueLead = c => c.from === "production" ? "listen" : "watch " + (PLAYERS[c.from] ? PLAYERS[c.from].name : "the cue");
// Cues read as plain sentences: "Marwan's signal for the theme", "Marwan nods Amr in", "You hear: the drums come in".
const cueName = c => PLAYERS[c.from] ? PLAYERS[c.from].name : "the band";
const cueLine = c => {
  const t = String(c.text), n = cueName(c);

  btns.forEach(b => b.addEventListener("click", () => setMe(b.dataset.who && current !== b.dataset.who ? b.dataset.who : null)));
  wrap._apply = apply;
  const more = el("button", { class: "chip more", type: "button" }, "Show everyone's parts");
  more.addEventListener("click", () => sheets.classList.toggle("folded"));
  sheets.after(more);
  return wrap;
}

// Grow each lane to fit its tallest block, and stack cues into rows so none overlap or leave the board.
function fit(board) {
  board.querySelectorAll(".track").forEach(tr => {
    const items = [...tr.querySelectorAll(".blk, .sec")];
    if (!items.length) return;
    items.forEach(it => { it.style.height = "auto"; });
    const h = Math.max(...items.map(i => i.offsetHeight));
    tr.style.minHeight = (h + 8) + "px";
    items.forEach(it => { if (it.classList.contains("blk")) it.style.height = h + "px"; });
  });
  board.querySelectorAll(".cue-track").forEach(tr => {
    const W = tr.clientWidth, rows = [];
    tr.querySelectorAll(".cue").forEach(c => {
      c.style.transform = "none";
      const w = c.offsetWidth;
      let x = c.offsetLeft;
      if (x + w > W) { x = Math.max(0, W - w); c.style.left = x + "px"; }
      let r = rows.findIndex(end => end + 14 <= x);
      if (r < 0) { r = rows.length; rows.push(0); }
      rows[r] = x + w;
      c.style.top = (6 + r * 22) + "px";
    });
    tr.style.minHeight = (rows.length * 22 + 12) + "px";
  });
}
const fitAll = () => document.querySelectorAll(".song:not([hidden]) .board").forEach(fit);


if (!(await boot())) throw new Error('no set');
renderSetlist();

const host = document.getElementById("songs");
let ME = null;
try { ME = localStorage.getItem("setlist-me") || null; } catch (e) {}
const panels = SONGS.map((s, i) => { const p = renderSong(s, i); p.hidden = true; host.append(p); return p; });
// global identity: one choice, every song follows it
const meChips = document.getElementById("me");
const meBtns = {};
[["", "Everyone"], ...Object.entries(PLAYERS).filter(([k]) => k !== "production").map(([k, p]) => [k, p.name])].forEach(([k, label]) => {
  const b = el("button", { class: "chip", type: "button", "aria-pressed": "false" }, (k ? `<i class="dot" style="background:${PLAYERS[k].color}"></i>` : "") + label);
  b.addEventListener("click", () => setMe(k || null)); meChips.append(b); meBtns[k] = b;
});
function setMe(who) {
  ME = who; Object.entries(meBtns).forEach(([k, b]) => b.setAttribute("aria-pressed", String((k || null) === who)));
  panels.forEach(p => p._apply(who)); renderNight(); writeHash();
  try { who ? localStorage.setItem("setlist-me", who) : localStorage.removeItem("setlist-me"); } catch (e) {}
}
// My night: the whole set from one player's side
const night = document.getElementById("night");
function renderNight() {
  night.innerHTML = "";
  if (!ME) { night.append(el("p", { class: "lede" }, "Pick who you are (top of the page) and this becomes your whole night in order: when you come in, with what sound, what changes, and which cues you wait for.")); return; }
  const p = PLAYERS[ME];
  night.append(el("div", { class: "song-title" }, `<div class="eyebrow">My night</div><h2>${p.name} · ${p.role}</h2>`));
  SONGS.forEach((song, i) => {
    const blocks = song.lanes.filter(l => l.who === ME).flatMap(l => l.blocks).sort((a, b) => a.s - b.s);
    const card = el("article", { class: "night-song" });
    const secName = x => song.sections[Math.min(Math.floor(x), song.sections.length - 1)].name;
    const first = blocks[0];
    let html = `<header><span class="n">${String(i + 1).padStart(2, "0")}</span><h3>${song.title}</h3><button class="chip sm" type="button" data-go="${i}">Open</button></header>`;
    if (!first) html += `<p class="rest">You sit this one out.</p>`;
    else {
      const k = Math.floor(first.s), n = song.sections.length;
      if (k > 0) html += `<p class="wait">You wait through <b>${song.sections.slice(0, k).map(s => s.name).join(" · ")}</b>${k === 1 ? " (1 section)" : ` (${k} sections)`}.</p>`;
      if (first.act) html += `<p class="act">⇄ ${actText(first.act)}</p>`;
      html += `<p class="entry">${k > 0 ? `Then you start at <b>${secName(first.s)}</b> (section ${k + 1} of ${n})` : `You play <b>from the top</b>`}: ${first.what} · ${first.tone}.</p>`;
      const changes = blocks.slice(1);
      if (changes.length) html += `<ol class="changes">${changes.map(b => `<li><b>${secName(b.s)}</b> ${b.what} · ${b.tone}</li>`).join("")}</ol>`;
      const sw = blocks.slice(1).filter(b => b.act);
      if (sw.length) html = html.replace(/(<ol class="changes">|$)/, m => `${sw.map(b => `<p class="act">⇄ ${actWhen(b, secName(b.s))}: ${actText(b.act)}</p>`).join("")}${m}`);
    }
    html = html.replace(/<ol class="changes">[\s\S]*$/, m => `<details><summary>Changes and cues</summary>${m}`) ;
    if (!/<details>/.test(html) && first) html += `<details><summary>Cues</summary>`;
    if (first) html += `<ul class="cues">${song.cues.map(c => `<li class="from-${c.from}"><b>${secName(c.at)}</b> ${cueLine(c)}</li>`).join("")}</ul></details>`;
    card.innerHTML = html; card.querySelector("[data-go]").addEventListener("click", () => show(i)); night.append(card);
  });
}
// stage mode: big type, only what matters, screen stays awake, swipe between songs
const themeBtn = document.getElementById("theme");
const setTheme = t => { document.documentElement.dataset.theme = t; themeBtn.textContent = t === "light" ? "Dark" : "Light"; try { localStorage.setItem("setlist-theme", t); } catch (e) {} };
try { setTheme(localStorage.getItem("setlist-theme") || "dark"); } catch (e) { setTheme("dark"); }
themeBtn.addEventListener("click", () => setTheme(document.documentElement.dataset.theme === "light" ? "dark" : "light"));
const stageBtn = document.getElementById("stage");
let wake = null;
stageBtn.addEventListener("click", async () => {
  const on = document.body.classList.toggle("stage"); stageBtn.setAttribute("aria-pressed", String(on));
  try { if (on && navigator.wakeLock) wake = await navigator.wakeLock.request("screen"); else if (wake) { wake.release(); wake = null; } } catch (e) {}
  fitAll();
});
let tx = null;
host.addEventListener("touchstart", e => { tx = e.touches[0].clientX; }, { passive: true });
host.addEventListener("touchend", e => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; tx = null; if (Math.abs(dx) > 70) show(cur() + (dx < 0 ? 1 : -1)); }, { passive: true });
document.addEventListener("keydown", e => { if (e.target.closest("button, input")) return; const p = panels[cur()]; if (!p || p.hidden) return; if (e.key === "ArrowDown" || e.key === "n") p._next(); if (e.key === "ArrowUp" || e.key === "p") p._prev(); });
function cur() { return panels.findIndex(p => !p.hidden); }
function writeHash() { const i = cur(); if (i < 0 && night.hidden) return; const h = (i >= 0 ? "s=" + (i + 1) : "night") + (ME ? "&me=" + ME : ""); history.replaceState(null, "", "#" + h); }
const tabs = [...document.querySelectorAll('#setlist [role="tab"]:not(#tab-night)')];
function show(i) {
  if (i === "night") { panels.forEach(p => { p.hidden = true; }); night.hidden = false; tabs.forEach(t => t.setAttribute("aria-selected", "false")); nightTab.setAttribute("aria-selected", "true"); writeHash(); return; }
  i = Math.max(0, Math.min(SONGS.length - 1, i));
  night.hidden = true; nightTab.setAttribute("aria-selected", "false");
  panels.forEach((p, j) => { p.hidden = j !== i; });
  tabs.forEach((t, j) => { t.setAttribute("aria-selected", String(j === i)); t.tabIndex = j === i ? 0 : -1; });
  fitAll(); writeHash();
  try { localStorage.setItem("setlist-tab", String(i)); } catch (e) {}
}
const nightTab = document.getElementById("tab-night"); nightTab.addEventListener("click", () => show("night"));
tabs.forEach((t, i) => {
  t.addEventListener("click", () => show(i));
  t.addEventListener("keydown", e => {
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
      const n = (i + (e.key === "ArrowRight" ? 1 : -1) + tabs.length) % tabs.length;
      show(n); tabs[n].focus(); e.preventDefault();
    }
  });
});
let start = 0;
try { const v = parseInt(localStorage.getItem("setlist-tab"), 10); if (!isNaN(v)) start = v; } catch (e) {}
const H = new URLSearchParams(location.hash.slice(1));
if (H.get("me") && PLAYERS[H.get("me")]) ME = H.get("me");
if (H.get("s")) start = parseInt(H.get("s"), 10) - 1;
const wantNight = location.hash.startsWith("#night");
setMe(ME);
show(wantNight ? "night" : start);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);
window.addEventListener("resize", fitAll);
