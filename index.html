<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shajara</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shajara">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=Aref+Ruqaa:wght@400;700&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..600&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --bg: #000;
  --surface: #111;
  --surface-2: #1b1b1b;
  --line: #2b2b2b;
  --text: #fff;
  --muted: #a4a4a4;
  --faint: #626262;
  --accent: #ffce00;
  --primary: #fff;
  --primary-ink: #000;
  --danger: #ff5a4e;
  --brand-green: #00ce7a;
  --brand-blue: #0051c6;
  --brand-yellow: #ffce00;
  --bloom: #ffce00;
  --bark: #f2efe6;
  --ground: #00ce7a;
  --substrate: #2f6ef2;
  --transition: #fff;
  --radius: 18px;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --serif: "Newsreader", "Iowan Old Style", Georgia, serif;
  --sans: "Archivo", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --arabic: "Aref Ruqaa", "Noto Naskh Arabic", "Geeza Pro", serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 var(--sans); }
html { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
button { touch-action: manipulation; -webkit-user-select: none; user-select: none; }
.tap.flash { animation: tapflash .18s ease-out; }
@keyframes tapflash { from { background: var(--brand-yellow); color: #000; border-color: var(--brand-yellow); } }
.tap { min-width: 104px; }
body { min-height: 100dvh; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); overscroll-behavior-y: contain; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
a { color: var(--accent); }
.wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 140px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 13px; }
.hidden { display: none !important; }
.disp { font-family: var(--display); font-stretch: 125%; font-weight: 800; text-transform: uppercase; letter-spacing: .01em; }
.ar { font-family: var(--arabic); font-weight: 400; direction: rtl; word-spacing: .25em; }
.serif { font-family: var(--serif); }

.top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.top-in { max-width: 640px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 10px; min-height: 58px; }
.top h1 { font: 800 17px/1.15 var(--display); font-stretch: 125%; text-transform: uppercase; letter-spacing: .01em; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top .logo { height: 36px; width: auto; display: block; }
.icon-btn { width: 40px; height: 40px; border-radius: 999px; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); flex: none; }
.icon-btn svg { width: 19px; height: 19px; }
.icon-btn.sm { width: 34px; height: 34px; }
.icon-btn.sm svg { width: 16px; height: 16px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 18px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); font: 700 13px/1.1 var(--display); font-stretch: 112%; text-transform: uppercase; letter-spacing: .03em; }
.btn svg { width: 17px; height: 17px; }
.btn.primary { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.btn.danger { background: transparent; color: var(--danger); border: 1px solid color-mix(in srgb, var(--danger) 45%, transparent); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; }

input[type=text], input[type=password], input[type=number], input[type=url], textarea {
  width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; outline: none; font-family: var(--serif); font-size: 17px;
}
input:focus, textarea:focus { border-color: var(--text); }
textarea { resize: vertical; min-height: 90px; }
label.field { display: block; margin: 18px 0 7px; font: 700 11px/1.2 var(--display); font-stretch: 112%; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }

/* gate */
.gate { min-height: 88dvh; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
.gate .logo-big { height: 170px; width: auto; align-self: center; margin-bottom: 10px; }
.gate h2 { font: 800 30px/1.05 var(--display); font-stretch: 125%; text-transform: uppercase; margin: 0; text-align: center; }
.gate .ar-sub { text-align: center; font-size: 26px; color: var(--muted); margin-top: -6px; }
.gate p { margin: 0 0 8px; text-align: center; font-family: var(--serif); font-size: 17px; }
.gate .handle { text-align: center; color: var(--brand-yellow); font-family: var(--serif); font-size: 14px; }
.people { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.person { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; text-align: left; min-height: 78px; }
.person b { display: block; font: 800 15px/1.2 var(--display); font-stretch: 125%; text-transform: uppercase; }
.person .small { font-family: var(--serif); font-style: italic; }

/* home */
.hello { margin: 8px 0 20px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.hello h2 { font: 800 26px/1.05 var(--display); font-stretch: 125%; text-transform: uppercase; margin: 0; }
.hello .ar { font-size: 28px; color: var(--muted); line-height: 1.2; }
.track-row { display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 14px 12px; margin-bottom: 12px; position: relative; }
.track-row { cursor: pointer; }
.track-row .tr-top { display: flex; align-items: flex-start; gap: 8px; }
.track-row .t { flex: 1; font: 800 18px/1.15 var(--display); font-stretch: 125%; text-transform: uppercase; }
.track-row .kebab { margin: -6px -6px 0 0; padding: 4px 8px; font-size: 20px; color: var(--muted); }
.track-row .dot { position: static; margin-top: 1px; }
.list-head { display: flex; justify-content: space-between; align-items: baseline; margin: 24px 0 10px; }
.list-head b { font: 800 13px/1 var(--display); font-stretch: 125%; text-transform: uppercase; letter-spacing: .02em; }
.list-head .ar { font-size: 22px; color: var(--muted); }
.menu { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.menu-item { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); text-align: left; }
.menu-item svg { width: 19px; height: 19px; flex: none; }
.menu-item b { display: block; font: 800 12px/1.2 var(--display); font-stretch: 112%; text-transform: uppercase; letter-spacing: .03em; }
.menu-item .small { display: block; font: italic 14px/1.3 var(--serif); margin-top: 3px; }
.menu-item.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 35%, var(--line)); }
.btn.danger-solid { background: var(--danger); border-color: var(--danger); color: #000; }
.member-row .nm-act { display: flex; align-items: center; gap: 10px; }
.track-row .meta { font: italic 14px/1.3 var(--serif); color: var(--muted); margin: 4px 0 8px; }
.track-row .form-line { font: 700 11px/1.3 var(--display); font-stretch: 112%; text-transform: uppercase; letter-spacing: .05em; color: var(--text); margin-bottom: 10px; }
.track-row .form-line .arr { color: var(--brand-yellow); padding: 0 6px; }
.dot { position: absolute; top: 16px; right: 14px; color: var(--brand-yellow); font-size: 16px; line-height: 1; }
.mini-tree { display: flex; flex-direction: column; gap: 4px; }
.mini-layer { display: grid; grid-template-columns: 82px 1fr auto; gap: 8px; align-items: center; border-radius: 9px; padding: 6px 9px; font-size: 13px; background: color-mix(in srgb, var(--c) 12%, transparent); }
.mini-layer .ln { font: 800 9px/1 var(--display); font-stretch: 125%; letter-spacing: .06em; text-transform: uppercase; color: var(--c); }
.mini-layer .who { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--serif); font-size: 14px; }
.mini-layer .bt { font-size: 12px; color: color-mix(in srgb, var(--c) 75%, var(--text)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px; font-family: var(--serif); font-style: italic; }
.mini-layer .open { color: var(--faint); font-style: italic; }
.empty { text-align: center; padding: 48px 12px; color: var(--muted); font-family: var(--serif); font-size: 18px; }
.fab { position: fixed; right: max(16px, calc(50% - 304px)); bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 6; box-shadow: 0 10px 28px rgba(0,0,0,.6); padding: 16px 22px; }

.legend { border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-top: 4px; font-size: 14px; }
.legend h4 { margin: 0 0 8px; font: 800 13px/1.2 var(--display); font-stretch: 125%; text-transform: uppercase; display: flex; justify-content: space-between; align-items: baseline; }
.legend h4 .ar { font-size: 20px; color: var(--muted); text-transform: none; }
.legend .l { display: grid; grid-template-columns: 150px 1fr; padding: 4px 0; align-items: baseline; }
.legend b { color: var(--c); font: 800 11px/1.3 var(--display); font-stretch: 125%; text-transform: uppercase; }
.legend span { font-family: var(--serif); }
.legend p { margin: 10px 0 0; color: var(--muted); font: 15px/1.45 var(--serif); }

/* track */
.hero { padding: 4px 0 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 7px 13px; font: 16px/1.2 var(--serif); display: inline-flex; align-items: baseline; gap: 7px; }
.chip .k { color: var(--muted); font: 700 9px/1 var(--display); font-stretch: 112%; text-transform: uppercase; letter-spacing: .06em; }
.chip.ghost { color: var(--faint); border-style: dashed; background: transparent; font-style: italic; }
.notes { display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-top: 10px; white-space: pre-wrap; font: 16px/1.45 var(--serif); color: color-mix(in srgb, var(--text) 88%, var(--muted)); }

.form { display: flex; align-items: center; gap: 6px; overflow-x: auto; padding: 2px 16px 4px; margin: 0 -16px 16px; scrollbar-width: none; }
.form::-webkit-scrollbar { display: none; }
.sec-pill { flex: none; padding: 10px 15px 9px; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--line); font: 800 13px/1.1 var(--display); font-stretch: 125%; text-transform: uppercase; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.sec-pill .dots { display: flex; gap: 3px; }
.sec-pill .dots i { width: 7px; height: 7px; border-radius: 2px; background: var(--c); opacity: .18; }
.sec-pill .dots i.on { opacity: 1; }
.sec-pill.sel { border-color: var(--text); background: var(--surface-2); }
.tr-pill { flex: none; height: 34px; min-width: 34px; padding: 0 9px; border-radius: 999px; display: grid; grid-auto-flow: column; align-items: center; gap: 3px; color: var(--brand-yellow); border: 1.5px dashed var(--line); font-size: 13px; }
.tr-pill.has { border-style: solid; border-color: color-mix(in srgb, var(--brand-yellow) 60%, transparent); }
.tr-pill.sel { background: var(--brand-yellow); color: #000; border-color: var(--brand-yellow); }
.tr-pill b { font: 800 10px/1 var(--display); }
.sheet { position: relative; }
.sheet-x { position: sticky; top: 0; float: right; z-index: 3; width: 36px; height: 36px; margin: -2px -4px 0 0; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--line); color: var(--text); font-size: 15px; display: grid; place-items: center; }
.sec-title { cursor: pointer; }
.sec-title .ren { font-size: 14px; color: var(--faint); margin-left: 8px; vertical-align: 4px; }
.ms-row { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
.ms-row input { flex: 1; padding: 10px 12px; }
.ms-row .icon-btn:disabled { opacity: .3; }
.prod-l { margin-top: 8px; border-radius: 12px; border: 1px solid var(--line); padding: 10px 12px; }
.prod-l.on { border-color: color-mix(in srgb, var(--c) 60%, var(--line)); }
.prod-t { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; }
.prod-t b { font: 800 11px/1.2 var(--display); font-stretch: 112%; text-transform: uppercase; letter-spacing: .03em; color: var(--c); }
.prod-t .check { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--line); display: grid; place-items: center; font-size: 13px; flex: none; }
.prod-l.on .prod-t .check { background: var(--c); border-color: var(--c); color: #000; }
.prod-what input { margin-top: 8px; padding: 9px 11px; font-size: 16px; }
.switch-btn { flex: none; height: 40px; padding: 0 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--text); font: 800 11px/1 var(--display); font-stretch: 112%; text-transform: uppercase; letter-spacing: .04em; display: inline-flex; align-items: center; gap: 6px; }
.lp { padding-top: 24px; padding-bottom: 60px; }
.lp-new { margin-top: 12px; border-style: dashed; }
.lp-new-hint { text-align: center; font-style: italic; margin: 8px 0 0; }
@media (min-width: 900px) {
  .wrap.lp { max-width: 1120px; padding-left: 32px; padding-right: 32px; }
  .lp-grid { display: grid; grid-template-columns: minmax(340px, 420px) 1fr; gap: 40px; align-items: start; }
  .lp-left { position: sticky; top: 24px; }
  .lp-hero { padding-top: 8px; }
  .lp-right { padding-top: 8px; }
  .lp-right .lp-card { padding: 22px 24px; }
}
.lp section { margin-bottom: 18px; }
.lp-hero { text-align: center; padding: 24px 0 8px; }
.lp-logo { width: 240px; max-width: 70%; height: auto; display: block; margin: 0 auto 18px; }
.lp-hero h1 { font: 800 34px/1 var(--display); font-stretch: 125%; text-transform: uppercase; margin: 0; display: flex; align-items: baseline; justify-content: center; gap: 12px; }
.lp-hero h1 .ar { font-size: 30px; color: var(--muted); text-transform: none; }
.lp-tag { font: italic 22px/1.3 var(--serif); margin: 14px 0 10px; color: var(--brand-yellow); }
.lp-lede { font: 18px/1.5 var(--serif); color: color-mix(in srgb, var(--text) 85%, var(--muted)); margin: 0 auto; max-width: 520px; }
.lp h3 { font: 800 13px/1.2 var(--display); font-stretch: 125%; text-transform: uppercase; letter-spacing: .04em; margin: 0 0 12px; }
.lp-open { padding: 16px; border-radius: var(--radius); border: 1px solid color-mix(in srgb, var(--brand-yellow) 40%, var(--line)); background: var(--surface); }
.lp-open .menu { margin-top: 0; }
.lp-card { padding: 18px 16px; border-radius: var(--radius); border: 1px solid var(--line); }
.lp-card p { font: 17px/1.55 var(--serif); color: color-mix(in srgb, var(--text) 85%, var(--muted)); margin: 0 0 10px; }
.lp-card p:last-child { margin-bottom: 0; }
.lp-sketch { display: flex; align-items: flex-end; justify-content: center; gap: 10px; padding: 16px 8px 18px; margin-bottom: 8px; border-radius: 14px; background: #000; border: 1px solid var(--line); }
.lp-sec { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px 12px 8px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.lp-sec b { font: 800 11px/1 var(--display); font-stretch: 125%; text-transform: uppercase; }
.lp-layers { display: flex; align-items: flex-end; gap: 4px; height: 32px; }
.lp-layers i { width: 9px; border-radius: 3px; background: var(--c); min-height: 3px; }
.lp-arr { color: var(--brand-yellow); align-self: center; }
.lp-step { display: flex; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); }
.lp-sketch + .lp-step { border-top: 0; }
.lp-n { width: 28px; height: 28px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--brand-yellow); color: #000; font: 800 13px/1 var(--display); }
.lp-step b { display: block; font: 800 12px/1.2 var(--display); font-stretch: 112%; text-transform: uppercase; letter-spacing: .03em; margin: 5px 0 4px; }
.lp-step p { margin: 0; font-size: 16px; }
.lp-tree { display: grid; grid-template-columns: 120px 1fr; gap: 14px; align-items: center; margin-bottom: 14px; }
.lp-tree svg { width: 120px; height: auto; display: block; }
.lp-layers-list { display: grid; gap: 10px; }
.lp-layers-list b { display: block; font: 800 11px/1.2 var(--display); font-stretch: 125%; text-transform: uppercase; color: var(--c); }
.lp-layers-list span { font: italic 15px/1.35 var(--serif); color: var(--muted); }
.lp-for { display: grid; gap: 10px; }
.lp-for div { padding: 12px 14px; border-radius: 12px; background: var(--surface); }
.lp-for b { display: block; font: 800 11px/1.2 var(--display); font-stretch: 125%; text-transform: uppercase; color: var(--brand-yellow); margin-bottom: 4px; }
.lp-for span { font: 16px/1.45 var(--serif); color: color-mix(in srgb, var(--text) 85%, var(--muted)); }
.lp-foot { text-align: center; font: 14px/1.4 var(--serif); color: var(--muted); margin-top: 24px; }
.lp-foot b { font-family: var(--serif); color: var(--text); }
.gate-space { justify-content: flex-start; text-align: left; gap: 14px; }
.gs-logo { flex: none; }
.gs-logo.tall { height: 44px; width: auto; }
.gs-logo.round, .gs-logo.fit { width: 44px; height: 44px; border-radius: 50%; object-fit: contain; }
.gs-logo.fit { border-radius: 10px; }
.top .logo.round, .top .logo.fit { width: 36px; height: 36px; border-radius: 50%; object-fit: contain; }
.top .logo.fit { border-radius: 8px; }
.gate .logo-big.round, .gate .logo-big.fit { width: 150px; height: 150px; border-radius: 50%; object-fit: contain; }
.gate .logo-big.fit { border-radius: 20px; }
.coach { position: fixed; inset: 0; z-index: 60; opacity: 0; transition: opacity .18s ease-out; }
.coach.ready { opacity: 1; }
.coach-hole { position: fixed; border-radius: 16px; box-shadow: 0 0 0 9999px rgba(0,0,0,.74); pointer-events: none; }
.coach-hole::after { content: ""; position: absolute; inset: -3px; border-radius: 19px; border: 2px solid var(--brand-yellow); }
/* Between steps the highlight and the tip glide to their next place; while following a scroll they don't lag. */
.coach.glide .coach-hole { transition: left .32s cubic-bezier(.2,.8,.2,1), top .32s cubic-bezier(.2,.8,.2,1), width .32s cubic-bezier(.2,.8,.2,1), height .32s cubic-bezier(.2,.8,.2,1); }
.coach.glide .coach-tip { transition: left .32s cubic-bezier(.2,.8,.2,1), top .32s cubic-bezier(.2,.8,.2,1), bottom .32s cubic-bezier(.2,.8,.2,1); }
.coach-tip p, .coach-n { transition: opacity .16s ease-out; }
.coach.swap .coach-tip p, .coach.swap .coach-n { opacity: 0; }
.coach-tip { position: fixed; background: var(--brand-yellow); color: #000; border-radius: 16px; padding: 14px 14px 10px; box-shadow: 0 12px 30px rgba(0,0,0,.5); }
.coach-tip::before { content: ""; position: absolute; left: calc(var(--ax) - 8px); top: -8px; border: 8px solid transparent; border-top: 0; border-bottom-color: var(--brand-yellow); }
.coach-tip.up::before { top: auto; bottom: -8px; border-bottom: 0; border-top: 8px solid var(--brand-yellow); }
.coach-tip p { margin: 0 0 10px; font: 700 17px/1.3 var(--serif); }
.coach-act { display: flex; align-items: center; gap: 10px; }
.coach-skip { font: 700 11px/1 var(--display); text-transform: uppercase; letter-spacing: .04em; color: rgba(0,0,0,.6); }
.coach-n { flex: 1; text-align: center; font: 700 11px/1 var(--display); color: rgba(0,0,0,.55); }
.coach-next { background: #000 !important; color: var(--brand-yellow) !important; border-color: #000 !important; padding: 10px 16px; }
.home .hello { margin-bottom: 14px; }
.people-row { display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px 8px; padding: 4px 16px 10px; scrollbar-width: none; }
.people-row::-webkit-scrollbar { display: none; }
.pp { flex: none; width: 66px; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 6px 2px; border-radius: 14px; }
.pp.on { background: var(--surface-2); }
.pp-n { font: 800 10px/1.1 var(--display); font-stretch: 112%; text-transform: uppercase; letter-spacing: .02em; max-width: 64px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pp-c { font: italic 11px/1 var(--serif); color: var(--faint); min-height: 11px; }
.av { width: 44px; height: 44px; border-radius: 50%; display: inline-grid; place-items: center; flex: none; background: var(--surface-2); border: 1.5px solid var(--line); font: 800 14px/1 var(--display); color: var(--text); }
.av.me { border: 2px solid var(--brand-yellow); color: var(--brand-yellow); }
.av.guest { border-style: dashed; color: var(--muted); }
.av.xs { width: 22px; height: 22px; font-size: 9px; border-width: 1px; }

.pb-in { max-width: 608px; margin: 0 auto; display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; border-radius: 16px; background: #1c1c1c; border: 1px solid color-mix(in srgb, var(--text) 30%, var(--line)); box-shadow: 0 8px 24px rgba(0,0,0,.6); pointer-events: auto; }
.pb-in > svg { width: 18px; height: 18px; flex: none; }
.pb-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.pb-txt b { font: 800 11px/1.1 var(--display); font-stretch: 112%; text-transform: uppercase; letter-spacing: .03em; }
.pb-txt span { font: italic 13px/1.2 var(--serif); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pb-in .btn { padding: 9px 12px; }
.part-tag { font: 800 9px/1 var(--display) !important; font-stretch: 125%; letter-spacing: .07em; text-transform: uppercase; color: var(--brand-yellow); font-style: normal !important; }
.transition-card { border-radius: var(--radius); background: var(--surface); border: 1.5px dashed color-mix(in srgb, var(--brand-yellow) 45%, var(--line)); padding-top: 4px; }
.transition-card .lede { padding: 10px 14px 6px; color: var(--muted); font: italic 15px/1.4 var(--serif); margin: 0; }

.player { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.play { width: 38px; height: 38px; border-radius: 50%; background: var(--c, var(--text)); color: #000; display: grid; place-items: center; flex: none; }
.play svg { width: 15px; height: 15px; }
.bar { flex: 1; height: 5px; border-radius: 3px; background: var(--surface-2); position: relative; overflow: hidden; }

.time { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 38px; text-align: right; }
.roll { display: block; width: 100%; height: 56px; margin-top: 6px; border-radius: 8px; background: #000; border: 1px solid var(--line); }

/* transport */

.tp-play { flex: 1; min-width: 0; padding: 0 10px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; background: var(--primary); color: var(--primary-ink); font: 800 12px/1 var(--display); font-stretch: 125%; text-transform: uppercase; letter-spacing: .02em; min-height: 50px; }

.tempo { display: flex; align-items: center; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); flex: none; }

.tempo .v { min-width: 34px; text-align: center; line-height: 1; cursor: pointer; }
.tempo .v b { display: block; font: 800 16px/1 var(--display); font-variant-numeric: tabular-nums; }
.tempo .v span { font: 700 8px/1 var(--display); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.tempo .v.unset b { color: var(--faint); }

/* sheet */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 20; display: flex; align-items: flex-end; justify-content: center; animation: fade .15s ease-out; }
.sheet { width: 100%; max-width: 640px; max-height: 92dvh; overflow: auto; background: #0a0a0a; border-radius: 24px 24px 0 0; padding: 10px 16px calc(20px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); animation: rise .2s ease-out; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(24px); opacity: .6; } }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 14px; }

.sheet .actions { display: flex; gap: 10px; margin-top: 20px; }

.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tempo-row { display: flex; gap: 8px; }
.tempo-row input { flex: 1; }
.sugs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.sug { font: 15px/1.1 var(--serif); padding: 7px 12px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); }
.sug.on { background: var(--c, var(--text)); border-color: var(--c, var(--text)); color: #000; font-weight: 600; }
.sug .chk { font: 700 8px/1 var(--display); font-style: normal; text-transform: uppercase; letter-spacing: .05em; color: var(--brand-yellow); margin-left: 3px; vertical-align: 2px; }
.sug-group .ar { font-size: 15px; text-transform: none; letter-spacing: 0; margin-left: 6px; }
.sug-group { font: 700 10px/1 var(--display); font-stretch: 112%; color: var(--faint); letter-spacing: .07em; text-transform: uppercase; margin: 12px 0 -1px; }
.meter-preview { font: 800 30px/1 var(--display); font-stretch: 125%; margin-top: 10px; }

/* beat editor */
.grid { display: grid; gap: 6px; margin-top: 8px; }
.grid button { aspect-ratio: 1; border-radius: 10px; border: 1.5px solid color-mix(in srgb, var(--c) 35%, transparent); font: 800 14px/1 var(--display); color: #000; }
.grid button.D { background: var(--c); border-color: var(--c); }
.grid button.T { background: color-mix(in srgb, var(--c) 50%, transparent); border-color: transparent; color: #fff; }
.grid button.K { background: color-mix(in srgb, var(--c) 20%, transparent); border-color: transparent; color: var(--muted); }
.grid button.R { color: var(--faint); font-weight: 400; }
.grid button.now { outline: 2px solid var(--text); outline-offset: 2px; }

.bar-label { font: 700 10px/1 var(--display); color: var(--faint); letter-spacing: .07em; text-transform: uppercase; margin: 14px 0 0; }
.pulse-hint { font: italic 14px/1.35 var(--serif); color: var(--muted); margin-top: 10px; }

/* recorders */
.rec-stage { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px 0 6px; }
.rec-big { width: 96px; height: 96px; border-radius: 50%; background: var(--danger); display: grid; place-items: center; transition: box-shadow .08s; }
.rec-big i { width: 34px; height: 34px; border-radius: 50%; background: #fff; transition: border-radius .2s, width .2s, height .2s; }

.rec-time { font: 800 28px/1 var(--display); font-variant-numeric: tabular-nums; }
.count { font: 800 12px/1.3 var(--display); font-stretch: 112%; text-transform: uppercase; color: var(--brand-yellow); min-height: 16px; letter-spacing: .05em; text-align: center; }
.toggle { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); padding: 12px 14px; border-radius: 14px; width: 100%; text-align: left; margin-top: 8px; }
.toggle b { font: 800 11px/1.3 var(--display); font-stretch: 112%; text-transform: uppercase; letter-spacing: .03em; }
.toggle .small { font: 14px/1.35 var(--serif); }

.toggle .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left .2s; }
.toggle.on .sw { background: var(--brand-green); }
.toggle.on .sw::after { left: 19px; }
.midi-status { display: flex; align-items: center; gap: 8px; font: italic 15px/1.3 var(--serif); color: var(--muted); margin-top: 6px; }

.midi-status.live i { background: var(--brand-green); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand-green) 25%, transparent); }
.midi-status.hit i { background: var(--brand-yellow); }

.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #fff; color: #000; padding: 11px 16px; border-radius: 999px; z-index: 40; font: 15px/1.3 var(--serif); max-width: 90vw; }
.member-row { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px; }
.member-row .nm { display: flex; justify-content: space-between; align-items: center; }
.member-row .nm b { font: 800 14px/1.2 var(--display); font-stretch: 125%; text-transform: uppercase; }
.me-tag { font: 800 10px/1 var(--display); color: var(--brand-yellow); letter-spacing: .06em; text-transform: uppercase; }

.lineup { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; text-align: left; margin: 0 0 16px; padding: 12px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); }

.lu { font: 14px/1.2 var(--serif); padding: 4px 10px; border-radius: 999px; background: color-mix(in srgb, var(--c) 20%, transparent); color: color-mix(in srgb, var(--c) 55%, var(--text)); white-space: nowrap; }

.lu-row { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-top: 8px; }
.lu-row .top-l { display: flex; align-items: center; gap: 10px; }

.lu-row .sugs { margin-top: 10px; }
.lu-row .sugs.lay .sug { font: 700 10px/1 var(--display); font-stretch: 112%; text-transform: uppercase; letter-spacing: .04em; padding: 8px 10px; }
.lu-row.prod { border-style: dashed; background: transparent; }
.lu-row.guest-add { border-style: dashed; background: transparent; }
.lu-row.guest-add .row2 input { padding: 9px 11px; font-size: 16px; }
.energy { display: inline-flex; align-items: flex-end; gap: 2px; height: 14px; vertical-align: -1px; }
.energy i { width: 3px; border-radius: 1px; background: currentColor; opacity: .22; }
.energy i.on { opacity: 1; background: var(--brand-yellow); }
.energy.lg { height: 16px; } .energy.lg i { width: 4px; }
.sec-pill .nm { display: block; }
.sec-pill .pill-foot { display: flex; align-items: flex-end; gap: 8px; }
.sec-facts { margin: 0 0 12px; }
.chip.own { border-color: color-mix(in srgb, var(--text) 55%, var(--line)); }
.chip .energy { margin-right: 2px; }
.moves { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
.move { font: 15px/1.25 var(--serif); padding: 7px 12px; border-radius: 12px; background: color-mix(in srgb, var(--brand-yellow) 10%, var(--surface)); border: 1px solid color-mix(in srgb, var(--brand-yellow) 35%, var(--line)); text-align: left; }
.move b { font: 800 10px/1 var(--display); font-stretch: 112%; text-transform: uppercase; letter-spacing: .04em; color: var(--brand-yellow); }
.move.ghost { background: transparent; border-style: dashed; border-color: var(--line); color: var(--faint); font-style: italic; }
.mv-row { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-top: 6px; }
.mv-row.on { border-color: color-mix(in srgb, var(--brand-yellow) 55%, var(--line)); }
.mv-toggle { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; }
.mv-toggle b { font: 800 11px/1.2 var(--display); font-stretch: 112%; text-transform: uppercase; letter-spacing: .03em; }
.mv-toggle .small { font: italic 14px/1.3 var(--serif); }
.mv-row .check { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--line); display: grid; place-items: center; font-size: 13px; flex: none; }
.mv-row.on .check { background: var(--brand-yellow); border-color: var(--brand-yellow); color: #000; }
.mv-row input { margin-top: 10px; padding: 9px 12px; font-size: 16px; }
.fl-sec { display: inline-flex; align-items: flex-end; gap: 5px; }
.prog { display: block; width: 100%; text-align: left; margin: 0 0 16px; padding: 12px; border-radius: var(--radius); background: var(--surface); border: 1px solid color-mix(in srgb, var(--bark) 35%, var(--line)); }
.prog-top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
.prog-top .k { font: 800 9px/1 var(--display); font-stretch: 125%; letter-spacing: .08em; text-transform: uppercase; color: var(--bark); }
.prog-top .nm { font: italic 14px/1.2 var(--serif); color: var(--muted); }
.prog-top .ln { margin-left: auto; font: 700 9px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
.prog-ghost { display: block; width: 100%; margin: 0 0 16px; }
.chart { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-left: 2px solid color-mix(in srgb, var(--bark) 55%, transparent); }
.cbar { min-width: 0; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-around; gap: 4px; min-height: 42px; padding: 4px; border-right: 2px solid color-mix(in srgb, var(--bark) 55%, transparent); border-bottom: 1px solid var(--line); }
.ch { font: 600 17px/1.1 var(--serif); padding: 3px 5px; border-radius: 6px; white-space: nowrap; }
.ch.unk { color: var(--faint); font-style: italic; font-weight: 400; font-size: 14px; white-space: normal; text-align: center; }
.ch.now { background: var(--bark); color: #000; }
.wz-dots { display: flex; align-items: center; gap: 5px; margin: 0 0 14px; }
.wz-dots i { width: 18px; height: 4px; border-radius: 2px; background: var(--line); }
.wz-dots i.done { background: var(--muted); }
.wz-dots i.on { background: var(--brand-yellow); width: 28px; }
.wz-dots span { margin-left: 8px; font: 700 10px/1 var(--display); font-stretch: 112%; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.menu-item.sel { border-color: var(--text); background: var(--surface-2); }
.menu-item.seed { padding: 11px 14px; }

.wz-form { margin: 16px 0 8px; font: 700 12px/1.6 var(--display); font-stretch: 112%; text-transform: uppercase; letter-spacing: .04em; }

.help { margin-top: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 11px 14px; font: 15px/1.4 var(--serif); color: var(--muted); }

/* ---------- tabs, you, space, welcome ---------- */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: color-mix(in srgb, #000 90%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--line); padding: 6px 0 calc(6px + env(safe-area-inset-bottom)); }
.tabbar-in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); padding: 0 4px; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; color: var(--faint); border-radius: 12px; }
.tab svg { width: 24px; height: 24px; transition: transform .15s ease-out; }
.tab.on { color: var(--text); }
.tab.on svg { color: var(--brand-yellow); }

.tab .av.xs { width: 22px; height: 22px; font-size: 9px; }
.tab span:not(.av) { font: 800 9.5px/1 var(--display); font-stretch: 112%; text-transform: uppercase; letter-spacing: .05em; }
.tab.on { color: var(--text); }

.av.xl { width: 68px; height: 68px; font-size: 22px; }

.you-name input:focus, .sp-name input:focus { border-bottom-color: var(--text); outline: none; }
.sp-logo { width: 68px; height: 68px; flex: none; border-radius: 16px; border: 1.5px dashed var(--line); display: grid; place-items: center; overflow: hidden; background: var(--surface); cursor: pointer; }
.sp-logo img { width: 100%; height: 100%; object-fit: contain; }
.sp-logo span { font: 800 10px/1 var(--display); text-transform: uppercase; color: var(--muted); }
.link-btn { font: inherit; color: var(--muted); text-decoration: underline; padding: 0; }
.card-box { border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); padding: 12px 14px; }
.qi { margin-top: 10px; }
.qi .sug, .sug.ghost { background: transparent; border-style: dashed; color: var(--muted); }
.sug.gen { display: inline-flex; align-items: center; gap: 6px; padding-right: 6px; }
.sug.gen button { width: 20px; height: 20px; border-radius: 50%; background: var(--surface); color: var(--muted); font-size: 14px; line-height: 1; display: grid; place-items: center; }
.sug.danger { color: var(--danger); }
.gen-ideas { margin-top: 10px; }
.sug-in { font: 15px/1.1 var(--serif); padding: 7px 12px; border-radius: 999px; border: 1px dashed var(--line); background: transparent; width: 130px; }
.member-row .nm { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; }
.nm-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.nm-txt .small { font-style: italic; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.member-row .caret { color: var(--muted); font-size: 15px; padding-left: 4px; }
.nm-body { margin-top: 4px; }
.wel { padding-top: 24px; }
.wel h3 { font: 800 20px/1.15 var(--display); font-stretch: 125%; text-transform: uppercase; margin: 14px 0 6px; }
.wel .lede { color: var(--muted); font: 17px/1.45 var(--serif); margin: 0 0 14px; }

.wel-p { display: flex; flex-direction: column; align-items: center; gap: 5px; font: 800 10px/1 var(--display); text-transform: uppercase; }
.wel-ins { display: flex; flex-wrap: wrap; gap: 6px; min-height: 34px; }
.wel .actions { display: flex; gap: 10px; margin-top: 26px; }
.wel .actions .btn { flex: 1; }
.ns-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }

.ns-row .av { width: 34px; height: 34px; font-size: 12px; }
.seg.sm .seg-b { padding: 6px 9px; font-size: 9px; }
.ns-sum { display: flex; flex-direction: column; gap: 14px; margin-top: 12px; }
.ns-sum .field { display: block; margin: 0 0 6px; }
.ns-p { display: inline-block; margin-right: 10px; font: 16px/1.4 var(--serif); }

.ns-msg { text-align: left; white-space: pre-wrap; word-break: break-all; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; font: 14px/1.5 ui-monospace, Menlo, monospace; color: var(--muted); }

/* ---------- smart sounds ---------- */
.sp-groups { display: grid; gap: 8px; margin-top: 8px; }
.sp-g { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.sp-g .snd-k { min-width: 74px; }
.sp-why { font: italic 13px/1.3 var(--serif); color: var(--brand-yellow); margin: 8px 0 0; }

.sp-sync input { width: 18px; height: 18px; accent-color: var(--brand-yellow); flex: none; }
.sp-none { float: right; font: italic 13px/1 var(--serif); text-transform: none; letter-spacing: 0; color: var(--muted); text-decoration: underline; }
button.snd-tag { cursor: pointer; }
button.snd-tag.on { background: var(--brand-yellow); color: #000; border-color: var(--brand-yellow); }
.lu-copy { margin-top: 10px; border-style: dashed; }
.sp-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
.lu-row .sp-why { margin-top: 8px; }

/* sound pills: one height, one rhythm */
.snd-block { gap: 10px; }
.snd-row { grid-template-columns: 92px 1fr; align-items: start; column-gap: 12px; }
.snd-ins { padding: 10px 0 0; line-height: 1.15; min-height: 32px; overflow-wrap: anywhere; }
.snd-chips { gap: 6px; align-items: center; }

.snd-add { display: inline-flex; align-items: center; padding: 0 12px; font-size: 14px; }

.snd-play { width: 32px; }
.sp-g .sug, .lu-row .sugs.snd .sug { display: inline-flex; align-items: center; padding: 0 12px; }
.lu-row .sugs.snd { align-items: center; }
.snd-k { line-height: 32px; }
.sug-in { padding: 0 12px; }

/* ---------- shelf & linking ---------- */
.shelf-card { width: 100%; display: flex; align-items: center; gap: 14px; text-align: left; margin: 16px 0 0; padding: 14px; border-radius: var(--radius); border: 1px solid color-mix(in srgb, var(--brand-yellow) 45%, var(--line)); background: color-mix(in srgb, var(--brand-yellow) 7%, var(--surface)); }
.shelf-card .sc-ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--brand-yellow); color: #000; flex: none; }
.shelf-card .sc-ic svg { width: 22px; height: 22px; }
.shelf-card b { display: block; font: 800 13px/1.2 var(--display); font-stretch: 125%; text-transform: uppercase; }
.shelf-card .small { display: block; font: italic 14px/1.3 var(--serif); margin-top: 3px; }
.shelf-card > span:nth-child(2) { flex: 1; }
.shelf-card .caret { font-size: 22px; color: var(--muted); }
.shelf-rec { border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); padding: 14px; }
.shelf-rec .compose { margin: 0; padding: 0; }
.shelf-item { --c: var(--brand-yellow); }
.shelf-item .sh-title { font: 800 13px/1.2 var(--display); font-stretch: 112%; text-transform: uppercase; }
.sh-meta { margin-top: 8px; font-style: italic; font-family: var(--serif); }
.shp { gap: 12px; }
.shp > span { flex: 1; min-width: 0; }
.shp-play { width: 36px; height: 36px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; color: var(--brand-yellow); flex: none; }
.shp-play svg { width: 14px; height: 14px; }
.shp-play.on { background: var(--brand-yellow); color: #000; }
.btn.sm { padding: 8px 14px; font-size: 10px; }
.link-card { margin-top: 14px; padding: 14px; border-radius: var(--radius); border: 1px dashed var(--brand-green); background: color-mix(in srgb, var(--brand-green) 8%, transparent); }
.link-card b { font: 800 12px/1.3 var(--display); font-stretch: 112%; text-transform: uppercase; }
.link-card p { margin: 4px 0 8px; font-style: italic; }

.who-out { margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 8px; }
.who-out .faint { font-style: italic; text-align: center; margin: 0; }
.look-t { font: 800 20px/1.1 var(--display); font-stretch: 125%; text-transform: uppercase; }

/* ---------- add to home screen ---------- */
.a2hs { position: fixed; left: 12px; right: 12px; z-index: 40; max-width: 520px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 12px; border-radius: 18px; background: #151515; border: 1px solid color-mix(in srgb, var(--brand-yellow) 40%, var(--line)); box-shadow: 0 14px 36px rgba(0,0,0,.6); animation: a2in .28s cubic-bezier(.2,.8,.2,1); }
@keyframes a2in { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
.a2hs img { width: 44px; height: 44px; border-radius: 11px; flex: none; }
.a2-t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.a2-t b { font: 800 11.5px/1.25 var(--display); font-stretch: 112%; text-transform: uppercase; letter-spacing: .02em; }
.a2-t span { font: 14px/1.35 var(--serif); color: var(--muted); }
.a2-t span b { font: 600 14px/1.35 var(--serif); text-transform: none; letter-spacing: 0; color: var(--text); }
.a2-ic { display: inline-grid; place-items: center; width: 20px; height: 20px; vertical-align: -4px; color: #3b8bff; }
.a2-ic svg { width: 17px; height: 17px; }
.a2-x { width: 30px; height: 30px; flex: none; border-radius: 50%; display: grid; place-items: center; color: var(--muted); font-size: 13px; }

.sp-seg { margin: 12px 0 4px; display: inline-flex; }
.sp-lede { font-style: italic; margin: 14px 0 4px; }
.page-h { display: flex; align-items: baseline; justify-content: space-between; margin: 14px 0 2px; }
.page-h b { font: 800 20px/1.1 var(--display); font-stretch: 125%; text-transform: uppercase; }
.page-h .ar { font: 24px/1 var(--arabic); color: var(--muted); }

/* ---------- projects ---------- */
.proj-row { display: flex; gap: 10px; overflow-x: auto; margin: 0 -16px; padding: 2px 16px 6px; scrollbar-width: none; }
.proj-row::-webkit-scrollbar { display: none; }
.proj { flex: none; width: 150px; text-align: left; display: flex; flex-direction: column; gap: 6px; padding: 12px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); }
.proj .pj-ic { position: relative; width: 38px; height: 32px; display: grid; place-items: center; color: var(--brand-yellow); }
.proj .pj-ic svg { width: 34px; height: 30px; }
.proj .pj-ic i { position: absolute; right: -6px; bottom: -4px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 999px; background: var(--brand-yellow); color: #000; font: 800 10px/18px var(--display); font-style: normal; text-align: center; }
.proj b { font: 800 12px/1.2 var(--display); font-stretch: 112%; text-transform: uppercase; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.pj-meta { font: italic 13px/1.25 var(--serif); color: var(--muted); }
.proj.new { border-style: dashed; background: transparent; }
.proj.new .pj-ic { color: var(--muted); font: 300 28px/1 var(--display); }
.tc-projs { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 2px; }
.tc-proj { display: inline-flex; align-items: center; gap: 5px; font: 700 10px/1 var(--display); font-stretch: 112%; text-transform: uppercase; letter-spacing: .03em; color: var(--brand-yellow); padding: 4px 8px 4px 6px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--brand-yellow) 40%, var(--line)); }
.tc-proj svg { width: 12px; height: 12px; }
.pj-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 12px 0 4px; }
.pj-kind { display: inline-flex; align-items: center; gap: 6px; font: 800 11px/1 var(--display); text-transform: uppercase; letter-spacing: .04em; color: #000; background: var(--brand-yellow); padding: 6px 10px; border-radius: 999px; }
.pj-kind svg { width: 14px; height: 14px; }
.pj-date { font: 800 13px/1 var(--display); font-stretch: 112%; text-transform: uppercase; }
.pj-head .faint { font-style: italic; }
.pj-notes { color: var(--muted); font-size: 16px; white-space: pre-wrap; margin: 8px 0 0; }
.pj-list { display: flex; flex-direction: column; gap: 8px; }
.pj-t { display: flex; align-items: center; gap: 10px; padding: 10px 8px 10px 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.pj-n { width: 24px; flex: none; font: 800 16px/1 var(--display); color: var(--brand-yellow); text-align: center; }
.pj-open { flex: 1; min-width: 0; text-align: left; display: flex; flex-direction: column; gap: 3px; }
.pj-open b { font: 800 13px/1.2 var(--display); font-stretch: 112%; text-transform: uppercase; }
.pj-open .small { font-style: italic; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pj-act { display: flex; gap: 2px; flex: none; }
.pj-act .icon-btn[disabled] { opacity: .25; }
.menu-item .check { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--line); display: grid; place-items: center; font-size: 13px; flex: none; }
.menu-item.sel .check { background: var(--brand-yellow); border-color: var(--brand-yellow); color: #000; }

/* ---------- sounds page ---------- */
.snd-people { margin-top: 6px; }
.snd-hero { display: flex; align-items: center; gap: 14px; margin: 8px 0 14px; padding: 16px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); }
.snd-hero.mine { background: linear-gradient(135deg, color-mix(in srgb, var(--brand-yellow) 16%, var(--surface)), var(--surface) 70%); border-color: color-mix(in srgb, var(--brand-yellow) 40%, var(--line)); }
.sh-k { font: 800 10px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--brand-yellow); }
.sh-name { font: 800 20px/1.1 var(--display); font-stretch: 125%; text-transform: uppercase; }
.ins-card { margin-top: 12px; padding: 14px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); }
.ins-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.ins-name { font: 800 15px/1.1 var(--display); font-stretch: 125%; text-transform: uppercase; color: var(--text); text-align: left; }
.ins-n { font: italic 13px/1 var(--serif); color: var(--faint); }
.snd-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.snd-tile { display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 8px 10px 8px 8px; border-radius: 14px; background: #0b0b0b; border: 1px solid var(--line); text-align: left; }
.snd-tile.has { border-color: color-mix(in srgb, var(--brand-yellow) 30%, var(--line)); }
.st-play, .st-dot { width: 36px; height: 36px; flex: none; border-radius: 50%; display: grid; place-items: center; }
.st-play { background: var(--brand-yellow); color: #000; }
.st-play svg { width: 13px; height: 13px; margin-left: 2px; }
.st-play.on svg { margin-left: 0; }
.st-dot { background: var(--surface-2); color: var(--faint); font: 300 20px/1 var(--display); }
.st-dot svg { width: 18px; height: 18px; }
.st-name { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; text-align: left; }
.st-name b { font: 600 15px/1.15 var(--serif); color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st-name span { font: italic 12px/1.2 var(--serif); color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.snd-tile.add { border-style: dashed; background: transparent; }
.snd-empty { margin-top: 12px; padding: 22px 16px; text-align: center; border-radius: var(--radius); border: 1px dashed var(--line); font: italic 16px/1.4 var(--serif); color: var(--muted); }
.look-note { margin: 12px 0 4px; padding: 12px 14px; border-radius: 14px; border: 1px dashed var(--line); display: flex; flex-direction: column; gap: 4px; }
.look-note b { font: 800 11px/1 var(--display); text-transform: uppercase; letter-spacing: .05em; }
.look-note span { font: italic 15px/1.35 var(--serif); color: var(--muted); }
.snd-page .you-name input { font-size: 18px; }

/* spacing pass: shelf + top of tracks */
.sh-lede { font: italic 16px/1.45 var(--serif); color: var(--muted); margin: 14px 0 16px; }
.shelf-cfg { display: flex; flex-direction: column; gap: 12px; margin-bottom: 14px; }
.sc-row { display: flex; flex-direction: column; gap: 7px; }
.sc-k { font: 800 10px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.shelf-cfg .tempo-row { align-items: center; }
.shelf-cfg input { width: 84px; }
.sc-unit { font: italic 14px/1 var(--serif); color: var(--faint); margin-right: auto; }
.sc-meters { flex-wrap: nowrap; overflow-x: auto; margin: 0 -14px; padding: 0 14px; scrollbar-width: none; }
.sc-meters::-webkit-scrollbar { display: none; }
.sc-meters .sug { flex: none; }
.shelf .list-head { margin-top: 26px; }
.shelf-item { padding: 14px 0; }
.shelf-item .idea-top { margin-bottom: 10px; }
.shelf-item .player { margin-top: 0; }
.shelf-item .roll { margin-top: 10px; }
.sh-meta { margin-top: 10px; font-size: 14px; line-height: 1.4; }
.home .hello { margin: 16px 0 16px; align-items: center; }
.home .hello h2 { margin: 0 0 6px; line-height: 1.1; }
.home .hello .muted { line-height: 1.3; }
.home .list-head { margin-top: 26px; }

/* ================= consistency pass =================
   One rhythm for every page: 16px gutters, 28px between sections, 12px between a section title and its content,
   cards at 18px radius with 14-16px padding, items inside cards at 14px radius. Helper text is italic serif, muted. */
:root { --s1: 6px; --s2: 10px; --s3: 14px; --s4: 20px; --s5: 28px; }
.wrap > :first-child:not(.top) { margin-top: var(--s4); }
.list-head { margin: var(--s5) 0 var(--s2); align-items: center; min-height: 20px; }
.list-head .small, .list-head .muted { font: italic 13px/1.3 var(--serif); color: var(--muted); text-align: right; }
.home .list-head, .shelf .list-head { margin-top: var(--s5); }
.menu { gap: 8px; }
.menu-item { border-radius: 16px; padding: 14px 16px; }
.member-row { border-radius: var(--radius); padding: 14px 16px; margin-bottom: 8px; }
.ins-card, .snd-hero, .shelf-rec, .card-box, .proj, .pj-t, .link-card { border-radius: var(--radius); }
.ins-card, .shelf-rec { padding: 16px; }
.ins-card + .ins-card { margin-top: 10px; }
.snd-hero { margin: 0 0 var(--s3); }
.snd-people { margin: 0 -16px var(--s3); }
.sp-seg { margin: 0 0 var(--s1); }
.sp-lede, .sh-lede { margin: 0 0 var(--s3); }
.pj-head { margin: 0 0 var(--s1); }
.home .hello { margin: 0 0 var(--s1); }
.proj-row { padding-bottom: 2px; }
.empty { padding: 36px 16px; }
/* track filter row */
.fchips { display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px var(--s3); padding: 0 16px; scrollbar-width: none; }
.fchips::-webkit-scrollbar { display: none; }
.fchip { flex: none; display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font: 800 10.5px/1 var(--display); font-stretch: 112%; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.fchip .av.xs { margin-left: -6px; }
.fchip span:not(.av) { font: italic 12px/1 var(--serif); text-transform: none; letter-spacing: 0; color: var(--faint); }
.fchip.on { background: var(--text); border-color: var(--text); color: #000; }
.fchip.on span:not(.av) { color: rgba(0,0,0,.55); }
/* desktop: every tab page shares the header's width and left edge */
@media (min-width: 900px) {
  body.wide .wrap { max-width: 980px; }
  .snd-page > .menu { max-width: 720px; }
  .wrap > .sp-seg ~ * , .wrap > .pj-head ~ *, .wrap > .pj-head { max-width: 720px; }
  .ins-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
  .ins-grid .ins-card { margin: 0; }
  .shelf-grid { display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 40px; align-items: start; }
  .sg-left { position: sticky; top: 84px; }
  .sg-right > .list-head:first-child { margin-top: var(--s4); }
  .shelf-item .roll { max-width: 560px; }
}

/* sounds: picking whose sounds, with room around the selected ring */
.snd-people { gap: 4px; padding-top: 6px; }
.snd-people .pp { width: 76px; gap: 8px; padding: 6px 2px 4px; background: none; }
.snd-people .pp .av { width: 48px; height: 48px; transition: box-shadow .15s ease-out; }
.snd-people .pp.on { background: none; }
.snd-people .pp.on .av { box-shadow: 0 0 0 4px var(--bg), 0 0 0 6px var(--brand-yellow); }
.snd-people .pp .pp-n { color: var(--muted); }
.snd-people .pp.on .pp-n { color: var(--text); }
.snd-people .pp-c { margin-top: -2px; }

/* ---------- projects tab ---------- */
.pgrid { display: grid; gap: 10px; }
.pcard { width: 100%; text-align: left; display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); position: relative; }
.pcard.ask { border-color: #ff9f43; background: color-mix(in srgb, #ff9f43 7%, var(--surface)); }
.pcard.new { flex-direction: row; align-items: center; gap: 12px; border-style: dashed; background: transparent; }
.pcard.new b { font: 800 13px/1 var(--display); font-stretch: 112%; text-transform: uppercase; }
.pcard.new .faint { font: italic 14px/1.2 var(--serif); }
.pn-plus { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font: 300 22px/1 var(--display); color: var(--muted); }
.pc-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.stage-pill { display: inline-flex; align-items: center; gap: 6px; font: 800 9.5px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--c); padding: 5px 8px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--c) 55%, transparent); background: color-mix(in srgb, var(--c) 12%, transparent); }
.stage-pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
.pc-scale { font: 800 9.5px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.pc-date, .pj-date { font: 800 11px/1 var(--display); letter-spacing: .03em; text-transform: uppercase; color: var(--text); }
.pc-name { font: 800 17px/1.15 var(--display); font-stretch: 125%; text-transform: uppercase; }
.pc-phil { margin: 0; font: italic 16px/1.4 var(--serif); color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pc-foot { display: flex; align-items: center; gap: 7px; font: 14px/1.2 var(--serif); }
.pc-foot .sp { flex: 1; }
.pc-foot .faint { font-style: italic; font-size: 13px; }
.pc-votes { font: 800 9.5px/1 var(--display); letter-spacing: .05em; text-transform: uppercase; color: #ff9f43; }
.pc-votes.ok { color: var(--brand-green); } .pc-votes.no { color: var(--danger); }
.pc-ask { position: absolute; top: -9px; right: 14px; font: 800 9px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; background: #ff9f43; color: #000; padding: 4px 8px; border-radius: 999px; }
details.aside { margin-top: var(--s5); }
details.aside summary { list-style: none; cursor: pointer; display: flex; align-items: baseline; justify-content: space-between; margin-bottom: var(--s2); }
details.aside summary::-webkit-details-marker { display: none; }
details.aside summary b { font: 800 13px/1 var(--display); font-stretch: 125%; text-transform: uppercase; }
details.aside summary b::after { content: " ▾"; color: var(--muted); font-size: 10px; }

async function api(path, opts) {
  opts = opts || {};
  const headers = { 'X-Band-Key': S.key, 'X-Member': S.me };
  let body = opts.body;
  if (body && !(body instanceof Blob)) { headers['Content-Type'] = 'application/json'; body = JSON.stringify(body); }
  if (body instanceof Blob) headers['Content-Type'] = body.type || 'application/octet-stream';
  const res = await fetch(API + '/api' + path, { method: opts.method || 'GET', headers, body });
  if (res.status === 401) { Spaces.forget(S.key); route(); throw new Error('That passcode no longer works'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

// Each passcode opens one space. The phone remembers every space it has joined, and who you are in each.
const Spaces = {
  list() {
    const l = store.get('spaces', null);
    if (l) return l;
    const k = store.get('key', '');
    return k ? [{ key: k, me: store.get('me', ''), id: '', name: '' }] : [];
  },
  save(l) { store.set('spaces', l); },
  current() { return this.list().find(x => x.key === S.key); },
  setMe(id) {
    S.me = id; store.set('me', id);
    const l = this.list(), c = l.find(x => x.key === S.key);
    if (c) { c.me = id; this.save(l); }
  },
  add(key, info) {
    const l = this.list().filter(x => x.key !== key);
    const old = this.list().find(x => x.key === key);
    l.push({ key, me: old ? old.me : '', id: info ? info.id : '', name: info ? info.name : '' });
    this.save(l);
  },
  use(key) {
    const c = this.list().find(x => x.key === key);
    S.key = key; S.me = c ? c.me : ''; store.set('key', key); store.set('me', S.me);
    S.track = null; S.members = []; S.tracks = []; S.space = null;
  },
  forget(key) {
    const l = this.list().filter(x => x.key !== key);
    this.save(l);
    if (S.key === key) { if (l.length) this.use(l[0].key); else { S.key = ''; S.me = ''; store.set('key', ''); store.set('me', ''); } }
  },
};

async function shrinkImage(file) {

/* ---------- routing ---------- */
function route() {
  stopEverything();
  document.body.classList.remove('wide');
  const h = location.hash.replace(/^#\/?/, '');
  if (!S.key) return viewGate();
  if (!S.me || (!looking() && S.members.length && !S.members.some(m => m.id === S.me && !m.guest))) return viewWho();
  const me = S.members.find(m => m.id === S.me);
  if (me && !me.ready) return viewWelcome();
  if (h === 'band') return viewBand();
  if (h === 'me') return viewYou();
  if (h === 'shelf') return viewShelf();
  if (h === 'space') return viewSpace();
  if (h.startsWith('t/')) return viewTrack(h.slice(2));
  if (h.startsWith('p/')) return viewProject(h.slice(2));
  if (h === 'projects') return viewProjects();
  return viewHome();
}

function coach(name, force) {
  const sid = (S.space && S.space.id) || 'abba', flag = `coach:${name}:${sid}`;
  if (!force && store.get(flag, false)) return;
  const steps = TOURS[name].filter(([sel]) => document.querySelector(sel));
  if (!steps.length) return;
  store.set(flag, true);
  const ov = document.createElement('div'); ov.className = 'coach';
  ov.innerHTML = '<div class="coach-hole"></div><div class="coach-tip"><p></p><div class="coach-act"><button class="coach-skip">Skip</button><span class="coach-n"></span><button class="btn primary coach-next">Next</button></div></div>';
  document.body.appendChild(ov);
  let k = 0, raf = 0, last = '';
  const hole = $('.coach-hole', ov), tip = $('.coach-tip', ov);
  const end = () => { cancelAnimationFrame(raf); ov.remove(); };
  // Follow the target every frame: it may move when the page refreshes underneath, or while scrolling.
  const place = () => {
    raf = requestAnimationFrame(place);
    const el = document.querySelector(steps[k][0]); if (!el) return;
    const r = el.getBoundingClientRect(), pad = 6;
    const sig = [k, r.left, r.top, r.width, r.height, innerWidth, innerHeight].map(Math.round).join();
    if (sig === last) return; last = sig;
    Object.assign(hole.style, { left: r.left - pad + 'px', top: r.top - pad + 'px', width: r.width + pad * 2 + 'px', height: r.height + pad * 2 + 'px' });
    const below = r.top + r.height / 2 < innerHeight / 2;
    tip.classList.toggle('up', !below);
    const tw = Math.min(300, innerWidth - 32), left = Math.max(16, Math.min(innerWidth - tw - 16, r.left + r.width / 2 - tw / 2));
    Object.assign(tip.style, { width: tw + 'px', left: left + 'px', top: below ? r.bottom + pad + 14 + 'px' : '', bottom: below ? '' : innerHeight - r.top + pad + 14 + 'px' });
    tip.style.setProperty('--ax', Math.max(18, Math.min(tw - 18, r.left + r.width / 2 - left)) + 'px');
    ov.classList.add('ready');
  };
  const show = () => {
    const el = document.querySelector(steps[k][0]);
    if (!el) { if (++k < steps.length) return show(); return end(); }
    const text = () => {
      $('p', tip).textContent = steps[k][1];
      $('.coach-n', tip).textContent = `${k + 1} / ${steps.length}`;
      $('.coach-next', tip).textContent = k === steps.length - 1 ? 'Got it' : 'Next';
    };
    // First step appears in place; later steps glide there while the words fade over.
    if (ov.classList.contains('ready')) {
      ov.classList.add('glide', 'swap');
      clearTimeout(ov._t1); clearTimeout(ov._t2);
      ov._t1 = setTimeout(() => { text(); ov.classList.remove('swap'); }, 160);
      ov._t2 = setTimeout(() => ov.classList.remove('glide'), 700);
    } else text();
    // Only scroll things that live in the page; the header and tab bar are always on screen.
    const r = el.getBoundingClientRect(), fixed = el.closest('.top, .tabbar, .transport');
    if (!fixed && (r.top < 80 || r.bottom > innerHeight - 100)) scrollTo({ top: scrollY + r.top + r.height / 2 - innerHeight / 2, behavior: 'smooth' });
    last = '';
  };
  $('.coach-next', ov).onclick = () => { if (++k >= steps.length) return end(); show(); };
  $('.coach-skip', ov).onclick = end;
  show(); place();
}
function openTour() { store.set('coach:track:' + ((S.space && S.space.id) || 'abba'), false); go(''); setTimeout(() => coach('home', true), 400); }

      R.rec.ondataavailable = e => { if (e.data.size) R.chunks.push(e.data); };
      R.rec.onstop = () => { R.blob = new Blob(R.chunks, { type: (R.rec.mimeType || mime || 'audio/mp4').split(';')[0] }); R.stream.getTracks().forEach(t => t.stop()); $('#srec', root).classList.remove('on'); $('#shint', root).textContent = `Got ${fmtTime(R.secs)}. Save to keep it.`; };
      R.rec.start(); R.t0 = performance.now(); $('#srec', root).classList.add('on');
      R.timer = setInterval(() => { R.secs = (performance.now() - R.t0) / 1000; $('#shint', root).textContent = `Recording ${fmtTime(R.secs)}… tap to stop`; if (R.secs > 30) { clearInterval(R.timer); stopRec(); } }, 200);
    };

    const rm = $('#srm', root); if (rm) rm.onclick = () => { R.removed = true; rm.remove(); if (old) old.remove(); $('#shint', root).textContent = 'Sample will be removed when you save.'; };
    $('#ok', root).onclick = async () => {
      clearInterval(R.timer); stopRec();
      const name = $('#sname', root).value.trim(); if (!name) return toast('Give the sound a name');
      const btn = $('#ok', root); btn.disabled = true;
      try {
        await new Promise(r => setTimeout(r, R.rec && R.rec.state !== 'inactive' ? 300 : 0));
        let audio = {};
        if (R.blob) { const up = await api('/audio', { method: 'POST', body: R.blob }); audio = { audio_id: up.id, audio_mime: up.mime, duration: Math.round(R.secs * 10) / 10 }; }
        else if (R.removed) audio = { audio_id: '' };
        const body = { instrument_id: iid, name, notes: $('#snote', root).value.trim(), ...audio };
        await api(cur ? '/sounds/' + cur.id : '/sounds', { method: cur ? 'PATCH' : 'POST', body });
        closeSheet(); refreshSounds();
      } catch (e) { toast(e.message); btn.disabled = false; }
    };
    const del = $('#del', root); if (del) del.onclick = () => confirmSheet(`Delete ${esc(cur.name)}?`, 'Line-ups and takes that named it just lose the label.', 'Delete', async () => {
      await api('/sounds/' + cur.id, { method: 'DELETE' }); refreshSounds();
    });
  });
  s._onclose = () => { clearInterval(R.timer); if (R.rec && R.rec.state === 'recording') { R.rec.onstop = null; R.rec.stop(); } if (R.stream) R.stream.getTracks().forEach(t => t.stop()); };
}

/* ---------- sound memory ---------- */
// A line-up lists the sounds someone plays in a section, comma-separated; ids of deleted sounds are skipped.
const sidsOf = h => (h && h.sound_ids ? String(h.sound_ids).split(',') : []).filter(id => soundById(id));
const soundsLabel = ids => ids.map(soundLabel).filter(Boolean).join(' + ');
const sameName = (a, b) => (a || '').trim().toLowerCase() === (b || '').trim().toLowerCase();
const insNameOfSound = id => { const x = soundById(id); return x ? (insById(x.instrument_id) || {}).name || '' : ''; };
// Everywhere instruments and sounds have been used: every line-up in the space, plus takes tagged with a sound.
// The open track uses its live data, so a change shows up before the next refresh.
function soundUses() {
  const out = [], open = S.track && S.track.id;
  const line = (t, h) => { const ids = sidsOf(h); (ids.length ? ids : ['']).forEach(sound_id => out.push({ kind: 'line', track_id: t.id, section_id: h.section_id, layer: h.layer, member_id: h.member_id, instrument: h.instrument || '', sound_id, at: t.updated_at || 0 })); };
  const take = (tid, x, by) => out.push({ kind: 'take', track_id: tid, section_id: x.section_id, layer: x.layer, member_id: by, instrument: '', sound_id: x.sound_id, at: x.created_at || 0 });
  for (const t of S.tracks || []) if (t.id !== open) (t.holders || []).forEach(h => line(t, h));
  for (const x of S.soundTakes || []) if (x.track_id !== open) take(x.track_id, x, x.author_id);
  if (open) { S.track.holders.forEach(h => line(S.track, h)); S.track.ideas.forEach(i => { if (i.sound_id) take(open, i, i.author_id); }); }
  return out.filter(u => {
    if (!u.sound_id) return true;
    if (!soundById(u.sound_id)) { u.sound_id = ''; return u.kind === 'line'; }
    if (!u.instrument) u.instrument = insNameOfSound(u.sound_id);
    return true;
  });
}
const secNameOf = (tid, sid) => {
  const t = S.track && S.track.id === tid ? S.track : (S.tracks || []).find(x => x.id === tid);
  return { track: t ? t.title : '', section: t ? ((t.sections || []).find(x => x.id === sid) || {}).name || '' : '' };
};
// Best guess at the instrument and sound someone uses in a layer, with the reason:
// the nearest section of this track first, then what they usually do in that layer elsewhere.
function recall(mid, layer, sid, onIns) {
  if (!LAYER[layer]) return null;
  const uses = soundUses().filter(u => u.member_id === mid && u.layer === layer && u.section_id !== sid && (!onIns || sameName(u.instrument, onIns)) && (u.instrument || u.sound_id));
  if (!uses.length) return null;
  const secs = S.track ? sections() : [], at = secs.findIndex(x => x.id === sid);
  const here = uses.filter(u => S.track && u.track_id === S.track.id)
    .map(u => ({ u, d: Math.abs(secs.findIndex(x => x.id === u.section_id) - at) + (secs.findIndex(x => x.id === u.section_id) > at ? .5 : 0) }))
    .sort((a, b) => a.d - b.d || !!b.u.sound_id - !!a.u.sound_id);
  if (here.length) {
    const sec0 = here[0].u.section_id, best = here.filter(x => x.u.section_id === sec0).map(x => x.u).sort((a, b) => !!b.sound_id - !!a.sound_id)[0];
    const insN = best.instrument || insNameOfSound(best.sound_id);
    const ids = [...new Set(here.filter(x => x.u.section_id === sec0 && x.u.sound_id && sameName(x.u.instrument, insN)).map(x => x.u.sound_id))];
    return { instrument: insN, sound_id: best.sound_id, sound_ids: ids, why: 'like in ' + secNameOf(best.track_id, sec0).section };
  }
  const top = (list, key) => { const m = new Map(); list.forEach(u => { if (u[key]) { const k = key === 'instrument' ? u[key].toLowerCase() : u[key]; const c = m.get(k) || { n: 0, at: 0, v: u[key] }; c.n++; c.at = Math.max(c.at, u.at); m.set(k, c); } }); return [...m.values()].sort((a, b) => b.n - a.n || b.at - a.at)[0]; };
  const ins = top(uses, 'instrument'), instrument = onIns || (ins ? ins.v : '');
  const snd = top(uses.filter(u => !instrument || sameName(u.instrument, instrument)), 'sound_id');
  const n = new Set(uses.map(u => u.track_id)).size;
  return { instrument, sound_id: snd ? snd.v : '', sound_ids: snd ? [snd.v] : [], why: `your usual ${LAYER[layer].short.toLowerCase()}${n > 1 ? `, ${n} tracks` : ''}` };
}
// Where one sound has been used, grouped by track and section.
function usesOfSound(id) {
  const g = new Map();
  soundUses().filter(u => u.sound_id === id).forEach(u => {
    const k = u.track_id + '|' + u.section_id, c = g.get(k) || { ...u, line: false, takes: 0 };
    if (u.kind === 'line') c.line = true; else c.takes++;
    g.set(k, c);
  });
  return [...g.values()].sort((a, b) => b.at - a.at);
}
async function newSoundFor(mid, insName, name) {
  let ins = insByName(mid, insName);
  if (!ins) ins = await api('/instruments', { method: 'POST', body: { member_id: mid, name: insName } });
  const x = await api('/sounds', { method: 'POST', body: { instrument_id: ins.id, name } });
  await loadState();
  return x;
}

// A sound chooser for the recorders. It defaults to your sound in this section's line-up, else what you used
// in the nearest section or usually use in this layer, and offers to keep the line-up in step with the take.
function soundPicker(lane) {
  const { sec } = curView();
  const layer = LAYER[lane] ? lane : null;
  const mineH = S.track.holders.filter(x => x.section_id === sec.id && x.member_id === S.me);
  const h = layer && mineH.find(x => x.layer === lane), elsewhere = mineH.find(x => x.layer !== lane);
  const held = sidsOf(h);
  // Several sounds in the line-up: start from the one you last recorded with here.
  const lastHere = held.length > 1 ? S.track.ideas.filter(i => i.author_id === S.me && i.layer === lane && held.includes(i.sound_id)).sort((a, b) => b.created_at - a.created_at)[0] : null;
  let heldIns = h && h.instrument || '', pick = lastHere ? lastHere.sound_id : held[0] || '';
  let why = !pick ? '' : held.length > 1 ? `one of your ${held.length} sounds in the ${sec.name} line-up${lastHere ? ', the one you used last' : ''}` : `your sound in the ${sec.name} line-up`;
  if (!pick && layer) { const rc = recall(S.me, lane, sec.id, heldIns || null); if (rc && rc.sound_id) { pick = rc.sound_id; why = rc.why; } }
  const S0 = { pick, why, sync: null };
  const order = () => {
    const list = insOf(S.me), first = heldIns || insNameOfSound(S0.pick);
    const fit = fitFirst(list.map(i => i.name), layer);
    return [...list].sort((a, b) => (sameName(b.name, first) - sameName(a.name, first)) || fit.indexOf(a.name) - fit.indexOf(b.name));
  };
  const syncHtml = () => {
    S0.sync = null;
    if (!layer || !S0.pick) return '';
    const insN = insNameOfSound(S0.pick);
    if (h && !held.includes(S0.pick)) { S0.sync = { mode: 'add', on: true }; return `<label class="sp-sync"><input type="checkbox" id="spSync" checked> Add it to my sounds in the ${esc(sec.name)} line-up</label>`; }
    if (!h && !elsewhere) { S0.sync = { mode: 'join', on: true }; return `<label class="sp-sync"><input type="checkbox" id="spSync" checked> Put me in ${esc(LAYER[lane].short)} for ${esc(sec.name)}, on ${esc(insN)}</label>`; }
    if (!h && elsewhere) return `<p class="sp-why">You’re in ${esc(LAYER[elsewhere.layer].short)} in this section, so the line-up stays as it is.</p>`;
    return '';
  };
  const body = () => {
    const groups = order();
    return groups.length ? `<div class="sp-groups">${groups.map(i => `<div class="sp-g"><span class="snd-k">${esc(i.name)}</span>${soundsOf(i.id).map(x => `<button class="sug${S0.pick === x.id ? ' on' : ''}" data-s="${esc(x.id)}">${esc(x.name)}</button>`).join('')}<button class="sug ghost" data-new="${esc(i.name)}">+ new</button></div>`).join('')}</div>
      ${S0.why && S0.pick ? `<p class="sp-why">✦ ${esc(S0.why)}</p>` : ''}${syncHtml()}`
      : `<p class="small faint" style="font-style:italic;margin:4px 0 0">Add your instruments and sounds under You to tag takes with them.</p>`;
  };
  const html = `<label class="field">Sound${S0.pick ? '' : ' (optional)'}<button class="sp-none" id="spNone" type="button">${S0.pick ? 'none' : ''}</button></label><div id="spick">${body()}</div>`;
  let rootEl = null;
  const redraw = () => { $('#spick', rootEl).innerHTML = body(); const n = $('#spNone', rootEl); if (n) n.textContent = S0.pick ? 'none' : ''; wire(rootEl); };
  const wire = root => {
    rootEl = root;
    root.querySelectorAll('#spick [data-s]').forEach(b => b.onclick = () => { S0.pick = S0.pick === b.dataset.s ? '' : b.dataset.s; S0.why = ''; redraw(); });
    root.querySelectorAll('#spick [data-new]').forEach(b => b.onclick = () => {
      const g = b.parentElement; b.outerHTML = `<input class="sug-in" type="text" placeholder="name it, e.g. ebow">`;
      const inp = $('input.sug-in', g); inp.focus();
      const done = async () => { const v = inp.value.trim(); if (!v) return redraw(); try { const x = await newSoundFor(S.me, b.dataset.new, v); S0.pick = x.id; S0.why = ''; redraw(); } catch (e) { toast(e.message); } };
      inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); done(); } if (e.key === 'Escape') redraw(); };
      inp.onblur = done;
    });
    const n = $('#spNone', root); if (n) n.onclick = () => { S0.pick = ''; redraw(); };
    const c = $('#spSync', root); if (c) c.onchange = () => { if (S0.sync) S0.sync.on = c.checked; };
  };
  // After the take is posted: bring the line-up in step if asked.
  const apply = async () => {
    if (!S0.sync || !S0.sync.on || !S0.pick) return;
    const cur = S.track.holders.filter(x => x.section_id === sec.id);
    const insN = insNameOfSound(S0.pick);
    const next = S0.sync.mode === 'add'
      ? cur.map(x => x.member_id === S.me && x.layer === lane ? { ...x, sound_ids: [...sidsOf(x), S0.pick].join(','), instrument: x.instrument || insN } : x)
      : [...cur, { member_id: S.me, layer: lane, instrument: insN, sound_ids: S0.pick }];
    try {
      S.track = await api(`/sections/${sec.id}/lineup`, { method: 'PUT', body: { holders: next.map(x => ({ member_id: x.member_id, layer: x.layer, instrument: x.instrument || '', sound_ids: x.sound_ids || '' })) } });
      renderTrack(); toast(S0.sync.mode === 'join' ? `You’re in ${LAYER[lane].short} for ${sec.name}` : 'Line-up updated');
    } catch (e) { toast(e.message); }
  };
  return { html, wire, get: () => S0.pick, apply };
}

    const bits = [meter, s.bars ? s.bars + ' bars' : '', s.maqam || '', s.tempo ? s.tempo + ' bpm' : ''].filter(Boolean).join(' · ');

    <div class="tc-foot">
      <div class="tc-stats">${stats || '<span class="faint">nothing sketched yet</span>'}${t.last ? `<span class="tc-last">latest: ${esc(lastBy ? (lastBy.id === S.me ? 'you' : lastBy.name) : 'someone')}, ${ago(t.last.at)}</span>` : ''}</div>
      <div class="tc-who"><span class="tc-k">Playing</span>${people.length || prod ? `<span class="tc-avs">${people.map(m => avatar(m, 'xs')).join('')}${prod ? '<span class="av prod" title="Production">P</span>' : ''}</span><span class="faint">${people.map(m => esc(m.id === S.me ? 'you' : m.name)).join(', ')}${prod ? (people.length ? ' + production' : 'production') : ''}</span>` : '<span class="faint">no line-up yet</span>'}</div>

async function viewTrack(id) {
  if (S.pickedTrack !== id) { S.picked = new Set(); S.pickExplicit = false; S.pickedTrack = id; }
  const cached = S.track && S.track.id === id ? S.track : null;
  if (cached) renderTrack();
  else $('#app').innerHTML = topBar('', backBtn('')) + '<div class="wrap"><p class="muted">Loading…</p></div>';
  try {
    if (!S.members.length) await loadState();
    S.track = await api('/tracks/' + id);
    renderTrack();
    setTimeout(() => { if (!$('.scrim') && !$('.coach')) coach('track'); }, 400);
  } catch (e) { toast(e.message); if (!cached) go(''); return; }
  poll(async () => {
    if (location.hash.replace(/^#\/?/, '') !== 't/' + id || Player.on || playing.size || $('.scrim')) return;
    const t = await api('/tracks/' + id);
    if (t.updated_at !== S.track.updated_at || t.ideas.length !== S.track.ideas.length) { S.track = t; renderTrack(); }
  });
}
