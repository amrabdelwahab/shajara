    <label class="field">Start from a groove</label>
    <div id="ours"></div>
    ${GROOVES.map(g => `<div class="sug-group">${g.group}</div>` + chipsHtml('', g.items.map(p => `<button class="sug" data-p="${esc(p.name)}">${esc(p.name)}${p.check ? ' <i class="chk">check</i>' : ''}</button>`).join(''), l.c)).join('')}
    <div class="sugs" style="--c:${l.c}"><button class="sug" data-p="">Clear</button></div>
    <div class="small faint" style="margin-top:8px;font-style:italic">Arabic grooves are the skeletons from <a href="https://www.maqamworld.com/en/iqaa.php" target="_blank" rel="noopener">MaqamWorld</a>; ornament them your way.</div>
    <label class="field">Subdivision</label>${chipsHtml('subs', SUBS.map(x => `<button class="sug" data-s="${x.v}">${x.label}</button>`).join(''), l.c)}
    <label class="field">Steps per bar</label>${chipsHtml('lens', lengths.map(n => `<button class="sug" data-n="${n}">${n}</button>`).join(''), l.c)}
    <label class="field">Bars</label>${chipsHtml('nbars', [1, 2, 3, 4].map(n => `<button class="sug" data-b="${n}">${n}</button>`).join(''), l.c)}
    <div class="pulse-hint" id="phint"></div>
    <div id="grid" style="--c:${l.c}"></div>
    <div class="grid-key"><span><i style="background:${l.c}"></i>D · dum / kick</span><span><i style="background:color-mix(in srgb, ${l.c} 48%, transparent)"></i>T · tak / snare</span><span><i style="background:color-mix(in srgb, ${l.c} 18%, transparent)"></i>K · ka / hat</span><span>Tap a cell to cycle</span></div>
    ${others.length ? `<button class="toggle${withOthers ? ' on' : ''}" id="withOthers"><span class="sw"></span><span><b>Hear it with the other layers’ rhythms</b><br><span class="small muted">${others.map(b => esc(LAYER[b.layer].short) + ': ' + esc(b.name || 'beat')).join(' · ')}</span></span></button>` : ''}
    <div class="actions"><button class="btn" id="prev"></button><button class="btn primary" id="save">Save rhythm</button></div>
    <div class="sugs" style="margin-top:12px"><button class="sug" id="toOurs">＋ Save to our grooves</button><button class="sug hidden" id="rmOurs"></button></div>
    ${cur ? '<div style="margin-top:14px"><button class="btn danger block" id="rm">Remove rhythm</button></div>' : ''}`, root => {
    const grid = $('#grid', root);
    const cols = n => n <= 9 ? n : n === 10 ? 5 : n === 12 ? 6 : n === 15 ? 5 : 8;
    const pattern = () => B.bars.map(b => b.join('')).join('');
    const voices = () => [{ layer: 'edit', pattern: pattern(), sub: B.sub, k: l.k }, ...(withOthers ? sectionVoices(sec.id, layerKey) : [])];
    const paintPrev = () => { $('#prev', root).innerHTML = Beat.on ? ICON.stop + '<span>Stop</span>' : ICON.play + '<span>Preview</span>'; };
    const on = (sel, attr, v) => root.querySelectorAll(sel + ' .sug').forEach(b => b.classList.toggle('on', +b.dataset[attr] === v));
    const wireLen = b => b.onclick = () => {
      B.bar = +b.dataset.n;
      B.bars = B.bars.map(bar => Array.from({ length: B.bar }, (_, i) => bar[i] || '-'));
      draw();
    };
    const draw = () => {
      if (!root.querySelector(`#lens [data-n="${B.bar}"]`)) {
        $('#lens', root).insertAdjacentHTML('beforeend', `<button class="sug" data-n="${B.bar}">${B.bar}</button>`);
        wireLen($('#lens', root).lastElementChild);
      }
      grid.innerHTML = B.bars.map((bar, bi) => `${B.bars.length > 1 ? `<div class="bar-label">Bar ${bi + 1}</div>` : ''}<div class="grid" style="grid-template-columns:repeat(${cols(B.bar)}, 1fr)">${bar.map((c, i) => `<button data-b="${bi}" data-i="${i}" class="${c === '-' ? 'R' : c}">${c === '-' ? '·' : c}</button>`).join('')}</div>`).join('');
      on('#subs', 's', B.sub); on('#lens', 'n', B.bar); on('#nbars', 'b', B.bars.length);
      const pulses = B.bar / B.sub, secP = secBarPulses(sec);
      $('#phint', root).textContent = `One bar = ${+pulses.toFixed(2)} pulse${pulses === 1 ? '' : 's'} at ${pulseOf(sec)} bpm` +
        (Math.abs(pulses - secP) > 1e-6 ? ` · the section’s ${meterLabel(sec)} bar is ${+secP.toFixed(2)}, so this one drifts against it.` : ` · matches the section’s ${meterLabel(sec)}.`);
      if (Beat.on) Beat.retune(voices());
    };
    grid.onclick = e => {
      const b = e.target.closest('button'); if (!b) return;
      const bar = B.bars[+b.dataset.b], i = +b.dataset.i;
      bar[i] = { '-': 'D', D: 'T', T: 'K', K: '-' }[bar[i]];
      draw();
    };
    let loadedOurs = null;
    const loadPreset = name => {
      const p = GROOVES.flatMap(g => g.items).find(x => x.name === name);
      if (p && p.bar && p.bar < p.p.length) { B.sub = p.sub; B.bar = p.bar; B.bars = []; for (let i = 0; i < p.p.length; i += p.bar) B.bars.push(p.p.slice(i, i + p.bar).split('')); $('#bname', root).value = p.name; }
      else if (p) { B.sub = p.sub; B.bar = p.p.length; B.bars = B.bars.map(() => p.p.split('')); $('#bname', root).value = p.name; }
      else B.bars = B.bars.map(bar => bar.map(() => '-'));
      loadedOurs = null; drawOurs(); draw();
    };
    const drawOurs = () => {
      const box = $('#ours', root);
      box.innerHTML = S.grooves.length ? `<div class="sug-group">Ours <span class="ar">بتاعتنا</span></div>` + chipsHtml('', S.grooves.map(g => `<button class="sug${loadedOurs === g.id ? ' on' : ''}" data-g="${esc(g.id)}">${esc(g.name)}</button>`).join(''), l.c) : '';
      box.querySelectorAll('[data-g]').forEach(b => b.onclick = () => {
        const g = S.grooves.find(x => x.id === b.dataset.g);
        B.sub = g.sub; B.bar = g.bar || g.pattern.length; B.bars = [];
        for (let i = 0; i < g.pattern.length; i += B.bar) B.bars.push(g.pattern.slice(i, i + B.bar).split(''));
        $('#bname', root).value = g.name; loadedOurs = g.id; drawOurs(); draw();
      });
      const rm = $('#rmOurs', root), g = S.grooves.find(x => x.id === loadedOurs);
      rm.classList.toggle('hidden', !g);
      if (g) { rm.textContent = `Remove “${g.name}” from our grooves`; rm.onclick = () => confirmSheet(`Remove ${esc(g.name)}?`, 'It comes off everyone’s groove list. Rhythms already saved on layers stay as they are.', 'Remove', async () => {
        await api('/grooves/' + g.id, { method: 'DELETE' }); S.grooves = S.grooves.filter(x => x.id !== g.id); toast('Removed from our grooves');
      }); }
    };
    root.querySelectorAll('[data-p]').forEach(b => b.onclick = () => loadPreset(b.dataset.p));
    $('#toOurs', root).onclick = async () => {
      const name = $('#bname', root).value.trim();
      if (!name) { toast('Give it a name first, e.g. Wehda kbeera'); $('#bname', root).focus(); return; }
      if (!/[DTK]/.test(pattern())) return toast('Tap a few cells first');
      try {
        const g = await api('/grooves', { method: 'POST', body: { name, pattern: pattern(), sub: B.sub, bar: B.bar } });
        S.grooves = [...S.grooves.filter(x => x.id !== g.id), g].sort((a, b) => a.name.localeCompare(b.name));
        loadedOurs = g.id; drawOurs(); toast(`${name} is in our grooves`);
      } catch (e) { toast(e.message); }
    };
    drawOurs();
    root.querySelectorAll('#subs .sug').forEach(b => b.onclick = () => { B.sub = +b.dataset.s; draw(); });
    root.querySelectorAll('#lens .sug').forEach(wireLen);
    root.querySelectorAll('#nbars .sug').forEach(b => b.onclick = () => {
      const n = +b.dataset.b;
      while (B.bars.length < n) B.bars.push(B.bars[B.bars.length - 1].slice());
      B.bars.length = n;
      draw();
    });
    const wo = $('#withOthers', root);
    if (wo) wo.onclick = () => { withOthers = !withOthers; wo.classList.toggle('on', withOthers); if (Beat.on) Beat.retune(voices()); };
    $('#prev', root).onclick = () => { if (Beat.on) Beat.stop(); else Beat.start(voices(), pulseOf(sec), { onChange: paintPrev }); paintPrev(); };
    $('#save', root).onclick = async () => {
      if (!/[DTK]/.test(pattern())) return toast('Tap a few cells first, or remove the rhythm');
      try { S.track = await api(`/sections/${sec.id}/beats/${layerKey}`, { method: 'PUT', body: { name: $('#bname', root).value, pattern: pattern(), sub: B.sub, bar: B.bar } }); closeSheet(); renderTrack(); }
      catch (e) { toast(e.message); }
    };
    if (cur) confirmBtn($('#rm', root), 'Tap again to remove', async () => {
      try { S.track = await api(`/sections/${sec.id}/beats/${layerKey}`, { method: 'PUT', body: { name: '', pattern: '' } }); closeSheet(); renderTrack(); }
      catch (e) { toast(e.message); }
    });
    draw(); paintPrev();
  });
  s._onclose = () => { Beat.stop(); updateTransport(); };
}

/* ---------- beat engine ---------- */
// One pulse clock per playback. Every voice places its steps at pulse = step / subdivision,
// and pulse 0 is the downbeat after any count-in.
const Beat = {
  ctx: null, out: null, noise: null, timer: null, raf: 0, on: false,
  voices: [], bpm: DEFAULT_BPM, t0: 0, p0: 0, onChange: null,
  ensure() {
    if (navigator.audioSession && navigator.audioSession.type === 'auto') { try { navigator.audioSession.type = 'playback'; } catch {} }
    if (!this.ctx) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new Ctx();
      const comp = this.ctx.createDynamicsCompressor();
      comp.connect(this.ctx.destination);
      this.out = this.ctx.createGain(); this.out.gain.value = 0.8; this.out.connect(comp);
      const len = Math.floor(this.ctx.sampleRate * 0.2);
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noise.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },
  pulseAt(t) { return this.p0 + (t - this.t0) * this.bpm / 60; },
  timeAt(p) { return this.t0 + (p - this.p0) * 60 / this.bpm; },
  setBpm(b) {
    if (this.on) { const now = this.ctx.currentTime; this.p0 = this.pulseAt(now); this.t0 = now; }
    this.bpm = b;
  },
  prep(voices) {
    const from = this.pulseAt(this.ctx.currentTime);
    return voices.filter(v => v.metro || v.slots || /[DTK]/.test(v.pattern)).map(v => {
      if (!v.slots) return { ...v, i: Math.ceil(from * v.sub - 1e-9) };
      if (from <= 0) return { ...v, i: 0 };
      const n = v.slots.length, cyc = Math.floor(from / v.cycle), within = from - cyc * v.cycle;
      const k = v.slots.findIndex(sl => sl.start >= within - 1e-9);
      return { ...v, i: k < 0 ? (cyc + 1) * n : cyc * n + k };
    });
  },
  start(voices, bpm, opts) {
    opts = opts || {};
    this.stop();
    const ctx = this.ensure();
    this.bpm = bpm; this.p0 = 0; this.t0 = opts.t0 || ctx.currentTime + 0.1;
    this.voices = this.prep(voices);
    this.on = true; this.onChange = opts.onChange || null;
    this.timer = setInterval(() => this.pump(), 25);
    this.pump();
    const frame = () => { this.paint(); this.raf = requestAnimationFrame(frame); };
    frame();
    if (this.onChange) this.onChange();
  },
  retune(voices) { if (this.on) this.voices = this.prep(voices); },
  pump() {
    const ctx = this.ctx, horizon = ctx.currentTime + 0.15;
    for (const v of this.voices) {
      if (v.slots) {
        for (;;) {
          const n = v.slots.length, sl = v.slots[v.i % n];
          const t = this.timeAt(Math.floor(v.i / n) * v.cycle + sl.start);
          if (t >= horizon) break;
          if (t >= ctx.currentTime - 0.02) {
            const secs = sl.dur * 60 / this.bpm * 0.97;
            sl.notes.forEach(nn => Synth.note(nn, 46, t, secs));
            if (sl.bass != null) Synth.note(sl.bass, 64, t, secs);
          }
          v.i++;
        }
        continue;
      }
      for (;;) {
        const t = this.timeAt(v.i / v.sub);
        if (t >= horizon) break;
        if (t >= ctx.currentTime - 0.02) {
          if (v.metro) { if (v.i < (v.until == null ? Infinity : v.until * v.sub)) this.click(t, ((v.i % v.n) + v.n) % v.n === 0); }
          else if (v.i >= 0) {
            const c = v.pattern[v.i % v.pattern.length];
            if (c === 'D') this.dum(t, v.k); else if (c === 'T') this.tak(t, v.k); else if (c === 'K') this.ka(t, v.k);
          }
        }
        v.i++;
      }
    }
    if (this.onTick) this.onTick(this.pulseAt(ctx.currentTime));
  },
  paint() {
    document.querySelectorAll('.now').forEach(e => e.classList.remove('now'));
    const p = this.pulseAt(this.ctx.currentTime);
    if (p < 0) return;
    for (const v of this.voices) {
      if (v.metro) continue;
      if (v.slots) {
        const within = p % v.cycle, k = v.slots.findIndex(sl => within >= sl.start - 1e-9 && within < sl.start + sl.dur - 1e-9);
        document.querySelectorAll(`[data-chart] [data-k="${k}"]`).forEach(e => e.classList.add('now'));
        continue;
      }
      const i = Math.floor(p * v.sub + 1e-9) % v.pattern.length;
      const cells = v.layer === 'edit' ? document.querySelectorAll('#grid button') : document.querySelectorAll(`[data-cells="${v.layer}"] i`);
      if (cells[i]) cells[i].classList.add('now');
    }
  },
  dum(t, k) {
    const ctx = this.ctx, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(130 * k, t);
    o.frequency.exponentialRampToValueAtTime(52 * k, t + 0.16);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.9, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
    o.connect(g).connect(this.out);
    o.start(t); o.stop(t + 0.36);
  },
  noiseHit(t, freq, q, peak, decay, type) {
    const ctx = this.ctx, src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = this.noise;
    f.type = type || 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
    src.connect(f).connect(g).connect(this.out);
    src.start(t); src.stop(t + decay + 0.01);
  },
  tak(t, k) { this.noiseHit(t, 2600 * k, 1.4, 0.7, 0.07); },
  ka(t, k) { this.noiseHit(t, 6500 * Math.sqrt(k), 0.8, 0.22, 0.035, 'highpass'); },
  click(t, accent) {
    const ctx = this.ctx, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'square'; o.frequency.value = accent ? 1760 : 1175;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(accent ? 0.35 : 0.2, t + 0.001);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
    o.connect(g).connect(this.out);
    o.start(t); o.stop(t + 0.04);
  },
  stop() {
    clearInterval(this.timer); cancelAnimationFrame(this.raf);
    this.timer = null; this.voices = []; this.onTick = null;
    const was = this.on; this.on = false;
    document.querySelectorAll('.now').forEach(e => e.classList.remove('now'));
    if (was && this.onChange) this.onChange();
  },
};

function sectionVoices(sid, exceptLayer) {
  return S.track.beats.filter(b => b.section_id === sid && b.layer !== exceptLayer).map(b => ({ layer: b.layer, pattern: b.pattern, sub: subOf(b), k: LAYER[b.layer].k }));
}
const metroVoice = (sec, until) => ({ metro: true, layer: 'click', n: sec.meter_n, sub: sec.meter_sub, until });

/* ---------- section player ---------- */
// Plays a section in sync: beats and click on the pulse clock, keeper takes scheduled on the same clock.
const bufCache = new Map();
function audioBuffer(idea) {
  if (!bufCache.has(idea.audio_id)) {
    bufCache.set(idea.audio_id, audioUrl(idea).then(u => fetch(u)).then(r => r.arrayBuffer())
      .then(ab => new Promise((res, rej) => Beat.ensure().decodeAudioData(ab, res, rej)))
      .catch(e => { bufCache.delete(idea.audio_id); throw e; }));
  }
  return bufCache.get(idea.audio_id);
}
const Player = {
  on: false, sources: [], endTimer: null, t0: 0, vis: [], raf: 0,
  async start(o) {
    this.stop();
    const ctx = Beat.ensure();
    const sec = o.sec, bpm = pulseOf(o.sec), countIn = o.countIn || 0;
    const voices = [];
    if (o.beats) voices.push(...sectionVoices(sec.id, o.exceptLayer));
    if (o.chords && o.exceptLayer !== 'bark') { const cv = chordVoice(sec); if (cv) voices.push(cv); }
    if (o.click || countIn) voices.push(metroVoice(sec, o.click ? null : 0));
    const audio = o.ideas ? o.ideas.filter(i => i.kind === 'audio') : o.recs ? stackIdeas(sec.id, o.exceptLayer) : [];
    const takes = o.ideas ? o.ideas.filter(i => i.kind === 'midi') : o.recs ? midiStack(sec.id, o.exceptLayer) : [];
    if (!voices.length && !audio.length && !takes.length && !o.clock) return false;
    let bufs = [];
    if (audio.length) bufs = (await Promise.all(audio.map(i => audioBuffer(i).then(b => [i, b]).catch(() => null)))).filter(Boolean);
    const T0 = ctx.currentTime + 0.12 + countIn * 60 / bpm;
    this.t0 = T0; this.on = true; this.onStop = o.onStop || null;
    Beat.start(voices, bpm, { t0: T0 });
    let longest = 0;
    for (const [i, b] of bufs) {
      const src = ctx.createBufferSource();
      src.buffer = b; src.connect(Beat.out);
      const off = Math.min(parseData(i).offset || 0, b.duration);
      src.start(T0, off);
      this.sources.push(src);
      this.vis.push({ id: i.id, off, dur: b.duration });
      longest = Math.max(longest, b.duration - off);
    }
    const tick = () => {
      const now = ctx.currentTime;
      for (const v of this.vis) {
        const el = playerEl(v.id); if (!el) continue;
        const pos = Math.max(0, now - T0) + v.off;
        $('.bar i', el).style.width = Math.min(100, 100 * pos / v.dur) + '%';
        $('.time', el).textContent = fmtTime(Math.min(pos, v.dur));
        el.classList.toggle('live', pos < v.dur && now >= T0);
      }
      this.raf = requestAnimationFrame(tick);
    };
    if (this.vis.length) tick();
    for (const i of takes) { Takes.play(i, T0); longest = Math.max(longest, parseTake(i).len * 60 / bpm); }
    if (!voices.some(v => !v.metro || v.until == null) && !o.clock) {
      this.endTimer = setTimeout(() => this.stop(), (T0 - ctx.currentTime + longest + 0.3) * 1000);
    }
    return true;
  },
  stop() {
    clearTimeout(this.endTimer);
    cancelAnimationFrame(this.raf);
    for (const v of this.vis) {
      const el = playerEl(v.id); if (!el) continue;
      el.classList.remove('live'); $('.bar i', el).style.width = '0';
      const i = S.track && S.track.ideas.find(x => x.id === v.id); $('.time', el).textContent = fmtTime(i ? i.duration : 0);
    }
    this.vis = [];
    this.sources.forEach(s => { try { s.stop(); } catch {} });
    this.sources = [];
    Takes.stopAll();
    const was = this.on; this.on = false;
    Beat.stop();
    if (was && this.onStop) this.onStop();
  },
};
function stopEverything() { Player.stop(); Beat.stop(); stopAll(); Takes.stopAll(); updateTransport(); }

/* ---------- notes & links ---------- */
const laneTitle = lane => {
  const { sec } = curView();
  if (lane === 'transition') { const nx = nextSection(sec); return `${esc(sec.name)} → ${esc(nx ? nx.name : '')}`; }
  return `${LAYER[lane].name} · ${esc(sec.name)}`;
};
function openNote(lane) {
  const l = laneOf(lane);
  sheet(`<h3 style="color:${l.c}">Note · ${laneTitle(lane)}</h3><textarea id="txt" placeholder="${lane === 'transition' ? 'e.g. everyone stops on 4, oud leads back in' : 'e.g. half-time feel, leave space after the 3rd bar'}"></textarea>
    <div class="actions"><button class="btn" onclick="closeSheet()">Cancel</button><button class="btn primary" id="save">Post</button></div>`, root => {
    setTimeout(() => $('#txt', root).focus(), 50);
    $('#save', root).onclick = () => postIdea({ layer: lane, kind: 'text', body: $('#txt', root).value }, root);
  });
}

function openLink(lane) {
  const l = laneOf(lane);
  sheet(`<h3 style="color:${l.c}">Link · ${laneTitle(lane)}</h3><label class="field">Link</label><input id="url" type="url" inputmode="url" placeholder="https://youtube.com/…">
    <label class="field">What to listen for</label><textarea id="txt" rows="2" placeholder="e.g. the bass under the chorus at 1:20"></textarea>
    <div class="actions"><button class="btn" onclick="closeSheet()">Cancel</button><button class="btn primary" id="save">Post</button></div>`, root => {
    $('#url', root).addEventListener('paste', () => setTimeout(() => $('#txt', root).focus(), 0));
    setTimeout(() => $('#url', root).focus(), 50);
    $('#save', root).onclick = () => {
      let url = $('#url', root).value.trim();
      if (url && !/^https?:\/\//i.test(url)) url = 'https://' + url;
      postIdea({ layer: lane, kind: 'link', url, body: $('#txt', root).value }, root);
    };
  });
}

async function postIdea(payload, root) {
  const btn = $('#save', root);
  if (btn) btn.disabled = true;
  const { sec } = curView();
  try {
    const idea = await api(`/sections/${sec.id}/ideas`, { method: 'POST', body: payload });
    S.track.ideas.unshift(idea);
    S.track.updated_at = idea.created_at;
    closeSheet(); renderTrack();
    const el = $('#L-' + payload.layer); if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  } catch (e) { toast(e.message); if (btn) btn.disabled = false; }
}

/* ---------- backing for recorders ---------- */
// Shared by the mic and MIDI recorders: count-in, click, and the rest of the section underneath.
function backingHtml(lane) {
  const { sec } = curView();
  const hasRest = sectionVoices(sec.id, lane).length + stackIdeas(sec.id, lane).length + midiStack(sec.id, lane).length + (lane !== 'bark' && chordVoice(sec) ? 1 : 0) > 0;
  const B = { countIn: store.get('countIn', true), click: store.get('clickRec', true), rest: hasRest && store.get('along', true), hasRest };
  const html = `
    <button class="toggle${B.countIn ? ' on' : ''}" data-bk="countIn"><span class="sw"></span><span><b>Count in one bar</b><br><span class="small muted">${meterLabel(sec)} at ${pulseOf(sec)} bpm, then you’re on.</span></span></button>
    <button class="toggle${B.click ? ' on' : ''}" data-bk="click"><span class="sw"></span><span><b>Click while recording</b><br><span class="small muted">Metronome on the pulse, accent on each bar.</span></span></button>
    ${hasRest ? `<button class="toggle${B.rest ? ' on' : ''}" data-bk="rest"><span class="sw"></span><span><b>Play the rest of ${esc(sec.name)}</b><br><span class="small muted">The other layers’ parts, rhythms and the chord progression. Use headphones so they don’t end up in the recording.</span></span></button>` : ''}`;
  const wire = root => root.querySelectorAll('[data-bk]').forEach(b => b.onclick = () => {
    const k = b.dataset.bk; B[k] = !B[k]; b.classList.toggle('on', B[k]);
    store.set({ countIn: 'countIn', click: 'clickRec', rest: 'along' }[k], B[k]);
  });
  const start = () => Player.start({ sec, exceptLayer: lane, beats: B.rest, recs: B.rest, chords: B.rest, click: B.click, countIn: B.countIn ? secBarPulses(sec) : 0, clock: true });
  const grid = () => B.countIn || B.click || B.rest;
  return { html, wire, start, B, grid, sec };
}
function countdown(el, sec) {
  Beat.onTick = p => {
    if (p < 0) el.textContent = `Count-in · ${Math.floor(p + secBarPulses(sec)) + 1} of ${sec.meter_n}`;
    else el.textContent = `Bar ${Math.floor(p / secBarPulses(sec)) + 1}`;
  };
}

/* ---------- mic recording ---------- */
function pickMime() {
  if (!window.MediaRecorder) return null;
  return ['audio/mp4;codecs=mp4a.40.2', 'audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus'].find(t => MediaRecorder.isTypeSupported(t)) || '';
}

function openRecorder(lane) {
  const l = laneOf(lane);
  const mime = pickMime();
  if (mime === null) return toast('This browser can’t record audio');
  stopEverything();
  const bk = backingHtml(lane);
  const R = { chunks: [], blob: null, secs: 0, offset: 0 };
  prefetchStack(bk.sec.id);

  const s = sheet(`<h3 style="color:${l.c}">Record · ${laneTitle(lane)}</h3><p class="lede" id="hint">Tap to start. Hum it, play it, beatbox it.</p>
    <div class="rec-stage"><button class="rec-big" id="recBtn" aria-label="Record"><i></i></button><div class="rec-time" id="recTime">0:00</div><div class="count" id="count"></div></div>
    <div id="bk">${bk.html}</div>
    <div id="review" class="hidden"><div class="player" style="--c:${l.c}"><button class="play" id="pv">${ICON.play}</button><div class="bar"><i></i></div><span class="time" id="pvTime"></span></div>
      <label class="field">Caption (optional)</label><input id="cap" type="text" placeholder="e.g. idea for the intro, slow">
      <div class="actions"><button class="btn" id="again">Redo</button><button class="btn primary" id="save">Post</button></div></div>`, root => {
    bk.wire(root);
    $('#recBtn', root).onclick = () => (R.rec && R.rec.state === 'recording' ? stop() : start());
    $('#again', root).onclick = () => {
      stopPreview(); R.blob = null;
      $('#review', root).classList.add('hidden'); $('#recBtn', root).parentElement.classList.remove('hidden'); $('#bk', root).classList.remove('hidden');
      $('#recTime', root).textContent = '0:00'; $('#count', root).textContent = ''; $('#hint', root).textContent = 'Tap to start.';
    };
    $('#pv', root).onclick = () => togglePreview();
    $('#save', root).onclick = save;
  });
  s._onclose = () => { cleanup(); stopPreview(); };

  async function start() {
    const ctx = Beat.ensure();
    if (navigator.audioSession) { try { navigator.audioSession.type = 'play-and-record'; } catch {} }
    try {
      R.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    } catch (e) { return toast('Microphone blocked. Allow it in your browser settings.'); }
    R.chunks = [];
    R.rec = new MediaRecorder(R.stream, mime ? { mimeType: mime, audioBitsPerSecond: 128000 } : { audioBitsPerSecond: 128000 });
    R.rec.ondataavailable = e => { if (e.data && e.data.size) R.chunks.push(e.data); };
    R.rec.onstop = () => {
      R.blob = new Blob(R.chunks, { type: (R.rec.mimeType || mime || 'audio/mp4').split(';')[0] });
      cleanup();
      $('#recBtn', s).parentElement.classList.add('hidden'); $('#bk', s).classList.add('hidden');
      $('#review', s).classList.remove('hidden');
      $('#pvTime', s).textContent = fmtTime(R.secs);
      $('#hint', s).textContent = 'Have a listen, then post it to the band.';
    };
    try {
      R.actx = new (window.AudioContext || window.webkitAudioContext)();
      const an = R.actx.createAnalyser(); an.fftSize = 512;
      R.actx.createMediaStreamSource(R.stream).connect(an);
      const buf = new Uint8Array(an.fftSize);
      const btn = $('#recBtn', s);
      const tick = () => {
        an.getByteTimeDomainData(buf);
        let sum = 0; for (const v of buf) sum += (v - 128) * (v - 128);
        const lvl = Math.min(1, Math.sqrt(sum / buf.length) / 40);
        btn.style.boxShadow = `0 0 0 ${Math.round(lvl * 22)}px color-mix(in srgb, var(--danger) 35%, transparent)`;
        R.raf = requestAnimationFrame(tick);
      };
      tick();
    } catch {}
    const backed = bk.grid() ? await bk.start() : false;
    R.rec.start(1000);
    const recAt = ctx.currentTime;
    R.offset = backed ? Math.max(0, Player.t0 - recAt + (ctx.outputLatency || ctx.baseLatency || 0)) : 0;
    if (backed) countdown($('#count', s), bk.sec);
    R.t0 = performance.now();
    $('#recBtn', s).classList.add('on');
    $('#hint', s).textContent = 'Recording… tap to stop.';
    R.timer = setInterval(() => {
      R.secs = (performance.now() - R.t0) / 1000;
      $('#recTime', s).textContent = fmtTime(R.secs);
      if (R.secs >= MAX_REC_SEC) stop();
    }, 250);
  }
  function stop() {
    R.secs = (performance.now() - R.t0) / 1000;
    clearInterval(R.timer);
    Player.stop();
    if (R.rec && R.rec.state !== 'inactive') R.rec.stop();
  }
  function cleanup() {
    clearInterval(R.timer);
    cancelAnimationFrame(R.raf);
    if (R.rec && R.rec.state === 'recording') { R.rec.onstop = null; R.rec.stop(); }
    if (R.stream) R.stream.getTracks().forEach(t => t.stop());
    if (R.actx) R.actx.close().catch(() => {});
    R.stream = null; R.actx = null;
    Player.stop();
    if (navigator.audioSession) { try { navigator.audioSession.type = 'playback'; } catch {} }
  }
  let pvAudio = null;
  function togglePreview() {
    if (!R.blob) return;
    if (!pvAudio) {
      pvAudio = new Audio(URL.createObjectURL(R.blob));
      const bar = $('#review .bar i', s);
      pvAudio.ontimeupdate = () => { bar.style.width = (100 * pvAudio.currentTime / (pvAudio.duration && isFinite(pvAudio.duration) ? pvAudio.duration : R.secs)) + '%'; };
      pvAudio.onended = () => { $('#pv', s).innerHTML = ICON.play; bar.style.width = '0'; };
    }
    if (pvAudio.paused) { pvAudio.play(); $('#pv', s).innerHTML = ICON.pause; } else { pvAudio.pause(); $('#pv', s).innerHTML = ICON.play; }
  }
  function stopPreview() { if (pvAudio) { pvAudio.pause(); URL.revokeObjectURL(pvAudio.src); pvAudio = null; } }
  async function save() {
    if (!R.blob) return;
    const btn = $('#save', s); btn.disabled = true; btn.textContent = 'Uploading…';
    try {
      const up = await api('/audio', { method: 'POST', body: R.blob });
      await postIdea({ layer: lane, kind: 'audio', audio_id: up.id, audio_mime: up.mime, duration: Math.round(R.secs * 10) / 10, body: $('#cap', s).value,
        data: R.offset ? JSON.stringify({ offset: Math.round(R.offset * 1000) / 1000 }) : '' }, s);
    } catch (e) { toast(e.message); btn.disabled = false; btn.textContent = 'Post'; }
  }
}

/* ---------- synth & MIDI takes ---------- */
// Notes are stored in pulses (t, d) so a take follows the track's pulse like the beats do.
const Synth = {
  voices: new Map(),
  hz: n => 440 * Math.pow(2, (n - 69) / 12),
  note(n, v, t, dur) {
    const ctx = Beat.ensure();
    const g = ctx.createGain(), f = ctx.createBiquadFilter();
    const o1 = ctx.createOscillator(), o2 = ctx.createOscillator(), o2g = ctx.createGain();
    o1.type = 'triangle'; o2.type = 'sine';
    o1.frequency.value = this.hz(n); o2.frequency.value = this.hz(n) * 2; o2g.gain.value = 0.25;
    f.type = 'lowpass'; f.frequency.value = 1200 + v * 30;
    const peak = 0.05 + (v / 127) * 0.3;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.008);
    g.gain.exponentialRampToValueAtTime(peak * 0.45, t + 0.35);
    const kill = ctx.createGain();
    o1.connect(f); o2.connect(o2g).connect(f); f.connect(g).connect(kill).connect(Beat.out);
    o1.start(t); o2.start(t);
    if (dur != null) {
      const end = t + dur;
      g.gain.setTargetAtTime(0.0001, end, 0.12);
      o1.stop(end + 0.8); o2.stop(end + 0.8);
      return e => kill.gain.setTargetAtTime(0.0001, Math.max(e, ctx.currentTime), 0.03);
    }
    let done = false;
    return e => {
      if (done) return; done = true;
      g.gain.cancelScheduledValues(e);
      g.gain.setTargetAtTime(0.0001, e, 0.12);
      o1.stop(e + 0.8); o2.stop(e + 0.8);
    };
  },
  on(n, v) { this.off(n); this.voices.set(n, this.note(n, v, Beat.ensure().currentTime)); },
  off(n) { const r = this.voices.get(n); if (r) { r(Beat.ctx.currentTime); this.voices.delete(n); } },
};

function parseTake(i) {
  if (!i._take) { const d = parseData(i); i._take = Array.isArray(d.notes) ? d : { bpm: DEFAULT_BPM, notes: [], len: 0 }; }
  return i._take;
}

function rollSvg(take, id) {
  const notes = take.notes;
  if (!notes.length) return '';
  const lo = Math.min(...notes.map(n => n.n)) - 1, hi = Math.max(...notes.map(n => n.n)) + 1;
  const span = Math.max(12, hi - lo), len = Math.max(take.len, 1);
  const H = 56, W = 300, nh = Math.max(2, Math.min(6, (H - 8) / span));
  const y = n => 4 + (hi - n) / span * (H - 8 - nh);
  const bp = take.bar || 4, bars = [];
  for (let p = bp; p < len; p += bp) bars.push(`<line x1="${p / len * W}" x2="${p / len * W}" y1="0" y2="${H}" stroke="var(--line)" stroke-width="1"/>`);
  return `<svg class="roll" data-roll="${esc(id)}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${bars.join('')}${notes.map(n =>
    `<rect x="${n.t / len * W}" y="${y(n.n)}" width="${Math.max(1.5, n.d / len * W)}" height="${nh}" rx="1" fill="var(--c)" opacity="${0.45 + n.v / 254}"/>`).join('')}<line class="ph" x1="0" x2="0" y1="0" y2="${H}"/></svg>`;
}

const Takes = {
  active: new Map(),
  play(idea, startAt) {
    const take = parseTake(idea), ctx = Beat.ensure();
    const spp = 60 / pulseOf(secOfIdea(idea) || curView().sec);
    const t0 = startAt != null ? startAt : ctx.currentTime + 0.08;
    const releases = take.notes.map(n => Synth.note(n.n, n.v, t0 + n.t * spp, Math.max(0.05, n.d * spp)));
    const total = Math.max(0.1, take.len * spp);
    const entry = { releases, raf: 0 };
    this.stop(idea.id);
    this.active.set(idea.id, entry);
    paintTake(idea.id, true);
    const frame = () => {
      const x = (ctx.currentTime - t0) / total;
      const el = document.querySelector(`[data-roll="${idea.id}"]`);
      if (el) { el.classList.toggle('on', x >= 0); const ph = el.querySelector('.ph'); ph.setAttribute('x1', x * 300); ph.setAttribute('x2', x * 300); }
      if (x >= 1) return this.stop(idea.id, true);
      entry.raf = requestAnimationFrame(frame);
    };
    frame();
  },
  stop(id, ended) {
    const e = this.active.get(id);
    if (!e) return;
    cancelAnimationFrame(e.raf);
    if (!ended) { const now = Beat.ctx.currentTime; e.releases.forEach(r => { try { r(now); } catch {} }); }
    this.active.delete(id);
    const el = document.querySelector(`[data-roll="${id}"]`); if (el) el.classList.remove('on');
    paintTake(id, false);
  },
  stopAll() { [...this.active.keys()].forEach(id => this.stop(id)); },
};
function paintTake(id, on) {
  const el = document.querySelector(`[data-take="${id}"] .play`);
  if (el) el.innerHTML = on ? ICON.stop : ICON.play;
}
function toggleTake(id) {
  if (Takes.active.has(id)) return Takes.stop(id);
  stopAll();
  const idea = S.track.ideas.find(i => i.id === id);
  let at = null;
  if (Beat.on) {
    const bp = secBarPulses(curView().sec);
    at = Beat.timeAt(Math.ceil(Beat.pulseAt(Beat.ctx.currentTime + 0.05) / bp) * bp);
  }
  Takes.play(idea, at);
}

function openMidi(lane) {
  const l = laneOf(lane);
  stopEverything();
  const bk = backingHtml(lane);
  let monitor = store.get('midiMonitor', true);
  let sync = store.get('midiSync', false);
  const M = { access: null, input: null, notes: [], open: new Map(), pedal: false, held: new Set(), rec: false, armed: false, len: 0, gridded: false,
    chan: null, seen: new Set(), ticks: 0, lastTick: 0, tickMs: 0, clockAt: 0, firstTick: 0, span: 0 };

  const s = sheet(`<h3 style="color:${l.c}">MIDI · ${laneTitle(lane)}</h3><p class="lede" id="hint">Plug in a keyboard, then tap record and play.</p>
    <div class="midi-status" id="mstat"><i></i><span>Looking for MIDI devices…</span></div>
    <div class="sugs hidden" id="inputs" style="--c:${l.c}"></div>
    <div class="hidden" id="chanBox"><label class="field">Channel</label><div class="sugs" id="chans" style="--c:${l.c}"></div></div>
    <div class="rec-stage"><button class="rec-big" id="recBtn" aria-label="Record"><i></i></button><div class="rec-time" id="recTime">0 notes</div><div class="count" id="count"></div></div>
    <div id="bk">
    <button class="toggle${sync ? ' on' : ''}" id="sync"><span class="sw"></span><span><b>Follow Ableton Live’s play button</b><br><span class="small muted">Arm here, press play in Live: the take starts on Live’s downbeat and stops with Live, timed by Live’s MIDI clock.</span></span></button>
    <div id="bkOwn" class="${sync ? 'hidden' : ''}">${bk.html}</div>
    <button class="toggle${monitor ? ' on' : ''}" id="mon"><span class="sw"></span><span><b>Play the notes through this device</b><br><span class="small muted">For keyboards without their own speakers. Leave off when Live makes the sound.</span></span></button>
    <details class="help"><summary>Connect Ableton Live</summary><ol>
      <li>Mac, once: open <b>Audio MIDI Setup</b> → Window → Show MIDI Studio → double-click <b>IAC Driver</b> → tick “Device is online”.</li>
      <li>In Live, set the MIDI track’s <b>MIDI To</b> to <b>IAC Driver (Bus 1)</b> and pick a channel (e.g. piano on 1).</li>
      <li>To follow Live’s play button: Settings → Link, Tempo &amp; MIDI → on the <b>IAC Driver</b> output row, switch <b>Sync</b> on.</li>
      <li>Here, pick <b>IAC Driver Bus 1</b> above and the channel you want. Chrome only; phones can’t reach Live.</li>
    </ol></details></div>
    <div id="review" class="hidden" style="--c:${l.c}"><div class="count" id="liveOffer" style="margin-bottom:8px"></div><div id="rollWrap"></div>
      <label class="field">Caption (optional)</label><input id="cap" type="text" placeholder="e.g. left hand for the B part">
      <div class="actions"><button class="btn" id="again">Redo</button><button class="btn" id="pv">${ICON.play}<span>Play</span></button><button class="btn primary" id="save">Post</button></div></div>`, root => {
    bk.wire(root);
    $('#mon', root).onclick = () => { monitor = !monitor; $('#mon', root).classList.toggle('on', monitor); store.set('midiMonitor', monitor); };
    $('#sync', root).onclick = () => { sync = !sync; $('#sync', root).classList.toggle('on', sync); $('#bkOwn', root).classList.toggle('hidden', sync); store.set('midiSync', sync); };
    $('#recBtn', root).onclick = () => (M.rec || M.armed ? stop() : start());
    $('#again', root).onclick = () => { Takes.stopAll(); M.notes = []; $('#review', root).classList.add('hidden'); $('#recBtn', root).parentElement.classList.remove('hidden'); $('#bk', root).classList.remove('hidden'); $('#recTime', root).textContent = '0 notes'; $('#count', root).textContent = ''; };
    $('#pv', root).onclick = () => { const idea = draftIdea(); if (Takes.active.has(idea.id)) Takes.stop(idea.id); else Takes.play(idea); };
    $('#save', root).onclick = async () => {
      const take = { bpm: pulseOf(bk.sec), len: M.len, bar: M.gridded ? secBarPulses(bk.sec) : 4, notes: M.notes, ...(M.chan != null ? { ch: M.chan + 1 } : {}) };
      await postIdea({ layer: lane, kind: 'midi', data: JSON.stringify(take), duration: Math.round(M.len * 60 / take.bpm * 10) / 10, body: $('#cap', root).value }, root);
    };
  });
  s._onclose = () => { if (M.rec || M.armed) stop(); Takes.stopAll(); Player.stop(); for (const n of [...Synth.voices.keys()]) Synth.off(n); if (M.input) M.input.onmidimessage = null; };

  const status = (text, cls) => { const el = $('#mstat', s); el.className = 'midi-status ' + (cls || ''); $('span', el).textContent = text; };
  const draftIdea = () => ({ id: 'draft', data: '', _take: { bpm: pulseOf(bk.sec), len: M.len, bar: M.gridded ? secBarPulses(bk.sec) : 4, notes: M.notes } });

  const listen = input => {
    if (M.input) M.input.onmidimessage = null;
    M.input = input;
    status(`Listening to ${input.name || 'MIDI input'}`, 'live');
    input.onmidimessage = onMsg;
    $('#inputs', s).querySelectorAll('.sug').forEach(b => b.classList.toggle('on', b.dataset.id === input.id));
  };
  const refresh = () => {
    const ins = [...M.access.inputs.values()];
    const box = $('#inputs', s);
    box.innerHTML = ins.map(i => `<button class="sug" data-id="${esc(i.id)}">${esc(i.name || 'MIDI input')}</button>`).join('');
    box.classList.toggle('hidden', ins.length < 2);
    box.querySelectorAll('.sug').forEach(b => b.onclick = () => listen(ins.find(i => i.id === b.dataset.id)));
    if (!ins.length) { M.input = null; return status('No MIDI device found. Plug one in; it shows up here.'); }
    if (!M.input || !ins.includes(M.input)) listen(ins[0]);
  };
  navigator.requestMIDIAccess().then(a => { M.access = a; a.onstatechange = refresh; refresh(); })
    .catch(() => status('MIDI access was blocked. Allow it in Chrome’s site settings.'));

  const drawChans = () => {
    const box = $('#chans', s);
    $('#chanBox', s).classList.toggle('hidden', M.seen.size < 2 && M.chan == null);
    box.innerHTML = [`<button class="sug${M.chan == null ? ' on' : ''}" data-ch="">All</button>`, ...[...M.seen].sort((a, b) => a - b).map(c => `<button class="sug${M.chan === c ? ' on' : ''}" data-ch="${c}">${c + 1}</button>`)].join('');
    box.querySelectorAll('.sug').forEach(b => b.onclick = () => { M.chan = b.dataset.ch === '' ? null : +b.dataset.ch; drawChans(); });
  };
  const livePulse = ms => {
    const per = M.tickMs || 60000 / pulseOf(bk.sec) / 24;
    return M.ticks ? (M.ticks - 1 + (ms - M.lastTick) / per) / 24 : (ms - M.clockAt) / per / 24;
  };
  const perfToPulse = ms => {
    if (sync && (M.rec || M.armed)) return livePulse(ms);
    const ctx = Beat.ctx, ts = ctx.getOutputTimestamp ? ctx.getOutputTimestamp() : null;
    const t = ts && ts.performanceTime ? ts.contextTime + (ms - ts.performanceTime) / 1000 : ctx.currentTime - (performance.now() - ms) / 1000;
    return Beat.pulseAt(t);
  };
  const endNote = (n, ms) => {
    const o = M.open.get(n); if (!o) return;
    M.open.delete(n);
    if (!M.rec) return;
    const start = M.gridded ? Math.max(0, o.p) : o.p;
    M.notes.push({ n, v: o.v, t: start, d: Math.max(0.05, perfToPulse(ms) - start) });
    $('#recTime', s).textContent = M.notes.length + ' notes';
  };
  function onMsg(e) {
    const [st, a, b] = e.data, cmd = st & 0xf0, ms = e.timeStamp || performance.now();
    if (st === 0xf8) {
      if (!M.firstTick) M.firstTick = ms;
      M.lastTick = ms; M.ticks++; M.span++;
      if (M.span > 1) M.tickMs = (ms - M.firstTick) / (M.span - 1);
      if (M.rec && sync && M.ticks % 24 === 1) $('#count', s).textContent = `Live · bar ${Math.floor((M.ticks - 1) / 24 / secBarPulses(bk.sec)) + 1} · ${Math.round(60000 / (M.tickMs * 24))} bpm`;
      return;
    }
    if (st === 0xfa || st === 0xfb) {
      M.ticks = 0; M.lastTick = 0; M.clockAt = ms; M.firstTick = 0; M.span = 0;
      if (M.armed) { M.armed = false; M.rec = true; M.gridded = true; M.notes = []; M.open.clear(); $('#hint', s).textContent = 'Recording with Live… stop Live (or tap) to finish.'; }
      return;
    }
    if (st === 0xfc) { if (M.rec && sync) stop(); return; }
    if (st >= 0xf0) return;
    const ch = st & 0x0f;
    if (!M.seen.has(ch)) { M.seen.add(ch); drawChans(); }
    if (M.chan != null && ch !== M.chan) return;
    const el = $('#mstat', s); el.classList.add('hit'); clearTimeout(M.hit); M.hit = setTimeout(() => el.classList.remove('hit'), 90);
    if (cmd === 0x90 && b > 0) {
      if (monitor) Synth.on(a, b);
      M.held.add(a);
      if (M.rec) { endNote(a, ms); M.open.set(a, { v: b, p: perfToPulse(ms) }); }
    } else if (cmd === 0x80 || (cmd === 0x90 && b === 0)) {
      M.held.delete(a);
      if (M.pedal) return;
      if (monitor) Synth.off(a);
      endNote(a, ms);
    } else if (cmd === 0xb0 && a === 64) {
      M.pedal = b >= 64;
      if (!M.pedal) for (const n of new Set([...M.open.keys(), ...Synth.voices.keys()])) if (!M.held.has(n)) { if (monitor) Synth.off(n); endNote(n, ms); }
    }
  }
  async function start() {
    if (!M.input) return toast('No MIDI device yet');
    Beat.ensure();
    M.notes = []; M.open.clear();
    if (sync) {
      M.armed = true;
      $('#recBtn', s).classList.add('on');
      $('#hint', s).textContent = 'Armed. Press play in Ableton Live.';
      $('#count', s).textContent = M.tickMs ? `Live is at ${Math.round(60000 / (M.tickMs * 24))} bpm` : '';
      return;
    }
    M.gridded = bk.grid();
    await bk.start();
    M.rec = true;
    if (M.gridded) countdown($('#count', s), bk.sec);
    $('#recBtn', s).classList.add('on');
    $('#hint', s).textContent = 'Recording… tap to stop.';
  }
  function stop() {
    const ms = performance.now();
    if (M.armed && !M.rec) { M.armed = false; $('#recBtn', s).classList.remove('on'); $('#hint', s).textContent = 'Disarmed.'; return; }
    for (const n of [...M.open.keys()]) endNote(n, ms);
    const endP = perfToPulse(ms);
    M.rec = false; M.armed = false; Player.stop();
    $('#recBtn', s).classList.remove('on');
    if (!M.notes.length) { $('#hint', s).textContent = 'No notes came in. Check the device, then try again.'; return; }
    M.notes.sort((x, y) => x.t - y.t);
    if (!M.gridded) { const first = M.notes[0].t; M.notes.forEach(n => { n.t -= first; }); }
    M.notes.forEach(n => { n.t = Math.round(n.t * 1000) / 1000; n.d = Math.round(n.d * 1000) / 1000; });
    M.len = Math.max(...M.notes.map(n => n.t + n.d), M.gridded ? endP : 0);
    $('#recBtn', s).parentElement.classList.add('hidden'); $('#bk', s).classList.add('hidden');
    $('#review', s).classList.remove('hidden');
    $('#rollWrap', s).innerHTML = rollSvg(draftIdea()._take, 'draft');
    $('#hint', s).textContent = `${M.notes.length} notes. Have a listen, then post it to the band.`;
    const liveBpm = sync && M.tickMs ? Math.round(60000 / (M.tickMs * 24)) : 0;
    if (liveBpm && Math.abs(liveBpm - pulseOf(bk.sec)) >= 1) {
      $('#liveOffer', s).innerHTML = `Live was at ${liveBpm} bpm, ${esc(bk.sec.name)}’s pulse is ${pulseOf(bk.sec)}. <button class="sug" id="useLive">Use ${liveBpm}</button>`;
      $('#useLive', s).onclick = async () => {
        try {
          S.track = bk.sec.tempo ? await api('/sections/' + bk.sec.id, { method: 'PATCH', body: { tempo: liveBpm } }) : await api('/tracks/' + S.track.id, { method: 'PATCH', body: { tempo: liveBpm } });
          $('#liveOffer', s).textContent = `Pulse set to ${liveBpm} bpm.`;
        } catch (e) { toast(e.message); }
      };
    }
  }
}

/* ---------- single-take playback ---------- */
const audioCache = new Map();
const inflight = new Map();
const playing = new Map();

function audioUrl(idea) {
  const id = idea.audio_id;
  if (audioCache.get(id)) return Promise.resolve(audioCache.get(id));
  if (!inflight.has(id)) {
    inflight.set(id, fetch(`${API}/api/audio/${id}`, { headers: { 'X-Band-Key': S.key } })
      .then(res => { if (!res.ok) throw new Error('Could not load recording'); return res.blob(); })
      .then(blob => { const url = URL.createObjectURL(blob); audioCache.set(id, url); return url; })
      .finally(() => inflight.delete(id)));
  }
  return inflight.get(id);
}

function playerEl(id) { return document.querySelector(`[data-audio="${id}"]`); }
function paint(id, state) {
  const el = playerEl(id); if (!el) return;
  $('.play', el).innerHTML = state === 'play' ? ICON.pause : ICON.play;
  if (state === 'stop') $('.bar i', el).style.width = '0';
}

async function togglePlay(id) {
  if (playing.has(id)) { const a = playing.get(id); a.pause(); playing.delete(id); paint(id, 'pause'); return; }
  stopAll();
  const idea = S.track.ideas.find(i => i.id === id);
  let url = audioCache.get(idea.audio_id);
  if (!url) { try { url = await audioUrl(idea); } catch (e) { return toast(e.message); } }
  const a = new Audio(url);
  wireProgress(id, a, idea.duration);
  playing.set(id, a);
  paint(id, 'play');
  a.play().catch(e => {
    if (e.name !== 'NotAllowedError' || playing.get(id) !== a) return;
    playing.delete(id); paint(id, 'stop'); toast('Tap play again');
  });
}
function wireProgress(id, a, fallbackDur) {
  a.ontimeupdate = () => {
    const el = playerEl(id); if (!el) return;
    const d = a.duration && isFinite(a.duration) ? a.duration : fallbackDur || 1;
    $('.bar i', el).style.width = Math.min(100, 100 * a.currentTime / d) + '%';
    $('.time', el).textContent = fmtTime(a.currentTime);
  };
  a.onended = () => { playing.delete(id); paint(id, 'stop'); const el = playerEl(id); if (el) $('.time', el).textContent = fmtTime(fallbackDur); };
}
function stopAll() {
  for (const [id, a] of playing) { a.pause(); paint(id, 'stop'); }
  playing.clear();
}

function keeper(list) { return list.find(i => i.starred) || list.slice().sort((a, b) => b.created_at - a.created_at)[0]; }
function stackIdeas(sid, exceptLayer) {
  if (!S.track) return [];
  return LAYERS.filter(l => l.key !== exceptLayer).map(l => keeper(ideasOf(sid, l.key).filter(i => i.kind === 'audio'))).filter(Boolean);
}
function midiStack(sid, exceptLayer) {
  if (!S.track) return [];
  return LAYERS.filter(l => l.key !== exceptLayer).map(l => keeper(ideasOf(sid, l.key).filter(i => i.kind === 'midi'))).filter(Boolean);
}
function prefetchStack(sid) { stackIdeas(sid).forEach(i => audioBuffer(i).catch(() => null)); }

/* ---------- band ---------- */
function viewBand() {
  const render = () => {
    $('#app').innerHTML = topBar('The band', S.me ? backBtn('') : '') + `<div class="wrap">
      <p class="muted small">Tap “this is me” to switch who you are on this phone. Everyone’s instruments show up as one-tap choices in the line-up; you can still type anything.</p>
      ${S.members.map(m => `<div class="member-row"><div class="nm"><b>${esc(m.name)}</b><span class="nm-act">${m.id === S.me ? '<span class="me-tag">you</span>' : `<button class="small muted" data-me="${esc(m.id)}">this is me</button>`}<button class="icon-btn sm" aria-label="Remove ${esc(m.name)}" data-rm="${esc(m.id)}">${ICON.trash}</button></span></div>
        <input type="text" data-inst="${esc(m.id)}" value="${esc(m.instruments)}" placeholder="instruments, comma separated" style="margin-top:8px"></div>`).join('')}
      <label class="field">Add someone (guest, 5th member…)</label>
      <div class="tempo-row"><input id="newName" type="text" placeholder="Name"><button class="btn" id="add">Add</button></div>
      <div style="margin-top:28px"><button class="btn block" id="logout">Sign out of this phone</button></div>
    </div>`;
    $('#app').querySelectorAll('[data-me]').forEach(b => b.onclick = () => { S.me = b.dataset.me; store.set('me', S.me); render(); });
    $('#app').querySelectorAll('[data-rm]').forEach(b => b.onclick = () => {
      const m = S.members.find(x => x.id === b.dataset.rm);
      confirmSheet(`Remove ${esc(m.name)} from the band list?`, 'They come off every line-up. Their ideas and recordings stay, still credited to them.', 'Remove', async () => {
        await api('/members/' + m.id, { method: 'DELETE' });
        S.members = S.members.filter(x => x.id !== m.id);
        if (S.me === m.id) { S.me = ''; store.set('me', ''); }
        render();
      });
    });
    $('#app').querySelectorAll('[data-inst]').forEach(inp => inp.onchange = async () => {
      try { const m = await api('/members/' + inp.dataset.inst, { method: 'PATCH', body: { instruments: inp.value } }); Object.assign(S.members.find(x => x.id === m.id), m); toast('Saved'); } catch (e) { toast(e.message); }
    });
    $('#add').onclick = async () => {
      const name = $('#newName').value.trim(); if (!name) return;
      try { const m = await api('/members', { method: 'POST', body: { name } }); S.members.push(m); if (!S.me) { S.me = m.id; store.set('me', m.id); } render(); } catch (e) { toast(e.message); }
    };
    confirmBtn($('#logout'), 'Tap again to sign out', () => { S.key = ''; S.me = ''; store.set('key', ''); store.set('me', ''); go(''); route(); });
  };
  render();
  loadState().then(render).catch(e => toast(e.message));
}

function shareTrack() {
  const t = S.track;
  const url = location.origin + location.pathname + '#/t/' + t.id;
  const text = `🌳 ${t.title}: new ideas in Shajara`;
  if (navigator.share) navigator.share({ title: t.title, text, url }).catch(() => {});
  else window.open('https://wa.me/?text=' + encodeURIComponent(text + '\n' + url), '_blank');
}

/* ---------- polling ---------- */
let pollTimer = null;
function poll(fn) {
  clearInterval(pollTimer);
  pollTimer = setInterval(() => { if (document.visibilityState === 'visible' && !Player.on && !Beat.on) fn().catch(() => {}); }, 20000);
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S.key && !$('.scrim') && !playing.size && !Player.on && !Beat.on) route();
});

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

(async () => {
  if (S.key) { try { await loadState(); } catch {} }
  route();
})();
</script>
