function cellsHtml(b, layerKey, mp) {
  const bar = barOf(b), sub = subOf(b), w = 100 / (sub * mp);
  const row = bar * Math.max(1, Math.floor(mp / barPulses(b) + 1e-9));
  const rows = [];
  for (let i = 0; i < b.pattern.length; i += row) {
    rows.push(`<div class="cells">${b.pattern.slice(i, i + row).split('').map((c, j) => `<i class="${c === '-' ? 'R' : c}${j && j % bar === 0 ? ' bs' : ''}" style="width:${w}%"><b></b></i>`).join('')}</div>`);
  }
  return `<div class="lanes" data-cells="${layerKey}">${rows.join('')}</div>`;
}

function composeHtml(lane) {
  return `<div class="compose">
    <button class="rec" onclick="openRecorder('${lane}')">${ICON.mic}Record</button>
    ${HAS_MIDI ? `<button onclick="openMidi('${lane}')">${ICON.keys}MIDI</button>` : ''}
    ${lane !== 'transition' ? `<button onclick="editBeat('${lane}')">${ICON.rhythm}Rhythm</button>` : ''}
    <button onclick="openNote('${lane}')">${ICON.note}Note</button>
    <button onclick="openLink('${lane}')">${ICON.link}Link</button>
    <button onclick="shelfPicker('${lane}')">${ICON.shelf}Shelf</button>
  </div>`;
}

function ideasHtml(sid, lane, prevSeen) {
  const ideas = ideasOf(sid, lane).sort((a, b) => b.starred - a.starred || b.created_at - a.created_at);
  if (!ideas.length) return '';
  const k = sid + lane, open = S.expanded[k];
  const shown = open ? ideas : ideas.slice(0, 3);
  return `<div class="ideas">${shown.map(i => ideaHtml(i, prevSeen)).join('')}
    ${ideas.length > 3 ? `<button class="more" onclick="S.expanded['${k}']=${!open};renderTrack()">${open ? 'Show fewer' : 'Show all ' + ideas.length + ' ideas'}</button>` : ''}</div>`;
}

function renderTrack() {
  const t = S.track;
  const prevSeen = S.seenBefore && S.seenBefore.id === t.id ? S.seenBefore.at : (S.seen[t.id] || 0);
  S.seenBefore = { id: t.id, at: prevSeen };
  S.seen[t.id] = Date.now(); store.set('seen', S.seen);
  const { sec, transition } = curView();

  const maqam = t.maqam ? t.maqam + (t.tonic ? ' on ' + t.tonic : '') : '';
  const secMaqam = !maqam && t.sections.some(x => x.maqam || x.tonic), secPulse = !t.tempo && t.sections.some(x => x.tempo);
  const chips = `<button class="chip${maqam || secMaqam ? '' : ' ghost'}" onclick="editTrack()">${maqam ? `<span class="k">Maqam</span>${esc(maqam)}` : secMaqam ? '<span class="k">Maqam</span>per section' : '+ maqam'}</button>` +
    `<button class="chip${t.tempo || secPulse ? '' : ' ghost'}" onclick="editTrack()">${t.tempo ? `<span class="k">Pulse</span>${t.tempo} bpm` : secPulse ? '<span class="k">Pulse</span>per section' : '+ pulse'}</button>` +
    `<button class="chip${t.genre ? '' : ' ghost'}" onclick="editTrack()">${t.genre ? `<span class="k">Genre</span>${esc(t.genre)}` : '+ genre'}</button>`;
  const trackNotes = t.notes ? `<button class="notes" onclick="editTrack('f-notes')">${esc(t.notes)}</button>` : '';

  const form = sections().map((s, i) => {
    const dots = LAYERS.map(l => `<i style="--c:${l.c}" class="${holdersOf(s.id, l.key).length || beatOf(s.id, l.key) || ideasOf(s.id, l.key).length ? 'on' : ''}"></i>`).join('');
    const pill = `<button class="sec-pill${s.id === sec.id && !transition ? ' sel' : ''}" onclick="selectView('${s.id}')"><span class="nm">${esc(s.name)}</span><span class="pill-foot"><span class="dots">${dots}</span>${energyBars(s.energy)}</span></button>`;
    if (i === sections().length - 1) return pill;
    const n = ideasOf(s.id, 'transition').length;
    return pill + `<button class="tr-pill${n ? ' has' : ''}${s.id === sec.id && transition ? ' sel' : ''}" aria-label="Transition" onclick="selectView('${s.id}', true)">→${n ? `<b>${n}</b>` : ''}</button>`;
  }).join('') + `<button class="add-pill" onclick="newSection()">+ section</button><button class="add-pill" onclick="manageSections()">✎ edit sections</button>`;

  let panel;
  if (transition) {
    const nx = nextSection(sec);
    panel = `<div class="sec-head"><h2>${esc(sec.name)} <span style="color:var(--brand-yellow)">→</span> ${esc(nx.name)}</h2><span class="sp"></span><span class="ar" style="font-size:22px;color:var(--muted)">انتقال</span></div>
      <div class="transition-card" style="--c:var(--brand-yellow)">
        <p class="lede">How we get from ${esc(sec.name)} into ${esc(nx.name)}: fills, cues, stops, who leads. Recording here plays ${esc(sec.name)} underneath.</p>
        ${ideasHtml(sec.id, 'transition', prevSeen)}
        ${composeHtml('transition')}
      </div>`;
  } else {
    const secBeats = t.beats.filter(b => b.section_id === sec.id);
    const mp = Math.max(2, secBarPulses(sec), ...secBeats.map(barPulses));
    const layers = LAYERS.map((l, li) => {
      const hs = holdersOf(sec.id, l.key);
      const beat = beatOf(sec.id, l.key);
      const pc = li ? LAYERS[li - 1].c : l.c;
      const beatHtml = beat
        ? `<button class="beat" onclick="editBeat('${l.key}')"><div class="beat-top"><span class="k">Rhythm</span><span class="nm">${esc(beat.name || 'Untitled')}</span><span class="ln">${beatMeta(beat)}</span></div>${cellsHtml(beat, l.key, mp)}</button>`
        : '';
      return `<section class="layer" style="--c:${l.c};--pc:${pc}" id="L-${l.key}">
        <div class="layer-head"><div class="layer-glyph">${STAR}<svg class="g" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${l.glyph}</svg></div>
          <div><div class="layer-name">${l.name}</div><div class="layer-role">${l.role}</div></div><span class="layer-ar ar">${l.ar}</span></div>
        <div class="holders">${hs.length ? hs.map(h => `<button class="holder" onclick="editLineup('${l.key}')">${esc(memberName(h.member_id))}${h.instrument ? ' · ' + esc(h.instrument) : ''}${sidsOf(h).length ? ' · ' + esc(soundsLabel(sidsOf(h))) : ''}</button>`).join('')
          : `<button class="holder empty" onclick="editLineup('${l.key}')">empty · open for one of you, or production</button>`}</div>
        ${beatHtml}
        ${ideasHtml(sec.id, l.key, prevSeen)}
        ${composeHtml(l.key)}</section>`;
    }).join('');
    const mv = movesOf(sec);
    const own = (v, label) => `<button class="chip${v ? ' own' : ''}" onclick="editSection()"><span class="k">${label}</span>`;
    const facts = [
      own(true, 'Time') + meterLabel(sec) + '</button>',
      `<button class="chip${sec.bars ? '' : ' ghost'}" onclick="editSection()">${sec.bars ? `<span class="k">Length</span>${sec.bars} bars` : '+ length'}</button>`,
      sec.maqam || sec.tonic ? own(true, 'Maqam') + esc(maqamOf(sec)) + '</button>' : '',
      sec.tempo ? own(true, 'Pulse') + sec.tempo + '</button>' : '',
      `<button class="chip${sec.energy ? '' : ' ghost'}" onclick="editSection()">${sec.energy ? `<span class="k">Energy</span>${energyBars(sec.energy, 'lg')} ${ENERGY[sec.energy]}` : '+ energy'}</button>`,
    ].join('');
    const movesHtml = MOVES.filter(m => mv[m.k] != null).map(m => `<button class="move" onclick="editSection()"><b>${m.label}</b>${mv[m.k] ? ' · ' + esc(mv[m.k]) : ''}</button>`)
      .concat(Object.keys(mv).filter(k => k.startsWith('x:')).map(k => `<button class="move" onclick="editSection()"><b>${esc(k.slice(2))}</b>${mv[k] ? ' · ' + esc(mv[k]) : ''}</button>`)).join('');
    panel = `<div class="sec-head"><h2 class="sec-title" role="button" tabindex="0" onclick="renameSection()" title="Rename">${esc(sec.name)}<span class="ren">✎</span></h2><span class="bar-now" id="secBar"></span><span class="sp"></span><button class="icon-btn sm" aria-label="Edit section" onclick="editSection()">${ICON.edit}</button><button class="icon-btn sm" aria-label="Section options" onclick="sectionMenu()">${ICON.more}</button></div>
      <div class="chips sec-facts">${facts}</div>
      <div class="moves">${movesHtml || `<button class="move ghost" onclick="editSection()">+ moves · role swap, unison, silence…</button>`}</div>
      ${progBlock(sec)}
      ${sec.notes ? `<button class="notes" style="margin:0 0 14px" onclick="editSection('s-notes')">${esc(sec.notes)}</button>` : ''}
      ${lineupStrip(sec)}
      <div class="tree">${layers}</div>`;
  }

  $('#app').innerHTML = topBar(esc(t.title), backBtn(''),
    `<button class="icon-btn" aria-label="Share" onclick="shareTrack()">${ICON.share}</button><button class="icon-btn" aria-label="Track options" onclick="trackMenu()">${ICON.more}</button>`) +
    `<div class="wrap${S.pickExplicit ? ' with-picks' : ''}">
      <div class="hero"><div class="chips">${chips}${t.notes ? '' : `<button class="chip ghost" onclick="editTrack('f-notes')">+ track note</button>`}</div>${trackNotes}</div>
      <div class="form">${form}</div>
      ${panel}
      <p class="small faint">Started ${ago(t.created_at)}${t.created_by ? ' by ' + esc(memberName(t.created_by)) : ''}. ✦ makes an idea the layer’s part: a recording, MIDI, rhythm, note, anything. Play uses each layer’s part (or its latest take) and rhythm.</p>
    </div>
    ${pickBar()}
    <div class="transport"><div class="transport-in">
      <button class="tp-play" id="tpPlay" onclick="togglePlayer()"></button>
      <button class="tp-mix" id="tpMix" onclick="openMixer()"></button>
      <div class="tempo"><button aria-label="Slower" onclick="nudgeTempo(-2)">−</button><div class="v${curView().sec.tempo || t.tempo ? '' : ' unset'}" onclick="${curView().sec.tempo ? 'editSection()' : 'editTrack()'}"><b id="bpm">${curPulse()}</b><span>${curView().sec.tempo ? 'section' : 'pulse'}</span></div><button aria-label="Faster" onclick="nudgeTempo(2)">+</button></div>
    </div></div>`;
  updateTransport();
}

function updateTransport() {
  const b = $('#tpPlay');
  if (!b || !S.track) return;
  b.classList.toggle('on', Player.on);
  b.innerHTML = Player.on ? ICON.stop + '<span>Stop</span>' : ICON.play + '<span>Play</span>';
  b.setAttribute('aria-label', Player.on ? 'Stop' : 'Play ' + curView().sec.name);
  const m = $('#tpMix');
  if (m) { const n = mixTakes().length; m.innerHTML = `${ICON.stack}<span>Mix</span><b>${n}</b>`; m.classList.toggle('custom', S.pickExplicit); m.setAttribute('aria-label', `Choose what plays, ${n} takes`); }
}

/* ---------- the mix: exactly what Play plays ---------- */
// Until someone changes it, the mix is each layer's part (✦, or the latest take). Once changed, it's the ticked set.
const defaultTakes = sec => [...stackIdeas(sec.id), ...midiStack(sec.id)];
// How a take sits in its section: looping (takes recorded to a length) or once, from a start bar.
function loopBarsOf(i) {
  if (i.kind === 'audio') { const lp = parseData(i).loop; return lp ? lp.bars : 0; }
  if (i.kind === 'midi') return parseTake(i).loop || 0;
  return 0;
}
function placeOf(i) {
  const pl = (i.kind === 'midi' ? parseTake(i).place : parseData(i).place) || {};
  const canLoop = loopBarsOf(i) > 0;
  return { mode: canLoop && pl.mode !== 'once' ? 'loop' : 'once', bar: pl.bar || 1, canLoop };
}
function pickedIdeas() { return S.track ? S.track.ideas.filter(i => S.picked.has(i.id)) : []; }
function mixTakes() { return S.pickExplicit ? pickedIdeas() : defaultTakes(curView().sec); }
const inMix = id => mixTakes().some(i => i.id === id);
function togglePick(id) {
  if (!S.pickExplicit) { S.picked = new Set(defaultTakes(curView().sec).map(i => i.id)); S.pickExplicit = true; }
  if (S.picked.has(id)) S.picked.delete(id); else S.picked.add(id);
  const i = S.track.ideas.find(x => x.id === id);
  if (i && i.kind === 'audio' && S.picked.has(id)) audioBuffer(i).catch(() => {});
  if (Player.on) Player.stop();
  refreshMix();
}
function clearPicks() { S.picked.clear(); S.pickExplicit = false; if (Player.on) Player.stop(); refreshMix(); }
function refreshMix() { const open = $('.scrim .mixer'); renderTrack(); if (open) openMixer(); }
function toggleMix(k) {
  S.mix[k] = k === 'chords' ? S.mix.chords === false : !S.mix[k]; store.set('mix', S.mix);
  if (Player.on) Player.stop();
  refreshMix();
}
function pickBar() {
  if (!S.pickExplicit) return '';
  const n = pickedIdeas().length;
  return `<div class="pickbar"><div class="pb-in">${ICON.stack}<span class="pb-txt"><b>Your mix · ${n} take${n === 1 ? '' : 's'}</b><span>Play plays only these</span></span><button class="btn" onclick="openMixer()">Edit</button><button class="btn" onclick="clearPicks()">Reset</button></div></div>`;
}
function openMixer() {
  const { sec } = curView();
  const mine = S.track.ideas.filter(i => (i.kind === 'audio' || i.kind === 'midi'));
  const here = mine.filter(i => i.section_id === sec.id), elsewhere = mine.filter(i => i.section_id !== sec.id && inMix(i.id));
  const nx = nextSection(sec);
  const lanes = [...LAYERS, ...(nx ? [{ ...TRANSITION, name: `Into ${nx.name}` }] : [])];
  const row = i => {
    const on = inMix(i.id), take = i.kind === 'midi' ? parseTake(i) : null;
    const len = i.kind === 'midi' ? `${take.notes.length} notes` : fmtTime(i.duration);
    return `<button class="mx-row${on ? ' on' : ''}" data-id="${esc(i.id)}"><span class="check">${on ? '✓' : ''}</span>
      <span class="mx-txt"><b>${esc(memberName(i.author_id))}</b>${i.body ? ` · ${esc(i.body)}` : ''}<span class="small muted">${i.kind === 'midi' ? 'MIDI · ' : ''}${len} · ${ago(i.created_at)}${i.starred ? ' · ✦ the part' : ''}</span></span></button>`;
  };
  const groups = lanes.map(l => {
    const list = here.filter(i => i.layer === l.key).sort((a, b) => b.starred - a.starred || b.created_at - a.created_at);
    return list.length ? `<div class="mx-lane" style="--c:${l.c}"><div class="mx-h">${esc(l.name)}</div>${list.map(row).join('')}</div>` : '';
  }).join('');
  const extras = [
    ['beats', 'Rhythms', `${sectionVoices(sec.id).length} layer rhythm${sectionVoices(sec.id).length === 1 ? '' : 's'}`, S.mix.beats, sectionVoices(sec.id).length],
    ['chords', 'Chords', progOf(sec) ? 'the progression, on keys' : 'no progression yet', S.mix.chords !== false, !!progOf(sec)],
    ['click', 'Click', `metronome in ${meterLabel(sec)}`, S.mix.click, true],
  ].map(([k, label, hint, on, has]) => `<button class="mx-row${on && has ? ' on' : ''}${has ? '' : ' off'}" data-x="${k}"><span class="check">${on && has ? '✓' : ''}</span><span class="mx-txt"><b>${label}</b><span class="small muted">${hint}</span></span></button>`).join('');
  const html = `<div class="mixer"><h3>What plays · ${esc(sec.name)}</h3>
    <p class="lede">${S.pickExplicit ? 'Your own mix. Play plays exactly what’s ticked.' : 'Right now each layer’s part (✦, or its latest take). Tick or untick to make your own mix.'}</p>
    ${groups || '<p class="small faint" style="font-style:italic">No recordings or MIDI in this section yet.</p>'}
    ${elsewhere.length ? `<div class="mx-lane"><div class="mx-h">From other sections</div>${elsewhere.map(row).join('')}</div>` : ''}
    <div class="mx-lane"><div class="mx-h">Also</div>${extras}</div>
    <div class="actions"><button class="btn" id="mxReset" ${S.pickExplicit ? '' : 'disabled'}>Back to each layer’s part</button><button class="btn primary" id="mxPlay">${Player.on ? ICON.stop + '<span>Stop</span>' : ICON.play + '<span>Play</span>'}</button></div></div>`;
  const open = $('.scrim .mixer');
  if (open) { const sh = open.parentElement, top = sh.scrollTop; open.outerHTML = html; sh.scrollTop = top; wireMixer($('.scrim')); }
  else sheet(html, wireMixer);
}
function wireMixer(root) {
  root.querySelectorAll('.mx-row[data-id]').forEach(b => b.onclick = () => togglePick(b.dataset.id));
  root.querySelectorAll('.mx-row[data-x]').forEach(b => b.onclick = () => { if (!b.classList.contains('off')) toggleMix(b.dataset.x); });
  $('#mxReset', root).onclick = clearPicks;
  $('#mxPlay', root).onclick = async () => { await togglePlayer(); openMixer(); };
}
async function togglePlayer() {
  if (Player.on) { Player.stop(); return; }
  const r = await Player.start({ sec: curView().sec, beats: S.mix.beats, recs: true, click: S.mix.click, chords: S.mix.chords !== false, ideas: S.pickExplicit ? pickedIdeas() : null, onStop: () => { updateTransport(); if ($('.scrim .mixer')) openMixer(); } });
  if (!r) toast('Nothing ticked to play. Open Mix to choose.');
  updateTransport();
}

let tempoSave = null;
function nudgeTempo(d) {
  const { sec } = curView(), own = sec.tempo ? sec : S.track;
  own.tempo = Math.max(30, Math.min(300, curPulse() + d));
  $('#bpm').textContent = own.tempo;
  $('#bpm').parentElement.classList.remove('unset');
  Beat.setBpm(own.tempo);
  clearTimeout(tempoSave);
  const path = own === sec ? '/sections/' + sec.id : '/tracks/' + S.track.id;
  tempoSave = setTimeout(() => api(path, { method: 'PATCH', body: { tempo: own.tempo } }).then(x => { S.track.updated_at = x.updated_at; }).catch(e => toast(e.message)), 900);
}

function ideaHtml(i, prevSeen) {
  const isNew = i.created_at > prevSeen && i.author_id !== S.me;
  let body = '';
  let loopTag = '';
  if (i.kind === 'audio' || i.kind === 'midi') {
    const pl = placeOf(i), lb = loopBarsOf(i);
    const label = pl.mode === 'loop' ? `↻ ${lb} bar${lb > 1 ? 's' : ''}${pl.bar > 1 ? ` · from bar ${pl.bar}` : ''}` : lb ? `▶ once · bar ${pl.bar}` : `▶ bar ${pl.bar}`;
    loopTag = `<button class="loop-tag${pl.mode === 'loop' ? '' : ' once'}" onclick="placeMenu('${esc(i.id)}')" aria-label="How it plays, and its start bar">${label}<span class="edit-dot">✎</span></button>`;
  }
  if (i.kind === 'audio') body = `${loopTag}<div class="player" data-audio="${esc(i.id)}"><button class="play" aria-label="Play" onclick="togglePlay('${esc(i.id)}')">${ICON.play}</button><div class="bar"><i></i></div><span class="time">${fmtTime(i.duration)}</span></div>${i.body ? `<div class="idea-body">${esc(i.body)}</div>` : ''}`;
  else if (i.kind === 'midi') {
    const take = parseTake(i);
    body = `${loopTag}<div class="player" data-take="${esc(i.id)}"><button class="play" aria-label="Play" onclick="toggleTake('${esc(i.id)}')">${ICON.play}</button><span class="small muted">${take.notes.length} notes · ${fmtTime(take.len * 60 / pulseOf(secOfIdea(i)))} · MIDI</span></div>${rollSvg(take, i.id)}${i.body ? `<div class="idea-body">${esc(i.body)}</div>` : ''}`;
  }
  else if (i.kind === 'link') body = `<div class="idea-body"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(prettyUrl(i.url))}</a>${i.body ? '\n' + esc(i.body) : ''}</div>`;
  else body = `<div class="idea-body">${esc(i.body)}</div>`;
  return `<div class="idea"><div class="idea-top"><span class="by">${esc(memberName(i.author_id))}</span>${i.sound_id && soundLabel(i.sound_id) ? (soundById(i.sound_id).audio_id ? `<button class="snd-tag" onclick="playSample('${esc(i.sound_id)}', this)" aria-label="Hear ${esc(soundLabel(i.sound_id))}">${esc(soundLabel(i.sound_id))} ▸</button>` : `<span class="snd-tag">${esc(soundLabel(i.sound_id))}</span>`) : ''}<span>${ago(i.created_at)}</span>${isNew ? '<span class="new-tag">new</span>' : ''}<span class="sp"></span>
    ${i.starred && i.layer !== 'transition' ? '<span class="part-tag">the part</span>' : ''}
    ${i.kind === 'audio' || i.kind === 'midi' ? `<button class="pick${inMix(i.id) ? ' on' : ''}" aria-label="${inMix(i.id) ? 'Take out of the mix' : 'Add to the mix'}" onclick="togglePick('${esc(i.id)}')">${ICON.stack}<span>${inMix(i.id) ? 'in mix' : 'mix'}</span></button>` : ''}
    <button class="star${i.starred ? ' on' : ''}" aria-label="Make this the part" onclick="toggleStar('${esc(i.id)}')">${i.starred ? '✦' : '✧'}</button>
    <button class="kebab" aria-label="More" onclick="ideaMenu('${esc(i.id)}')">⋯</button></div>${body}</div>`;
}
function prettyUrl(u) { try { const x = new URL(u); return x.hostname.replace(/^www\./, '') + (x.pathname.length > 1 ? x.pathname.slice(0, 28) + (x.pathname.length > 28 ? '…' : '') : ''); } catch { return u; } }

async function toggleStar(id) {
  const i = S.track.ideas.find(x => x.id === id);
  i.starred = i.starred ? 0 : 1; renderTrack();
  try { await api('/ideas/' + id, { method: 'PATCH', body: { starred: !!i.starred } }); } catch (e) { toast(e.message); }
}

function placeHtml(i) {

  const n = Math.max(sec.bars || 8, pl.bar);
  return `<label class="field">Loop or once</label>
    <div class="sugs" id="pl-mode">${pl.canLoop ? `<button class="sug${pl.mode === 'loop' ? ' on' : ''}" data-m="loop">↻ Loop (${loopBarsOf(i)} bar${loopBarsOf(i) > 1 ? 's' : ''})</button>` : ''}<button class="sug${pl.mode === 'once' ? ' on' : ''}" data-m="once">▶ Once</button></div>
    <label class="field">Starts at bar · for loops and one-offs alike</label>
    <div class="sugs" id="pl-bar">${Array.from({ length: n }, (_, k) => `<button class="sug${pl.bar === k + 1 ? ' on' : ''}" data-b="${k + 1}">${k + 1}</button>`).join('')}</div>
    <p class="small faint" style="font-style:italic;margin:6px 0 0">${sec.bars ? `${esc(sec.name)} is ${sec.bars} bars long.` : `Set ${esc(sec.name)}’s length in the section editor to loop the whole section.`}${pl.canLoop ? '' : ' Record with a length to make a take loop.'}</p>`;
}
function wirePlace(root, i) {
  const save = async place => {
    try {
      const r = await api('/ideas/' + i.id, { method: 'PATCH', body: { place } });
      i.data = r.data; delete i._d; delete i._take;
      if (Player.on) Player.stop();
      closeSheet(); renderTrack(); toast(place.mode === 'loop' ? `Loops${place.bar > 1 ? ' from bar ' + place.bar : ''}` : `Plays once from bar ${place.bar}`);
    } catch (e) { toast(e.message); }
  };
  root.querySelectorAll('#pl-mode .sug').forEach(b => b.onclick = () => save({ mode: b.dataset.m, bar: placeOf(i).bar }));
  root.querySelectorAll('#pl-bar .sug').forEach(b => b.onclick = () => save({ mode: placeOf(i).mode, bar: +b.dataset.b }));

// Tap on the pulse: needs 3 taps, uses the median of the last 8 gaps so one stray tap can't throw it, resets after a 2 s pause.
function tapTempo(btn, input) {
  const label = btn.textContent;
  let taps = [];
  btn.onclick = e => e.preventDefault();
  btn.onpointerdown = e => {
    e.preventDefault();
    const n = e.timeStamp || performance.now(), last = taps[taps.length - 1];
    if (last && n - last < 120) return;
    if (!last && document.activeElement && document.activeElement !== btn) document.activeElement.blur();
    if (last && n - last > 2000) taps = [];
    taps.push(n); if (taps.length > 9) taps.shift();
    btn.classList.remove('flash'); void btn.offsetWidth; btn.classList.add('flash');
    clearTimeout(btn._reset);
    btn._reset = setTimeout(() => { taps = []; btn.textContent = label; }, 2000);
    if (taps.length < 3) { btn.textContent = taps.length === 1 ? 'Again…' : 'Keep going'; return; }
    const gaps = taps.slice(1).map((x, i) => x - taps[i]).sort((a, b) => a - b);
    const bpm = Math.round(60000 / gaps[Math.floor(gaps.length / 2)]);
    if (bpm >= 30 && bpm <= 300) input.value = bpm;
    btn.textContent = `Tap · ${taps.length}`;
  };
}

          ${W.vary.maqam ? `<div class="row2 wz-f"><input type="text" list="maqamat" data-f="maqam" data-i="${i}" value="${esc(x.maqam || '')}" placeholder="maqam / scale"><input type="text" data-f="tonic" data-i="${i}" value="${esc(x.tonic || '')}" placeholder="root"></div>` : ''}

            ${W.vary.pulse ? `<input type="number" inputmode="numeric" data-f="tempo" data-i="${i}" value="${esc(x.tempo || '')}" placeholder="pulse (bpm)">` : '<span></span>'}
            ${W.vary.meter ? `<select data-f="meter" data-i="${i}"><option value="">time signature</option>${METERS.map(([a, b, l]) => `<option value="${a}/${b}"${x.meter && x.meter.join('/') === a + '/' + b ? ' selected' : ''}>${l}</option>`).join('')}</select>` : ''}
          </div>` : ''}
        </div>`).join('')}</div>`;
      }
      default: {
        const who = W.by.map(id => memberName(id)).join(', ');
        const facts = [W.genre,
          W.vary.maqam ? 'maqam per section' : W.maqam && (W.maqam + (W.tonic ? ' on ' + W.tonic : '')),
          W.vary.pulse ? 'pulse per section' : W.tempo && W.tempo + ' bpm',
          W.vary.meter ? 'time per section' : meterLbl(W.meter)].filter(Boolean);
        return `<h3>${esc(W.title || 'Untitled')}</h3>
          ${W.idea ? `<p class="lede" style="white-space:pre-wrap">${esc(W.idea)}</p>` : ''}
          <div class="chips" style="margin:12px 0">${facts.map(f => `<span class="chip">${esc(f)}</span>`).join('')}</div>
          ${W.seeds.length ? `<p class="small muted serif" style="font-style:italic">Built on ${esc(W.seeds.join(', '))}${who ? ` · brought by ${esc(who)}` : ''}</p>` : who ? `<p class="small muted serif" style="font-style:italic">Brought by ${esc(who)}</p>` : ''}
          ${W.seedText.trim() ? `<p class="small muted serif" style="white-space:pre-wrap">${esc(W.seedText.trim())}</p>` : ''}
          <div class="form-line wz-form">${W.secs.map(x => {
            const own = [W.vary.maqam && [x.maqam, x.tonic].filter(Boolean).join(' '), W.vary.meter && x.meter && meterLbl(x.meter), W.vary.pulse && x.tempo && x.tempo + ' bpm'].filter(Boolean);
            return `<span class="fl-sec">${esc(x.name)}${x.energy ? energyBars(x.energy) : ''}${own.length ? `<span class="fl-own">${esc(own.join(' · '))}</span>` : ''}</span>`;
          }).join('<span class="arr">→</span>')}</div>
          <p class="small faint" style="font-style:italic">Layers, line-ups, rhythms and chords are filled in per section afterwards.</p>`;
      }
    }
  };
  const read = () => {
    const v = id => { const el = $('#' + id, root); return el ? el.value : null; };
    if (W.step === 0) { W.title = v('w-title'); W.idea = v('w-idea'); }
    if (W.step === 1) W.seedText = v('w-seedtext');
    if (W.step === 2) {
      if (!W.vary.maqam) { W.maqam = v('w-maqam'); W.tonic = v('w-tonic'); }
      if (!W.vary.pulse) W.tempo = v('w-tempo');
    }
    if (W.step === 4) root.querySelectorAll('#w-energy [data-f]').forEach(el => {
      const x = W.secs[+el.dataset.i], f = el.dataset.f;
      if (f === 'meter') x.meter = el.value ? el.value.split('/').map(Number) : null; else x[f] = el.value.trim();
    });
    if (W.step === 3) root.querySelectorAll('#w-secs input').forEach(el => { W.secs[+el.dataset.i].name = el.value.trim() || W.secs[+el.dataset.i].name; });
  };
  const render = () => {
    $('#wz', root).innerHTML = `<div class="wz-dots">${STEPS.map((x, i) => `<i class="${i < W.step ? 'done' : i === W.step ? 'on' : ''}"></i>`).join('')}<span>${STEPS[W.step]}</span></div>
      ${stepHtml()}
      <div class="actions">${W.step ? '<button class="btn" id="w-back">Back</button>' : '<button class="btn" id="w-cancel">Cancel</button>'}
      <button class="btn primary" id="w-next">${W.step === STEPS.length - 1 ? 'Plant it' : 'Next'}</button></div>
      ${W.step < STEPS.length - 1 ? '<div class="sugs" style="justify-content:center;margin-top:10px"><button class="sug wz-skip" id="w-skip">Skip the rest, plant it</button></div>' : ''}`;
    wire();
    const first = $('#wz input[type=text]', root);
    if (W.step === 0 && first && !W.title) setTimeout(() => first.focus(), 60);
    $('.sheet', root).scrollTop = 0;
  };
  const wire = () => {
    const tog = (sel, fn) => root.querySelectorAll(sel).forEach(b => b.onclick = () => { read(); fn(b.dataset.v, b); render(); });
    tog('#w-seeds .menu-item', v => { W.seeds = W.seeds.includes(v) ? W.seeds.filter(x => x !== v) : [...W.seeds, v]; });
    tog('#w-by .sug', v => { W.by = W.by.includes(v) ? W.by.filter(x => x !== v) : [...W.by, v]; });
    tog('#w-genre .sug', v => { W.genre = v; });
    tog('#w-meter .sug', v => { W.meter = v.split('/').map(Number); });
    tog('#w-shapes .menu-item', v => { W.shape = v; W.secs = SHAPES.find(x => x.k === v).names.map(n => ({ name: n, energy: 0 })); W.curve = ''; });
    tog('#w-curve .sug', v => { W.curve = v; const c = CURVES.find(x => x.k === v); W.secs.forEach((x, i) => { x.energy = c.f(i, W.secs.length); }); });
    root.querySelectorAll('[data-vary]').forEach(b => b.onclick = () => { read(); W.vary[b.dataset.vary] = !W.vary[b.dataset.vary]; render(); });
    root.querySelectorAll('#w-energy .lvl').forEach(b => b.onclick = () => { read(); const x = W.secs[+b.dataset.i], e = +b.dataset.e; x.energy = x.energy === e ? 0 : e; W.curve = ''; render(); });
    root.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { read(); W.secs.splice(+b.dataset.rm, 1); W.shape = ''; render(); });
    const add = $('#w-add', root); if (add) add.onclick = () => {
      read(); const used = W.secs.map(x => x.name);
      W.secs.push({ name: SECTION_NAMES.find(n => !used.includes(n)) || 'Section ' + (W.secs.length + 1), energy: 0 }); W.shape = ''; render();
      const ins = root.querySelectorAll('#w-secs input'); ins[ins.length - 1].select();
    };
    const tap = $('#w-tap', root); if (tap) tapTempo(tap, $('#w-tempo', root));
    const gx = $('#w-genrex', root); if (gx) {
      const add = () => { const v = gx.value.trim(); if (!v) return gx.focus(); read(); W.genre = v; render(); };
      $('#w-genreadd', root).onclick = add; gx.onkeydown = e => { if (e.key === 'Enter') add(); };
    }
    const back = $('#w-back', root); if (back) back.onclick = () => { read(); W.step--; render(); };
    const cancel = $('#w-cancel', root); if (cancel) cancel.onclick = closeSheet;
    const skip = $('#w-skip', root); if (skip) skip.onclick = () => { read(); W.step = STEPS.length - 1; render(); };
    $('#w-next', root).onclick = () => {
      read();
      if (W.step < STEPS.length - 1) { W.step++; return render(); }
      plant();
    };
  };
  const plant = async () => {
    const btn = $('#w-next', root); btn.disabled = true; btn.textContent = 'Planting…';
    const lines = [W.idea.trim(),
      W.seeds.length || W.seedText.trim() ? 'Built on: ' + [W.seeds.join(', '), W.seedText.trim()].filter(Boolean).join('. ') + (/[.!?]$/.test(W.seedText.trim()) ? '' : '.') : '',
      W.by.length ? 'Brought by ' + W.by.map(id => memberName(id)).join(', ') + '.' : ''].filter(Boolean);
    try {
      const t = await api('/tracks', { method: 'POST', body: {
        title: W.title.trim() || 'Untitled', notes: lines.join('\n\n'), genre: W.genre,
        maqam: W.vary.maqam ? '' : W.maqam, tonic: W.vary.maqam ? '' : W.tonic, tempo: W.vary.pulse ? '' : W.tempo,
        meter_n: W.meter[0], meter_sub: W.meter[1],
        sections: W.secs.map(x => ({ name: x.name, energy: x.energy || '',
          ...(W.vary.maqam ? { maqam: x.maqam || '', tonic: x.tonic || '' } : {}),
          ...(W.vary.pulse ? { tempo: x.tempo || '' } : {}),
          ...(W.vary.meter && x.meter ? { meter_n: x.meter[0], meter_sub: x.meter[1] } : {}) })),
      } });
      keepGenre(W.genre);
      S.track = t; closeSheet();
      if (after) await after(t);
      go('t/' + t.id);
      toast(`${t.sections.length} section${t.sections.length > 1 ? 's' : ''} planted`);
    } catch (e) { toast(e.message); btn.disabled = false; btn.textContent = 'Plant it'; }
  };
  render();
}

function meterPicker(root, M) {

    root.querySelectorAll('#mn .sug').forEach(b => b.classList.toggle('on', +b.dataset.n === M.n));
    root.querySelectorAll('#md .sug').forEach(b => b.classList.toggle('on', +b.dataset.v === M.sub));

  };

const meterHtml = () => `<label class="field">Time signature</label>
  <div class="meter-preview" id="mprev"></div>
  ${chipsHtml('mn', [2, 3, 4, 5, 6, 7, 9, 10, 11, 12, 15].map(n => `<button class="sug" data-n="${n}">${n}</button>`).join(''))}

function newSection() {

  let copy = false;
  sheet(`<h3>New section</h3><p class="lede">Each section is its own tree, with its own holders, beats and ideas. The pulse stays the track’s.</p>
    <label class="field">Name</label><input id="s-name" type="text" value="${esc(suggestion)}" placeholder="e.g. Chorus">
    ${chipsHtml('names', SECTION_NAMES.filter(n => !used.includes(n)).map(n => `<button class="sug">${n}</button>`).join(''))}
    <button class="toggle" id="copy"><span class="sw"></span><span><b>Start as a copy of ${esc(sec.name)}</b><br><span class="small muted">Same holders, beats and time signature; no ideas.</span></span></button>
    <div class="actions"><button class="btn" onclick="closeSheet()">Cancel</button><button class="btn primary" id="save">Add section</button></div>`, root => {
    root.querySelectorAll('#names .sug').forEach(b => b.onclick = () => { $('#s-name', root).value = b.textContent; });

function progBlock(sec) {
  const pg = progOf(sec), bars = pg ? parseProg(pg.text) : [];
  if (!bars.length) return `<button class="move ghost prog-ghost" onclick="editChords()">+ chord progression · the harmony this section sits on</button>`;
  const unk = bars.flat().filter(c => !parseChord(c)).length;
  return `<button class="prog" onclick="editChords()"><div class="prog-top"><span class="k">Progression</span><span class="nm">${bars.length} bar${bars.length > 1 ? 's' : ''}${pg.own ? '' : ' · from the track'}${unk ? ` · ${unk} not recognised` : ''}</span><span class="ln">Tree Bark</span></div>${chartHtml(bars)}</button>`;
}

function editChords() {
  const { sec } = curView();
  const t = S.track, keys = keyChords(sec);
  const start = sec.chords || t.chords || '';
  const s = sheet(`<h3 style="color:var(--bark)">Chord progression · ${esc(sec.name)}</h3>
    <p class="lede">The fixed harmony ${esc(sec.name)} sits on, in ${meterLabel(sec)}. Bars split by <b>|</b>, chords in one bar by spaces, <b>%</b> repeats a bar, <b>N.C.</b> for no chord.</p>
    <textarea id="cp" rows="2" placeholder="e.g. Fm | Db | Bb Ddim | C7">${esc(start)}</textarea>
    ${keys ? `<label class="field">In ${esc(keys.label)}</label><div class="sugs" id="kc" style="--c:var(--bark)">${keys.chords.map(c => `<button class="sug">${esc(c)}</button>`).join('')}</div>` : ''}
    <div id="cprev" style="margin-top:14px"></div>
    <div class="actions"><button class="btn" id="hear"></button></div>
    <label class="field">Save it for</label>
    <div class="actions" style="margin-top:6px"><button class="btn" id="saveTrack">The whole track</button><button class="btn primary" id="saveSec">Just ${esc(sec.name)}</button></div>
    ${sec.chords && t.chords ? `<div class="sugs" style="margin-top:12px"><button class="sug" id="follow">Follow the track’s progression instead</button></div>` : ''}
    ${sec.chords || t.chords ? `<div class="sugs" style="margin-top:8px"><button class="sug" id="clearAll">Remove the progression</button></div>` : ''}`, root => {
    const cp = $('#cp', root);
    const paintHear = () => { $('#hear', root).innerHTML = Beat.on ? ICON.stop + '<span>Stop</span>' : ICON.play + '<span>Hear it</span>'; };
    const preview = () => {
      const bars = parseProg(cp.value);
      const unk = bars.flat().filter(c => !parseChord(c));
      $('#cprev', root).innerHTML = bars.length ? chartHtml(bars) + (unk.length ? `<div class="small faint" style="margin-top:6px;font-style:italic">Not recognised (won’t play): ${unk.map(esc).join(', ')}</div>` : '') : '';
      if (Beat.on) { const v = chordVoice(sec, cp.value); if (v) Beat.retune([v]); }
    };
    cp.oninput = preview;
    root.querySelectorAll('#kc .sug').forEach(b => b.onclick = () => { cp.value = cp.value.trim() ? cp.value.trim() + ' | ' + b.textContent : b.textContent; preview(); });
    $('#hear', root).onclick = () => {
      if (Beat.on) { Beat.stop(); return paintHear(); }
      const v = chordVoice(sec, cp.value);
      if (!v) return toast('Type a few chords first');
      Beat.start([v], pulseOf(sec), { onChange: paintHear }); paintHear();
    };
    const save = async (body, path) => { try { S.track = await api(path, { method: 'PATCH', body }); closeSheet(); renderTrack(); } catch (e) { toast(e.message); } };
    $('#saveSec', root).onclick = () => save({ chords: cp.value.trim() || '' }, '/sections/' + sec.id);
    $('#saveTrack', root).onclick = async () => {
      try {
        await api('/tracks/' + t.id, { method: 'PATCH', body: { chords: cp.value.trim() } });
        S.track = await api('/sections/' + sec.id, { method: 'PATCH', body: { chords: '' } });
        closeSheet(); renderTrack();
      } catch (e) { toast(e.message); }
    };
    const f = $('#follow', root); if (f) f.onclick = () => save({ chords: '' }, '/sections/' + sec.id);
    const c = $('#clearAll', root); if (c) c.onclick = () => confirmSheet('Remove the progression?', `Clears ${sec.chords ? esc(sec.name) + '’s own progression' : ''}${sec.chords && t.chords ? ' and ' : ''}${t.chords ? 'the track’s progression (sections with their own keep theirs)' : ''}.`, 'Remove', async () => {
      if (sec.chords) S.track = await api('/sections/' + sec.id, { method: 'PATCH', body: { chords: '' } });
      if (t.chords) S.track = await api('/tracks/' + t.id, { method: 'PATCH', body: { chords: '' } });
      renderTrack();
    });
    preview(); paintHear();
  });
  s._onclose = () => { Beat.stop(); updateTransport(); };
}

function manageSections() {
  const list = sections();
  sheet(`<h3>Sections</h3><p class="lede">Rename, reorder or remove. Changes to names save when you tap Save.</p>
    <div id="ms">${list.map((x, i) => `<div class="ms-row" data-id="${x.id}">
      <input type="text" value="${esc(x.name)}">
      <button class="icon-btn sm" data-mv="-1" ${i === 0 ? 'disabled' : ''} aria-label="Move earlier">↑</button>
      <button class="icon-btn sm" data-mv="1" ${i === list.length - 1 ? 'disabled' : ''} aria-label="Move later">↓</button>
      <button class="icon-btn sm" data-del ${list.length < 2 ? 'disabled' : ''} aria-label="Delete">${ICON.trash}</button></div>`).join('')}</div>
    <div class="sugs" style="margin-top:10px"><button class="sug" id="msAdd">+ Add a section</button></div>
    <div class="actions"><button class="btn" onclick="closeSheet()">Close</button><button class="btn primary" id="msSave">Save</button></div>`, root => {
    const saveNames = async () => {
      for (const r of root.querySelectorAll('.ms-row')) {
        const x = sections().find(y => y.id === r.dataset.id), name = $('input', r).value.trim();
        if (x && name && name !== x.name) S.track = await api('/sections/' + x.id, { method: 'PATCH', body: { name } });
      }
    };
    root.querySelectorAll('[data-mv]').forEach(b => b.onclick = async () => {
      const id = b.closest('.ms-row').dataset.id, all = sections(), i = all.findIndex(x => x.id === id), j = i + +b.dataset.mv;
      try {
        await saveNames();
        await api('/sections/' + all[i].id, { method: 'PATCH', body: { position: all[j].position } });
        S.track = await api('/sections/' + all[j].id, { method: 'PATCH', body: { position: all[i].position } });
        renderTrack(); manageSections();
      } catch (e) { toast(e.message); }
    });
    root.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
      const x = sections().find(y => y.id === b.closest('.ms-row').dataset.id);
      const n = S.track.ideas.filter(i => i.section_id === x.id).length;
      confirmSheet(`Delete ${esc(x.name)}?`, `This removes its line-up, rhythms and ${plural(n, 'idea')}. It can’t be undone.`, 'Delete section', async () => {
        S.track = await api('/sections/' + x.id, { method: 'DELETE' });
        if (curView().sec.id === x.id || !sections().some(y => y.id === (S.view[S.track.id] || {}).sid)) S.view[S.track.id] = { sid: sections()[0].id };
        renderTrack(); setTimeout(manageSections, 0);
      });
    });
    $('#msAdd', root).onclick = async () => { try { await saveNames(); } catch {} closeSheet(); newSection(); };
    $('#msSave', root).onclick = async () => { try { await saveNames(); closeSheet(); renderTrack(); toast('Sections saved'); } catch (e) { toast(e.message); } };
  });
}

  const M = { n: sec.meter_n, sub: sec.meter_sub };

    <label class="field">Name</label><input id="s-name" type="text" value="${esc(sec.name)}">

    ${meterHtml()}
    <label class="field">Length · the section loops on this when played</label>
    <div class="sugs" id="s-bars">${[0, 1, 2, 4, 8, 12, 16, 24, 32].map(n => `<button class="sug${(sec.bars || 0) === n ? ' on' : ''}" data-n="${n}">${n ? n + ' bars' : 'Not set'}</button>`).join('')}</div>
    <label class="field">Energy · where it climbs and drops</label>
    <div class="sugs" id="energy">${[1, 2, 3, 4, 5].map(e => `<button class="sug" data-e="${e}">${energyBars(e)} ${ENERGY[e]}</button>`).join('')}</div>
    <label class="field">Moves · the choices we make here</label>
    <div id="mvs">${MOVES.map(m => moveRow(m.k, m.label, m.hint, mv[m.k])).join('')}${customs.map(k => moveRow(k, k.slice(2), '', mv[k])).join('')}</div>
    <div class="tempo-row" style="margin-top:8px"><input id="newMove" type="text" placeholder="Name a new move"><button class="btn" id="addMove" type="button">Add</button></div>
    <label class="field">Notes on this section</label><textarea id="s-notes" placeholder="How many times round, cues, who leads…">${esc(sec.notes)}</textarea>
    <div class="sugs" style="margin-top:14px">
      <button class="sug" id="mvL" ${idx === 0 ? 'disabled style="opacity:.4"' : ''}>← Move earlier</button>
      <button class="sug" id="mvR" ${idx === sections().length - 1 ? 'disabled style="opacity:.4"' : ''}>Move later →</button>
    </div>
    <div class="actions"><button class="btn" onclick="closeSheet()">Cancel</button><button class="btn primary" id="save">Save</button></div>
    ${sections().length > 1 ? '<div style="margin-top:22px"><button class="btn danger block" id="del">Delete section</button></div>' : ''}`, root => {
    meterPicker(root, M);
    let bars = sec.bars || 0;
    root.querySelectorAll('#s-bars .sug').forEach(b => b.onclick = () => { bars = +b.dataset.n; root.querySelectorAll('#s-bars .sug').forEach(x => x.classList.toggle('on', x === b)); });
    tapTempo($('#s-tap', root), $('#s-tempo', root));
    if (focusId) setTimeout(() => $('#' + focusId, root).focus(), 50);
    const drawEnergy = () => root.querySelectorAll('#energy .sug').forEach(b => b.classList.toggle('on', +b.dataset.e === energy));
    root.querySelectorAll('#energy .sug').forEach(b => b.onclick = () => { energy = energy === +b.dataset.e ? 0 : +b.dataset.e; drawEnergy(); });
    drawEnergy();
    const wireRow = r => { $('.mv-toggle', r).onclick = () => { const on = r.classList.toggle('on'); $('.check', r).textContent = on ? '✓' : ''; $('input', r).classList.toggle('hidden', !on); if (on) $('input', r).focus(); }; };
    root.querySelectorAll('.mv-row').forEach(wireRow);
    $('#addMove', root).onclick = () => {
      const name = $('#newMove', root).value.trim(); if (!name) return;
      $('#mvs', root).insertAdjacentHTML('beforeend', moveRow('x:' + name, name, '', ''));
      const r = $('#mvs', root).lastElementChild; wireRow(r); $('.mv-toggle', r).click(); $('#newMove', root).value = '';
    };
    const move = async d => {
      const other = sections()[idx + d];
      try {
        await api('/sections/' + sec.id, { method: 'PATCH', body: { position: other.position } });
        S.track = await api('/sections/' + other.id, { method: 'PATCH', body: { position: sec.position } });
        closeSheet(); selectView(sec.id);
      } catch (e) { toast(e.message); }
    };
    if (idx > 0) $('#mvL', root).onclick = () => move(-1);
    if (idx < sections().length - 1) $('#mvR', root).onclick = () => move(1);
    $('#save', root).onclick = async () => {
      const moves = {};
      root.querySelectorAll('.mv-row.on').forEach(r => { moves[r.dataset.k] = $('input', r).value.trim(); });
      const body = { name: $('#s-name', root).value, notes: $('#s-notes', root).value, meter_n: M.n, meter_sub: M.sub,
        maqam: $('#s-maqam', root).value, tonic: $('#s-tonic', root).value, tempo: $('#s-tempo', root).value, energy: energy || '', moves, bars: bars || '' };
      try { S.track = await api('/sections/' + sec.id, { method: 'PATCH', body }); closeSheet(); renderTrack(); }
      catch (e) { toast(e.message); }
    };
    const del = $('#del', root);
    if (del) del.onclick = () => deleteSection(sec, idx);
  });
}

/* ---------- line-up ---------- */
// People are the fixed resource: each of you is in one layer per section, or out. Production can fill any number of layers.
function lineupOf(sid) {
  const hs = S.track.holders.filter(h => h.section_id === sid);
  const people = S.members.map(m => {
    const h = hs.find(x => x.member_id === m.id);
    return { id: m.id, name: m.name, guest: !!m.guest, layer: h ? h.layer : null, instrument: h ? h.instrument : '', sound_ids: sidsOf(h) };
  });
  const prod = hs.filter(h => h.member_id === PRODUCTION);
  return { people, prod };
}
function lineupStrip(sec) {
  const { people, prod } = lineupOf(sec.id);
  const members = people.filter(p => !p.guest);
  const inCount = members.filter(p => p.layer).length, guestsIn = people.filter(p => p.guest && p.layer).length;
  const chips = LAYERS.flatMap(l => people.filter(p => p.layer === l.key).map(p => `<span class="lu" style="--c:${l.c}">${esc(p.name)}${p.guest ? ' (guest)' : ''}${p.instrument ? ' · ' + esc(p.instrument) : ''}${p.sound_ids.length ? ' · ' + esc(soundsLabel(p.sound_ids)) : ''}</span>`))
    .concat(prod.map(h => `<span class="lu prod" style="--c:${LAYER[h.layer].c}">Production · ${esc(LAYER[h.layer].short)}${h.instrument ? ' · ' + esc(h.instrument) : ''}</span>`))
    .concat(members.filter(p => !p.layer).map(p => `<span class="lu out">${esc(p.name)} · out</span>`));
  return `<button class="lineup" onclick="editLineup()"><div class="lbl"><b>Line-up · ${inCount} of ${members.length} playing${guestsIn ? ` + ${guestsIn} guest${guestsIn > 1 ? 's' : ''}` : ''}</b><span class="ar">مين فين؟</span></div>${chips.join('')}</button>`;
}

function editLineup(focusLayer) {
  const { sec } = curView();
  const { people, prod } = lineupOf(sec.id);
  const P = people.map(p => ({ ...p }));
  const prodOn = Object.fromEntries(LAYERS.map(l => [l.key, prod.some(h => h.layer === l.key)]));
  const prodWhat = Object.fromEntries(LAYERS.map(l => [l.key, (prod.find(h => h.layer === l.key) || {}).instrument || '']));
  const PROD_SUGS = { bloom: ['lead synth', 'samples', 'vocal chop'], bark: ['pad', 'keys', 'strings'], ground: ['bass synth', 'sub', 'drone'], substrate: ['drum loop', 'percussion loop', 'beat'] };
  const choice = (layer, cur) => [...LAYERS.map(l => `<button class="sug${cur === l.key ? ' on' : ''}" data-l="${l.key}" style="--c:${l.c}">${l.short}</button>`),
    `<button class="sug${!cur ? ' on' : ''}" data-l="" style="--c:var(--faint)">Out</button>`].join('');

  sheet(`<h3>Line-up · ${esc(sec.name)}<span class="ar">مين فين؟</span></h3>

    <div class="lu-sum" id="sum"></div>
    ${(() => { const pv = sections()[sections().indexOf(sec) - 1]; return pv && S.track.holders.some(h => h.section_id === pv.id) ? `<button class="btn block lu-copy" id="luCopy">Same as ${esc(pv.name)}</button>` : ''; })()}
    ${P.map((p, i) => `${p.guest && !(P[i - 1] || {}).guest ? '<div class="list-head"><b>Guest performers</b></div>' : ''}<div class="lu-row${p.guest ? ' guest' : ''}" data-i="${i}"><div class="top-l"><b>${esc(p.name)}${p.guest ? '<span class="guest-tag">guest</span>' : ''}</b><input type="text" placeholder="on what?" value="${esc(p.instrument)}"></div>

      <div class="row2" style="margin-top:8px"><input id="gName" type="text" placeholder="name, e.g. Layla"><input id="gWhat" type="text" placeholder="what, e.g. vocals"></div>
      <button class="btn block" id="gAdd" style="margin-top:8px">Add guest performer</button></div>
    <div class="lu-row prod"><div class="top-l"><b>Production</b><span class="small muted" style="font-style:italic">the one role that can be in every layer at once</span></div>
      ${LAYERS.map(l => `<div class="prod-l${prodOn[l.key] ? ' on' : ''}" data-l="${l.key}" style="--c:${l.c}">
        <button type="button" class="prod-t"><span class="check">${prodOn[l.key] ? '✓' : ''}</span><b>${l.name}</b></button>
        <div class="prod-what${prodOn[l.key] ? '' : ' hidden'}"><input type="text" placeholder="what? e.g. ${PROD_SUGS[l.key][0]}" value="${esc(prodWhat[l.key])}">
          <div class="sugs">${PROD_SUGS[l.key].map(x => `<button type="button" class="sug">${x}</button>`).join('')}</div></div>
      </div>`).join('')}</div>
    <div class="actions"><button class="btn" onclick="closeSheet()">Cancel</button><button class="btn primary" id="save">Save line-up</button></div>`, root => {
    const sum = () => {
      $('#sum', root).innerHTML = LAYERS.map(l => {
        const names = P.filter(p => p.layer === l.key).map(p => esc(p.name));
        if (prodOn[l.key]) names.push(`<i>production${prodWhat[l.key] ? ' · ' + esc(prodWhat[l.key]) : ''}</i>`);
        return `<div style="--c:${l.c}"><b>${l.short}</b>${names.length ? names.join(', ') : '<span class="empty-l">empty</span>'}</div>`;
      }).join('');
    };
    const rowsDraw = {};
    root.querySelectorAll('.lu-row[data-i]').forEach(r => {
      const p = P[+r.dataset.i];
      const own = () => instrumentsOf(p.id);
      p.auto = !p.instrument || own().includes(p.instrument);
      p.sAuto = !p.sound_ids.length;
      // Fill in instrument and sound from memory, unless the person already chose them by hand.
      const guess = onIns => {
        const rc = p.layer ? recall(p.id, p.layer, sec.id, onIns || null) : null;
        if (!onIns && p.auto) { p.instrument = (rc && rc.instrument) || fitFirst(own(), p.layer)[0] || ''; $('input', r).value = p.instrument; }
        if (p.sAuto) { const ins = insByName(p.id, p.instrument), mine = ins ? soundsOf(ins.id).map(x => x.id) : []; p.sound_ids = rc ? (rc.sound_ids || []).filter(id => mine.includes(id)) : []; }
        p.why = rc && (rc.instrument || rc.sound_id) && (p.sound_ids.length || p.auto) ? rc.why : '';
      };
      const drawInst = () => {

        box.innerHTML = fitFirst(list, p.layer).map(x => `<button class="sug${sameName(x, p.instrument) ? ' on' : ''}" style="--c:${p.layer ? LAYER[p.layer].c : 'var(--accent)'}">${esc(x)}</button>`).join('');
        box.querySelectorAll('.sug').forEach(b => b.onclick = () => { p.instrument = b.textContent; p.auto = false; p.sAuto = true; $('input', r).value = p.instrument; guess(p.instrument); drawInst(); });
        const ins = p.layer && insByName(p.id, p.instrument), snds = ins ? soundsOf(ins.id) : [];
        p.sound_ids = p.sound_ids.filter(id => snds.some(x => x.id === id));
        const sb = $('.snd', r), c = LAYER[p.layer] ? LAYER[p.layer].c : 'var(--accent)';
        sb.classList.toggle('hidden', !p.layer || !p.instrument.trim());
        sb.innerHTML = `<span class="snd-k">sounds</span>` + snds.map(x => `<button class="sug${p.sound_ids.includes(x.id) ? ' on' : ''}" data-s="${esc(x.id)}" style="--c:${c}">${p.sound_ids.includes(x.id) ? '✓ ' : ''}${esc(x.name)}</button>`).join('') + `<button class="sug ghost" data-new>+ new</button>`;
        // Any number of sounds per section; each recording later picks one of them.

        $('[data-new]', sb).onclick = e => {
          const b = e.currentTarget; b.outerHTML = `<input class="sug-in" type="text" placeholder="name it, e.g. ebow">`;
          const inp = $('input.sug-in', sb); inp.focus();
          const done = async () => { const v = inp.value.trim(); inp.onblur = null; if (!v) return drawInst(); try { const x = await newSoundFor(p.id, p.instrument.trim(), v); p.sound_ids = [...p.sound_ids, x.id]; p.sAuto = false; p.why = ''; drawInst(); } catch (err) { toast(err.message); } };
          inp.onkeydown = ev => { if (ev.key === 'Enter') { ev.preventDefault(); done(); } if (ev.key === 'Escape') { inp.onblur = null; drawInst(); } };

      r.querySelectorAll('.lay .sug').forEach(b => b.onclick = () => {
        p.layer = b.dataset.l || null;
        r.querySelectorAll('.lay .sug').forEach(x => x.classList.toggle('on', x === b));

      drawInst();

    const cp = $('#luCopy', root); if (cp) cp.onclick = () => {
      const pv = sections()[sections().indexOf(sec) - 1], hs = S.track.holders.filter(h => h.section_id === pv.id);
      P.forEach(p => { const h = hs.find(x => x.member_id === p.id); p.layer = h ? h.layer : null; p.instrument = h ? h.instrument : ''; p.sound_ids = sidsOf(h); p.auto = false; p.sAuto = false; p.why = h ? 'like in ' + pv.name : ''; rowsDraw[p.id] && rowsDraw[p.id](); });
      LAYERS.forEach(l => { const h = hs.find(x => x.member_id === PRODUCTION && x.layer === l.key); prodOn[l.key] = !!h; prodWhat[l.key] = h ? h.instrument : '';
        const r = root.querySelector(`.prod-l[data-l="${l.key}"]`); r.classList.toggle('on', prodOn[l.key]); $('.check', r).textContent = prodOn[l.key] ? '✓' : ''; $('.prod-what', r).classList.toggle('hidden', !prodOn[l.key]); $('input', r).value = prodWhat[l.key]; });

      const k = r.dataset.l;
      $('.prod-t', r).onclick = () => { prodOn[k] = !prodOn[k]; r.classList.toggle('on', prodOn[k]); $('.check', r).textContent = prodOn[k] ? '✓' : ''; $('.prod-what', r).classList.toggle('hidden', !prodOn[k]); sum(); };
      $('input', r).oninput = e => { prodWhat[k] = e.target.value; };

    });
    const holdersNow = () => [
      ...P.filter(p => p.layer).map(p => ({ member_id: p.id, layer: p.layer, instrument: p.instrument, sound_ids: p.sound_ids })),
      ...LAYERS.filter(l => prodOn[l.key]).map(l => ({ member_id: PRODUCTION, layer: l.key, instrument: prodWhat[l.key] })),
    ];
    $('#save', root).onclick = async () => {

    };
    $('#gAdd', root).onclick = async () => {

/* ---------- beat editor ---------- */
function editBeat(layerKey) {
  const l = LAYER[layerKey];
  const { sec } = curView();
  const cur = beatOf(sec.id, layerKey);
  const defSub = sec.meter_sub === 1 ? 2 : sec.meter_sub;
  const defBar = sec.meter_sub === 1 ? sec.meter_n * 2 : sec.meter_n;
  const B = { sub: cur ? subOf(cur) : defSub, bar: cur ? barOf(cur) : defBar, bars: [] };
  const src = cur ? cur.pattern : ('D' + '-'.repeat(defBar - 1));
  for (let i = 0; i < src.length; i += B.bar) B.bars.push(src.slice(i, i + B.bar).split(''));
  const others = S.track.beats.filter(b => b.section_id === sec.id && b.layer !== layerKey);
  let withOthers = others.length > 0;
  stopEverything();

  const lengths = [...new Set([...LENGTHS, B.bar])].sort((a, b) => a - b);
  const s = sheet(`<h3 style="color:${l.c}">${l.name} · rhythm</h3>
    <p class="lede">A rhythmic figure for this layer: a groove, a riff’s accents, a strum pattern. ${esc(sec.name)} is in ${meterLabel(sec)}; same pulse as the rest of the track.</p>
    <label class="field">Name</label><input id="bname" type="text" value="${esc(cur ? cur.name : '')}" placeholder="e.g. Maqsum, or anything">
    <label class="field">Start from a groove</label>
    <div id="ours"></div>
    ${GROOVES.map(g => `<div class="sug-group">${g.group}</div>` + chipsHtml('', g.items.map(p => `<button class="sug" data-p="${esc(p.name)}">${esc(p.name)}${p.check ? ' <i class="chk">check</i>' : ''}</button>`).join(''), l.c)).join('')}
    <div class="sugs" style="--c:${l.c}"><button class="sug" data-p="">Clear</button></div>
    <div class="small faint" style="margin-top:8px;font-style:italic">Arabic grooves are the skeletons from <a href="https://www.maqamworld.com/en/iqaa.php" target="_blank" rel="noopener">MaqamWorld</a>; ornament them your way.</div>
    <label class="field">Subdivision</label>${chipsHtml('subs', SUBS.map(x => `<button class="sug" data-s="${x.v}">${x.label}</button>`).join(''), l.c)}
    <label class="field">Steps per bar</label>${chipsHtml('lens', lengths.map(n => `<button class="sug" data-n="${n}">${n}</button>`).join(''), l.c)}
    <label class="field">Bars</label>${chipsHtml('nbars', [1, 2, 3, 4].map(n => `<button class="sug" data-b="${n}">${n}</button>`).join(''), l.c)}
    <div class="pulse-hint" id="phint"></div>
    <div id="grid" style="--c:${l.c}"></div>
    <div class="grid-key"><span><i style="background:${l.c}"></i>D · dum / kick</span><span><i style="background:color-mix(in srgb, ${l.c} 48%, transparent)"></i>T · tak / snare</span><span><i style="background:color-mix(in srgb, ${l.c} 18%, transparent)"></i>K · ka / hat</span><span>Tap a cell to cycle</span></div>
    ${others.length ? `<button class="toggle${withOthers ? ' on' : ''}" id="withOthers"><span class="sw"></span><span><b>Hear it with the other layers’ rhythms</b><br><span class="small muted">${others.map(b => esc(LAYER[b.layer].short) + ': ' + esc(b.name || 'beat')).join(' · ')}</span></span></button>` : ''}
    <div class="actions"><button class="btn" id="prev"></button><button class="btn primary" id="save">Save rhythm</button></div>
    <div class="sugs" style="margin-top:12px"><button class="sug" id="toOurs">＋ Save to our grooves</button><button class="sug hidden" id="rmOurs"></button></div>
    ${cur ? '<div style="margin-top:14px"><button class="btn danger block" id="rm">Remove rhythm</button></div>' : ''}`, root => {
    const grid = $('#grid', root);
    const cols = n => n <= 9 ? n : n === 10 ? 5 : n === 12 ? 6 : n === 15 ? 5 : 8;
    const pattern = () => B.bars.map(b => b.join('')).join('');
    const voices = () => [{ layer: 'edit', pattern: pattern(), sub: B.sub, k: l.k }, ...(withOthers ? sectionVoices(sec.id, layerKey) : [])];
    const paintPrev = () => { $('#prev', root).innerHTML = Beat.on ? ICON.stop + '<span>Stop</span>' : ICON.play + '<span>Preview</span>'; };
    const on = (sel, attr, v) => root.querySelectorAll(sel + ' .sug').forEach(b => b.classList.toggle('on', +b.dataset[attr] === v));
    const wireLen = b => b.onclick = () => {
      B.bar = +b.dataset.n;
      B.bars = B.bars.map(bar => Array.from({ length: B.bar }, (_, i) => bar[i] || '-'));
      draw();
    };
    const draw = () => {
      if (!root.querySelector(`#lens [data-n="${B.bar}"]`)) {
        $('#lens', root).insertAdjacentHTML('beforeend', `<button class="sug" data-n="${B.bar}">${B.bar}</button>`);
        wireLen($('#lens', root).lastElementChild);
      }
      grid.innerHTML = B.bars.map((bar, bi) => `${B.bars.length > 1 ? `<div class="bar-label">Bar ${bi + 1}</div>` : ''}<div class="grid" style="grid-template-columns:repeat(${cols(B.bar)}, 1fr)">${bar.map((c, i) => `<button data-b="${bi}" data-i="${i}" class="${c === '-' ? 'R' : c}">${c === '-' ? '·' : c}</button>`).join('')}</div>`).join('');
      on('#subs', 's', B.sub); on('#lens', 'n', B.bar); on('#nbars', 'b', B.bars.length);
      const pulses = B.bar / B.sub, secP = secBarPulses(sec);
      $('#phint', root).textContent = `One bar = ${+pulses.toFixed(2)} pulse${pulses === 1 ? '' : 's'} at ${pulseOf(sec)} bpm` +
        (Math.abs(pulses - secP) > 1e-6 ? ` · the section’s ${meterLabel(sec)} bar is ${+secP.toFixed(2)}, so this one drifts against it.` : ` · matches the section’s ${meterLabel(sec)}.`);
      if (Beat.on) Beat.retune(voices());
    };
    grid.onclick = e => {
      const b = e.target.closest('button'); if (!b) return;
      const bar = B.bars[+b.dataset.b], i = +b.dataset.i;
      bar[i] = { '-': 'D', D: 'T', T: 'K', K: '-' }[bar[i]];
      draw();
    };
    let loadedOurs = null;
    const loadPreset = name => {
      const p = GROOVES.flatMap(g => g.items).find(x => x.name === name);
      if (p && p.bar && p.bar < p.p.length) { B.sub = p.sub; B.bar = p.bar; B.bars = []; for (let i = 0; i < p.p.length; i += p.bar) B.bars.push(p.p.slice(i, i + p.bar).split('')); $('#bname', root).value = p.name; }
      else if (p) { B.sub = p.sub; B.bar = p.p.length; B.bars = B.bars.map(() => p.p.split('')); $('#bname', root).value = p.name; }
      else B.bars = B.bars.map(bar => bar.map(() => '-'));
      loadedOurs = null; drawOurs(); draw();
    };
    const drawOurs = () => {
      const box = $('#ours', root);
      box.innerHTML = S.grooves.length ? `<div class="sug-group">Ours <span class="ar">بتاعتنا</span></div>` + chipsHtml('', S.grooves.map(g => `<button class="sug${loadedOurs === g.id ? ' on' : ''}" data-g="${esc(g.id)}">${esc(g.name)}</button>`).join(''), l.c) : '';

        const g = S.grooves.find(x => x.id === b.dataset.g);
        B.sub = g.sub; B.bar = g.bar || g.pattern.length; B.bars = [];
        for (let i = 0; i < g.pattern.length; i += B.bar) B.bars.push(g.pattern.slice(i, i + B.bar).split(''));
        $('#bname', root).value = g.name; loadedOurs = g.id; drawOurs(); draw();
      });

      rm.classList.toggle('hidden', !g);
      if (g) { rm.textContent = `Remove “${g.name}” from our grooves`; rm.onclick = () => confirmSheet(`Remove ${esc(g.name)}?`, 'It comes off everyone’s groove list. Rhythms already saved on layers stay as they are.', 'Remove', async () => {
        await api('/grooves/' + g.id, { method: 'DELETE' }); S.grooves = S.grooves.filter(x => x.id !== g.id); toast('Removed from our grooves');
      }); }
    };

      if (!/[DTK]/.test(pattern())) return toast('Tap a few cells first');
      try {
        const g = await api('/grooves', { method: 'POST', body: { name, pattern: pattern(), sub: B.sub, bar: B.bar } });
        S.grooves = [...S.grooves.filter(x => x.id !== g.id), g].sort((a, b) => a.name.localeCompare(b.name));

      } catch (e) { toast(e.message); }
    };
    drawOurs();
    root.querySelectorAll('#subs .sug').forEach(b => b.onclick = () => { B.sub = +b.dataset.s; draw(); });
    root.querySelectorAll('#lens .sug').forEach(wireLen);
    root.querySelectorAll('#nbars .sug').forEach(b => b.onclick = () => {
      const n = +b.dataset.b;
      while (B.bars.length < n) B.bars.push(B.bars[B.bars.length - 1].slice());
