<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shajara</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shajara">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=Aref+Ruqaa:wght@400;700&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..600&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --bg: #000;
  --surface: #111;
  --surface-2: #1b1b1b;
  --line: #2b2b2b;
  --text: #fff;
  --muted: #a4a4a4;
  --faint: #626262;
  --accent: #ffce00;
  --primary: #fff;
  --primary-ink: #000;
  --danger: #ff5a4e;
  --brand-green: #00ce7a;
  --brand-blue: #0051c6;
  --brand-yellow: #ffce00;
  --bloom: #ffce00;
  --bark: #f2efe6;
  --ground: #00ce7a;
  --substrate: #2f6ef2;
  --transition: #fff;
  --radius: 18px;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --serif: "Newsreader", "Iowan Old Style", Georgia, serif;
  --sans: "Archivo", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --arabic: "Aref Ruqaa", "Noto Naskh Arabic", "Geeza Pro", serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 var(--sans); }
html { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
button { touch-action: manipulation; -webkit-user-select: none; user-select: none; }
.tap.flash { animation: tapflash .18s ease-out; }
@keyframes tapflash { from { background: var(--brand-yellow); color: #000; border-color: var(--brand-yellow); } }
.tap { min-width: 104px; }
body { min-height: 100dvh; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); overscroll-behavior-y: contain; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
a { color: var(--accent); }
.wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 140px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 13px; }
.hidden { display: none !important; }
.disp { font-family: var(--display); font-stretch: 125%; font-weight: 800; text-transform: uppercase; letter-spacing: .01em; }
.ar { font-family: var(--arabic); font-weight: 400; direction: rtl; word-spacing: .25em; }
.serif { font-family: var(--serif); }

.top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.top-in { max-width: 640px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 10px; min-height: 58px; }
.top h1 { font: 800 17px/1.15 var(--display); font-stretch: 125%; text-transform: uppercase; letter-spacing: .01em; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top .logo { height: 36px; width: auto; display: block; }
.icon-btn { width: 40px; height: 40px; border-radius: 999px; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); flex: none; }
.icon-btn svg { width: 19px; height: 19px; }
.icon-btn.sm { width: 34px; height: 34px; }
.icon-btn.sm svg { width: 16px; height: 16px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 18px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); font: 700 13px/1.1 var(--display); font-stretch: 112%; text-transform: uppercase; letter-spacing: .03em; }
.btn svg { width: 17px; height: 17px; }
.btn.primary { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.btn.danger { background: transparent; color: var(--danger); border: 1px solid color-mix(in srgb, var(--danger) 45%, transparent); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; }

input[type=text], input[type=password], input[type=number], input[type=url], textarea {
  width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; outline: none; font-family: var(--serif); font-size: 17px;
}
input:focus, textarea:focus { border-color: var(--text); }
textarea { resize: vertical; min-height: 90px; }
label.field { display: block; margin: 18px 0 7px; font: 700 11px/1.2 var(--display); font-stretch: 112%; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }

/* gate */
.gate { min-height: 88dvh; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
.gate .logo-big { height: 170px; width: auto; align-self: center; margin-bottom: 10px; }
.gate h2 { font: 800 30px/1.05 var(--display); font-stretch: 125%; text-transform: uppercase; margin: 0; text-align: center; }
.gate .ar-sub { text-align: center; font-size: 26px; color: var(--muted); margin-top: -6px; }
.gate p { margin: 0 0 8px; text-align: center; font-family: var(--serif); font-size: 17px; }
.gate .handle { text-align: center; color: var(--brand-yellow); font-family: var(--serif); font-size: 14px; }
.people { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.person { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; text-align: left; min-height: 78px; }
.person b { display: block; font: 800 15px/1.2 var(--display); font-stretch: 125%; text-transform: uppercase; }
.person .small { font-family: var(--serif); font-style: italic; }

/* home */
.hello { margin: 8px 0 20px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.hello h2 { font: 800 26px/1.05 var(--display); font-stretch: 125%; text-transform: uppercase; margin: 0; }
.hello .ar { font-size: 28px; color: var(--muted); line-height: 1.2; }
.track-row { display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 14px 12px; margin-bottom: 12px; position: relative; }
.track-row { cursor: pointer; }
.track-row .tr-top { display: flex; align-items: flex-start; gap: 8px; }
.track-row .t { flex: 1; font: 800 18px/1.15 var(--display); font-stretch: 125%; text-transform: uppercase; }
.track-row .kebab { margin: -6px -6px 0 0; padding: 4px 8px; font-size: 20px; color: var(--muted); }
.track-row .dot { position: static; margin-top: 1px; }
.list-head { display: flex; justify-content: space-between; align-items: baseline; margin: 24px 0 10px; }
.list-head b { font: 800 13px/1 var(--display); font-stretch: 125%; text-transform: uppercase; letter-spacing: .02em; }
.list-head .ar { font-size: 22px; color: var(--muted); }
.menu { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.menu-item { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); text-align: left; }
.menu-item svg { width: 19px; height: 19px; flex: none; }
.menu-item b { display: block; font: 800 12px/1.2 var(--display); font-stretch: 112%; text-transform: uppercase; letter-spacing: .03em; }
.menu-item .small { display: block; font: italic 14px/1.3 var(--serif); margin-top: 3px; }
.menu-item.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 35%, var(--line)); }
.btn.danger-solid { background: var(--danger); border-color: var(--danger); color: #000; }
.member-row .nm-act { display: flex; align-items: center; gap: 10px; }
.track-row .meta { font: italic 14px/1.3 var(--serif); color: var(--muted); margin: 4px 0 8px; }
.track-row .form-line { font: 700 11px/1.3 var(--display); font-stretch: 112%; text-transform: uppercase; letter-spacing: .05em; color: var(--text); margin-bottom: 10px; }
.track-row .form-line .arr { color: var(--brand-yellow); padding: 0 6px; }
.dot { position: absolute; top: 16px; right: 14px; color: var(--brand-yellow); font-size: 16px; line-height: 1; }
.mini-tree { display: flex; flex-direction: column; gap: 4px; }
.mini-layer { display: grid; grid-template-columns: 82px 1fr auto; gap: 8px; align-items: center; border-radius: 9px; padding: 6px 9px; font-size: 13px; background: color-mix(in srgb, var(--c) 12%, transparent); }
.mini-layer .ln { font: 800 9px/1 var(--display); font-stretch: 125%; letter-spacing: .06em; text-transform: uppercase; color: var(--c); }
.mini-layer .who { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--serif); font-size: 14px; }
.mini-layer .bt { font-size: 12px; color: color-mix(in srgb, var(--c) 75%, var(--text)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px; font-family: var(--serif); font-style: italic; }
.mini-layer .open { color: var(--faint); font-style: italic; }
.empty { text-align: center; padding: 48px 12px; color: var(--muted); font-family: var(--serif); font-size: 18px; }
.fab { position: fixed; right: max(16px, calc(50% - 304px)); bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 6; box-shadow: 0 10px 28px rgba(0,0,0,.6); padding: 16px 22px; }

.legend { border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-top: 4px; font-size: 14px; }
.legend h4 { margin: 0 0 8px; font: 800 13px/1.2 var(--display); font-stretch: 125%; text-transform: uppercase; display: flex; justify-content: space-between; align-items: baseline; }
.legend h4 .ar { font-size: 20px; color: var(--muted); text-transform: none; }
.legend .l { display: grid; grid-template-columns: 150px 1fr; padding: 4px 0; align-items: baseline; }
.legend b { color: var(--c); font: 800 11px/1.3 var(--display); font-stretch: 125%; text-transform: uppercase; }
.legend span { font-family: var(--serif); }
.legend p { margin: 10px 0 0; color: var(--muted); font: 15px/1.45 var(--serif); }

/* track */
.hero { padding: 4px 0 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 7px 13px; font: 16px/1.2 var(--serif); display: inline-flex; align-items: baseline; gap: 7px; }
.chip .k { color: var(--muted); font: 700 9px/1 var(--display); font-stretch: 112%; text-transform: uppercase; letter-spacing: .06em; }
.chip.ghost { color: var(--faint); border-style: dashed; background: transparent; font-style: italic; }
.notes { display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-top: 10px; white-space: pre-wrap; font: 16px/1.45 var(--serif); color: color-mix(in srgb, var(--text) 88%, var(--muted)); }

.form { display: flex; align-items: center; gap: 6px; overflow-x: auto; padding: 2px 16px 4px; margin: 0 -16px 16px; scrollbar-width: none; }
.form::-webkit-scrollbar { display: none; }
.sec-pill { flex: none; padding: 10px 15px 9px; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--line); font: 800 13px/1.1 var(--display); font-stretch: 125%; text-transform: uppercase; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.sec-pill .dots { display: flex; gap: 3px; }
.sec-pill .dots i { width: 7px; height: 7px; border-radius: 2px; background: var(--c); opacity: .18; }
.sec-pill .dots i.on { opacity: 1; }
.sec-pill.sel { border-color: var(--text); background: var(--surface-2); }
.tr-pill { flex: none; height: 34px; min-width: 34px; padding: 0 9px; border-radius: 999px; display: grid; grid-auto-flow: column; align-items: center; gap: 3px; color: var(--brand-yellow); border: 1.5px dashed var(--line); font-size: 13px; }
.tr-pill.has { border-style: solid; border-color: color-mix(in srgb, var(--brand-yellow) 60%, transparent); }
.tr-pill.sel { background: var(--brand-yellow); color: #000; border-color: var(--brand-yellow); }
.tr-pill b { font: 800 10px/1 var(--display); }
.add-pill { flex: none; padding: 11px 14px; border-radius: 14px; border: 1.5px dashed var(--line); color: var(--muted); font: 700 11px/1 var(--display); font-stretch: 112%; text-transform: uppercase; letter-spacing: .04em; }

.sec-head { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; }
.sec-head h2 { font: 800 24px/1.05 var(--display); font-stretch: 125%; text-transform: uppercase; margin: 0; }
.sec-head .meter { font: 800 13px/1 var(--display); padding: 7px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--text); }
.sec-head .sp { flex: 1; }

.tree { position: relative; }
.layer { position: relative; border-radius: var(--radius); margin-bottom: 16px; background: var(--surface); border: 1px solid color-mix(in srgb, var(--c) 28%, var(--line)); }
.layer + .layer::before { content: ""; position: absolute; left: 33px; top: -17px; width: 2px; height: 16px; background: linear-gradient(var(--pc), var(--c)); opacity: .8; }
.layer-head { padding: 14px 14px 8px; display: flex; gap: 12px; align-items: center; }
.layer-glyph { width: 40px; height: 40px; position: relative; flex: none; display: grid; place-items: center; color: #000; }
.layer-glyph > svg.star { position: absolute; inset: 0; width: 100%; height: 100%; fill: var(--c); }
.layer-glyph > svg.g { position: relative; width: 19px; height: 19px; }
.layer-name { font: 800 14px/1.1 var(--display); font-stretch: 125%; text-transform: uppercase; }
.layer-role { font: italic 14px/1.2 var(--serif); color: var(--muted); }
.layer-ar { margin-left: auto; font-size: 22px; color: color-mix(in srgb, var(--c) 70%, var(--muted)); line-height: 1; }
.holders { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 10px 66px; }
.holder { font: 15px/1.2 var(--serif); padding: 5px 11px; border-radius: 999px; background: color-mix(in srgb, var(--c) 18%, transparent); color: color-mix(in srgb, var(--c) 55%, var(--text)); }
.holder.empty { color: var(--faint); background: transparent; border: 1px dashed var(--line); font-style: italic; font-size: 14px; }

.beat { display: block; width: calc(100% - 28px); margin: 0 14px 12px; text-align: left; background: #000; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.beat-top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.beat-top .k { font: 800 9px/1 var(--display); font-stretch: 125%; letter-spacing: .08em; text-transform: uppercase; color: var(--c); }
.beat-top .nm { font: 600 16px/1.1 var(--serif); }
.beat-top .ln { margin-left: auto; font-size: 12px; color: var(--faint); white-space: nowrap; }
.lanes { display: flex; flex-direction: column; gap: 5px; }
.cells { display: flex; }
.cells i { display: block; flex: none; padding-right: 3px; }
.cells i b { display: block; height: 20px; border-radius: 4px; box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--c) 28%, transparent); transition: transform .06s; }
.cells i.D b { background: var(--c); box-shadow: none; }
.cells i.T b { background: color-mix(in srgb, var(--c) 50%, transparent); box-shadow: none; }
.cells i.K b { background: color-mix(in srgb, var(--c) 22%, transparent); box-shadow: none; height: 12px; margin-top: 4px; }
.cells i.bs b { margin-left: 4px; }
.cells i.now b { outline: 2px solid var(--text); outline-offset: 1px; transform: scale(1.08); }

.ideas { padding: 0 14px 2px; }
.idea { border-top: 1px solid var(--line); padding: 11px 0; }
.idea-top { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.idea-top .by { color: var(--text); font: 800 10px/1 var(--display); font-stretch: 125%; text-transform: uppercase; letter-spacing: .03em; }
.idea-top .sp { flex: 1; }
.idea-top > span { font-family: var(--serif); font-style: italic; }
.new-tag { color: var(--brand-yellow); font: 800 9px/1 var(--display) !important; font-style: normal !important; letter-spacing: .07em; text-transform: uppercase; }
.idea-body { margin-top: 5px; white-space: pre-wrap; overflow-wrap: anywhere; font: 17px/1.4 var(--serif); }
.star { color: var(--faint); font-size: 17px; line-height: 1; padding: 4px; }
.star.on { color: var(--brand-yellow); }
.kebab { color: var(--faint); padding: 4px 6px; font-size: 18px; line-height: 1; }
.more { display: block; width: 100%; padding: 9px 0 11px; color: var(--muted); font: italic 14px/1.2 var(--serif); text-align: left; border-top: 1px solid var(--line); }
.compose { display: flex; gap: 6px; padding: 6px 14px 14px; }
.compose button { flex: 1; min-width: 0; padding: 9px 2px 8px; border-radius: 12px; background: #000; border: 1px solid var(--line); font: 700 9px/1 var(--display); font-stretch: 112%; letter-spacing: .05em; text-transform: uppercase; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; color: var(--text); }
.compose button svg { width: 18px; height: 18px; flex: none; }
.compose .rec { color: #fff; background: color-mix(in srgb, var(--danger) 22%, #000); border-color: color-mix(in srgb, var(--danger) 45%, var(--line)); }
.pick { display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); font: 700 9px/1 var(--display); font-stretch: 112%; text-transform: uppercase; letter-spacing: .04em; }
.pick svg { width: 13px; height: 13px; }
.pick.on { background: var(--text); border-color: var(--text); color: #000; }
.player.live .play { box-shadow: 0 0 0 3px color-mix(in srgb, var(--c, var(--text)) 35%, transparent); }
.wrap.with-picks { padding-bottom: 210px; }
.pickbar { position: fixed; left: 0; right: 0; bottom: calc(71px + env(safe-area-inset-bottom)); z-index: 7; padding: 0 16px 8px; pointer-events: none; }
.pb-in { max-width: 608px; margin: 0 auto; display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; border-radius: 16px; background: #1c1c1c; border: 1px solid color-mix(in srgb, var(--text) 30%, var(--line)); box-shadow: 0 8px 24px rgba(0,0,0,.6); pointer-events: auto; }
.pb-in > svg { width: 18px; height: 18px; flex: none; }
.pb-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.pb-txt b { font: 800 11px/1.1 var(--display); font-stretch: 112%; text-transform: uppercase; letter-spacing: .03em; }
.pb-txt span { font: italic 13px/1.2 var(--serif); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pb-in .btn { padding: 9px 12px; }
.part-tag { font: 800 9px/1 var(--display) !important; font-stretch: 125%; letter-spacing: .07em; text-transform: uppercase; color: var(--brand-yellow); font-style: normal !important; }
.transition-card { border-radius: var(--radius); background: var(--surface); border: 1.5px dashed color-mix(in srgb, var(--brand-yellow) 45%, var(--line)); padding-top: 4px; }
.transition-card .lede { padding: 10px 14px 6px; color: var(--muted); font: italic 15px/1.4 var(--serif); margin: 0; }

.player { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.play { width: 38px; height: 38px; border-radius: 50%; background: var(--c, var(--text)); color: #000; display: grid; place-items: center; flex: none; }
.play svg { width: 15px; height: 15px; }
.bar { flex: 1; height: 5px; border-radius: 3px; background: var(--surface-2); position: relative; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--c, var(--text)); }
.time { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 38px; text-align: right; }
.roll { display: block; width: 100%; height: 56px; margin-top: 6px; border-radius: 8px; background: #000; border: 1px solid var(--line); }
.roll .ph { stroke: var(--text); stroke-width: 1.5; opacity: 0; }
.roll.on .ph { opacity: .9; }

/* transport */
.transport { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: color-mix(in srgb, #000 92%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--line); padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); }
.transport-in { max-width: 640px; margin: 0 auto; padding: 0 16px; display: flex; gap: 8px; align-items: stretch; }
.tp-play { flex: 1; min-width: 0; padding: 0 10px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; background: var(--primary); color: var(--primary-ink); font: 800 12px/1 var(--display); font-stretch: 125%; text-transform: uppercase; letter-spacing: .02em; min-height: 50px; }
.tp-play svg { width: 16px; height: 16px; flex: none; }
.tp-play span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tp-play.on { background: var(--brand-yellow); }
.mixgroup { flex: none; display: flex; gap: 2px; padding: 3px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.mix { width: 33px; border-radius: 12px; display: grid; place-items: center; color: var(--faint); }
.mix svg { width: 18px; height: 18px; }
.mix.on { color: #000; background: var(--text); }
.tempo { display: flex; align-items: center; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); flex: none; }
.tempo button { width: 22px; height: 50px; font-size: 18px; color: var(--muted); }
.tempo .v { min-width: 34px; text-align: center; line-height: 1; cursor: pointer; }
.tempo .v b { display: block; font: 800 16px/1 var(--display); font-variant-numeric: tabular-nums; }
.tempo .v span { font: 700 8px/1 var(--display); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.tempo .v.unset b { color: var(--faint); }

/* sheet */

// Chords: "Fm | Db | Bb Ddim | C7" — bars split by |, chords in a bar by spaces, % repeats a bar.
// Without |, commas (or spaces) separate bars, which matches how the Notion track list writes them.
const PC = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
const QUAL = [
  [/^(maj7|M7|Δ7?|ma7)$/, [0, 4, 7, 11]], [/^(m7b5|ø7?|min7b5|-7b5)$/, [0, 3, 6, 10]], [/^(dim7|°7|o7)$/, [0, 3, 6, 9]], [/^(dim|°|o)$/, [0, 3, 6]],
  [/^(m\(?maj7\)?|mM7|-maj7)$/, [0, 3, 7, 11]], [/^(m7|min7|-7)$/, [0, 3, 7, 10]], [/^(m9|min9|-9)$/, [0, 3, 7, 10, 14]], [/^(maj9|M9)$/, [0, 4, 7, 11, 14]],
  [/^(m6|min6|-6)$/, [0, 3, 7, 9]], [/^(madd9)$/, [0, 3, 7, 14]], [/^(m|min|-)$/, [0, 3, 7]], [/^(7sus4?)$/, [0, 5, 7, 10]], [/^(sus2)$/, [0, 2, 7]],
  [/^(sus4?)$/, [0, 5, 7]], [/^(aug|\+)$/, [0, 4, 8]], [/^(add9)$/, [0, 4, 7, 14]], [/^9$/, [0, 4, 7, 10, 14]], [/^7$/, [0, 4, 7, 10]], [/^6$/, [0, 4, 7, 9]],
  [/^5$/, [0, 7]], [/^(maj|M|)$/, [0, 4, 7]],
];
const pcOf = (l, acc) => (PC[l] + (acc === '#' ? 1 : acc === 'b' ? -1 : 0) + 12) % 12;
function parseChord(sym) {
  const t = String(sym).trim().replace(/♭/g, 'b').replace(/♯/g, '#')
    .replace(/\s*half[- ]?diminished(\s*7(th)?)?/i, 'm7b5').replace(/\s*diminished\s*7(th)?/i, 'dim7').replace(/\s*diminished/i, 'dim')
    .replace(/\s*minor\s*7(th)?/i, 'm7').replace(/\s*major\s*7(th)?/i, 'maj7').replace(/\s*dominant\s*7(th)?/i, '7')
    .replace(/\s*minor/i, 'm').replace(/\s*major/i, '').replace(/(\d)th$/, '$1').replace(/\s+/g, '');
  if (/^(n\.?c\.?|-|x)$/i.test(t)) return { notes: [], bass: null };
  const m = t.match(/^([A-G])([#b]?)([^/]*)(?:\/([A-G])([#b]?))?$/);
  if (!m) return null;
  const q = QUAL.find(([re]) => re.test(m[3]));
  if (!q) return null;
  const root = pcOf(m[1], m[2]);
  const label = t;
  return { notes: q[1].map(i => 48 + root + i).map(n => n > 72 ? n - 12 : n), bass: 36 + (m[4] ? pcOf(m[4], m[5]) : root), sym: label };
}
function parseProg(text) {
  const t = (text || '').trim();
  if (!t) return [];
  const raw = t.includes('|') ? t.split('|').map(b => b.trim().split(/[\s,]+/).filter(Boolean))
    : (t.includes(',') ? t.split(',') : t.split(/\s+/)).map(x => x.trim()).filter(Boolean).map(x => [x]);
  const bars = [];
  for (const b of raw) {
    if (!b.length) continue;
    if (b.length === 1 && (b[0] === '%' || b[0] === './.')) bars.push(bars.length ? bars[bars.length - 1].slice() : ['N.C.']);
    else bars.push(b);
  }
  return bars;
}
const progOf = sec => sec.chords ? { text: sec.chords, own: true } : S.track.chords ? { text: S.track.chords, own: false } : null;
function chordVoice(sec, text) {
  const bars = parseProg(text != null ? text : (progOf(sec) || {}).text);
  if (!bars.length) return null;
  const barP = secBarPulses(sec), slots = [];
  bars.forEach((b, bi) => b.forEach((c, ci) => {
    const ch = parseChord(c);
    slots.push({ start: bi * barP + ci * barP / b.length, dur: barP / b.length, notes: ch ? ch.notes : [], bass: ch ? ch.bass : null });
  }));
  return { layer: 'chords', slots, cycle: bars.length * barP, sub: 1 };
}
function chartHtml(bars) {
  let k = 0;
  return `<div class="chart" data-chart>${bars.map(b => `<div class="cbar">${b.map(c => {
    const ch = parseChord(c);
    return `<span class="ch${ch ? '' : ' unk'}" data-k="${k++}" title="${ch ? esc(c) : 'not recognised, won’t play'}">${esc(ch && ch.sym ? ch.sym : c)}</span>`;
  }).join('')}</div>`).join('')}</div>`;
}
const SHARP = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const FLAT = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];
const SOLFEGE = { do: 'C', re: 'D', mi: 'E', fa: 'F', sol: 'G', la: 'A', si: 'B' };
function keyChords(sec) {
  const scale = (sec.maqam || S.track.maqam || '').toLowerCase();
  const mode = /minor|\bmin\b|aeolian/.test(scale) ? 'minor' : /major|\bmaj\b|ionian/.test(scale) ? 'major' : null;
  if (!mode) return null;
  let t = (sec.tonic || S.track.tonic || '').trim() || ((sec.maqam || S.track.maqam || '').match(/^([A-Ga-g][#b♭♯]?)\s/) || [])[1] || '';
  const sol = t.toLowerCase().match(/^(do|re|mi|fa|sol|la|si)/); if (sol) t = SOLFEGE[sol[1]] + t.slice(sol[1].length);
  const m = t.replace(/♭/g, 'b').replace(/♯/g, '#').match(/^([A-Ga-g])([#b]?)/);
  if (!m) return null;
  const root = pcOf(m[1].toUpperCase(), m[2]);
  const flat = m[2] === 'b' || (mode === 'major' ? [5].includes(root) : [2, 7, 0, 5].includes(root));
  const names = flat ? FLAT : SHARP;
  const deg = mode === 'major' ? [[0, ''], [2, 'm'], [4, 'm'], [5, ''], [7, ''], [9, 'm'], [11, 'dim'], [7, '7']]
    : [[0, 'm'], [2, 'dim'], [3, ''], [5, 'm'], [7, 'm'], [8, ''], [10, ''], [7, '7']];
  return { label: `${names[root]} ${mode}`, chords: deg.map(([o, q]) => names[(root + o) % 12] + q) };
}

const movesOf = sec => { try { return JSON.parse(sec.moves || '{}') || {}; } catch { return {}; } };
function energyBars(e, cls) {
  return `<span class="energy ${cls || ''}" title="${ENERGY[e] || 'energy not set'}">${[1, 2, 3, 4, 5].map(i => `<i class="${e && i <= e ? 'on' : ''}" style="height:${3 + i * 2.2}px"></i>`).join('')}</span>`;
}
const subOf = b => b.sub || 2;
const barOf = b => b.bar || b.pattern.length;
const barPulses = b => barOf(b) / subOf(b);
const subSym = v => (SUBS.find(x => x.v === v) || SUBS[1]).sym;
function beatMeta(b) {
  const bars = b.pattern.length / barOf(b);
  return `${bars > 1 ? bars + ' bars · ' : ''}${barOf(b)} × ${subSym(subOf(b))}`;
}

async function api(path, opts) {
  opts = opts || {};
  const headers = { 'X-Band-Key': S.key, 'X-Member': S.me };
  let body = opts.body;
  if (body && !(body instanceof Blob)) { headers['Content-Type'] = 'application/json'; body = JSON.stringify(body); }
  if (body instanceof Blob) headers['Content-Type'] = body.type || 'application/octet-stream';
  const res = await fetch(API + '/api' + path, { method: opts.method || 'GET', headers, body });
  if (res.status === 401) { S.key = ''; store.set('key', ''); route(); throw new Error('Wrong passcode'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

async function loadState() {
  const d = await api('/state');
  S.members = d.members;
  S.tracks = d.tracks;
  S.grooves = d.grooves || [];
}

/* ---------- routing ---------- */
function route() {
  stopEverything();
  const h = location.hash.replace(/^#\/?/, '');
  if (!S.key) return viewGate();
  if (h === 'band') return viewBand();
  if (!S.me || (S.members.length && !S.members.some(m => m.id === S.me))) return viewWho();
  if (h.startsWith('t/')) return viewTrack(h.slice(2));
  return viewHome();
}
window.addEventListener('hashchange', route);
const go = h => { location.hash = h; };

function topBar(title, left, right) {
  return `<div class="top"><div class="top-in">${left || ''}<h1>${title}</h1>${right || ''}</div></div>`;
}
const backBtn = to => `<button class="icon-btn" aria-label="Back" onclick="go('${to}')">${ICON.back}</button>`;

/* ---------- gate & identity ---------- */
function viewGate() {
  $('#app').innerHTML = `<div class="wrap"><div class="gate">
    <img class="logo-big" src="logo.png" alt="‘ala bab allah">
    <h2>Shajara</h2><div class="ar ar-sub">شجرة</div>
    <p class="muted">Where ‘ala bab allah grows tracks, layer by layer. Enter the band passcode.</p>
    <input id="pc" type="password" autocomplete="current-password" autocapitalize="off" placeholder="Band passcode">
    <button class="btn primary block" id="enter">Enter</button>
    <div class="handle">@ala.bab.allah</div>
  </div></div>`;

async function viewWho() {
  if (!S.members.length) { try { await loadState(); } catch (e) { return toast(e.message); } }
  $('#app').innerHTML = `<div class="wrap"><div class="gate">
    <h2>Who's this?</h2>
    <p class="muted">So the band knows who posted what. You can change it later under Band.</p>

    <button class="btn block" onclick="go('band')">Someone else? Add to the band</button>
  </div></div>`;
  $('#app').querySelectorAll('.person').forEach(b => b.onclick = () => { S.me = b.dataset.id; store.set('me', S.me); route(); });
}

/* ---------- home ---------- */
function viewHome() {
  const render = () => {
    const me = S.members.find(m => m.id === S.me);
    const list = S.tracks.map(t => {
      const unseen = (S.seen[t.id] || 0) < t.updated_at;
      const meta = [t.genre, t.maqam && (t.maqam + (t.tonic ? ' on ' + t.tonic : '')), t.tempo && t.tempo + ' bpm', t.ideas && t.ideas + ' idea' + (t.ideas > 1 ? 's' : '')].filter(Boolean).map(esc).join(' · ');
      const form = t.sections.length > 1 || t.sections.some(s => s.energy) ? `<div class="form-line">${t.sections.map(s => `<span class="fl-sec">${esc(s.name)}${s.energy ? energyBars(s.energy) : ''}</span>`).join('<span class="arr">→</span>')}</div>` : '';
      const mini = LAYERS.map(l => {
        const names = [...new Set(t.holders.filter(h => h.layer === l.key).map(h => memberName(h.member_id)))];
        const beats = [...new Set(t.beats.filter(b => b.layer === l.key).map(b => b.name || 'beat'))];
        return `<div class="mini-layer" style="--c:${l.c}"><span class="ln">${l.short}</span><span class="who">${names.length ? names.map(esc).join(', ') : '<span class="open">open</span>'}</span><span class="bt">${beats.length ? '◆ ' + beats.map(esc).join(' / ') : ''}</span></div>`;
      }).join('');
      return `<div class="track-row" role="link" tabindex="0" onclick="go('t/${esc(t.id)}')">
        <div class="tr-top"><div class="t">${esc(t.title)}</div>${unseen ? '<i class="dot">✦</i>' : ''}<button class="kebab" aria-label="Track options" onclick="event.stopPropagation(); trackMenu('${esc(t.id)}')">⋯</button></div>
        <div class="meta">${meta ? meta + ' · ' : ''}${ago(t.updated_at)}</div>
        ${form}<div class="mini-tree">${mini}</div></div>`;
    }).join('');
    $('#app').innerHTML = topBar('Shajara', `<img class="logo" src="logo.png" alt="‘ala bab allah">`,
      `<button class="icon-btn" aria-label="Band" onclick="go('band')">${ICON.people}</button>`) +
      `<div class="wrap">
        <div class="hello"><div><h2>Ahlan${me ? ', ' + esc(me.name) : ''}</h2><div class="muted serif" style="font-style:italic">${S.tracks.length} track${S.tracks.length === 1 ? '' : 's'} growing</div></div><span class="ar">شجرة</span></div>
        ${legend()}
        <div class="list-head"><b>Tracks</b><span class="ar">التراكات</span></div>
        ${list || `<div class="empty">No tracks yet.<br>Plant the first one.</div>`}
      </div>
      <button class="btn primary fab" onclick="newTrack()">+ New track</button>`;
  };
  render();
  loadState().then(render).catch(e => toast(e.message));
  poll(() => loadState().then(() => { if (location.hash.replace(/^#\/?/, '') === '') render(); }));
}

function legend() {
  return `<div class="legend"><h4>How a track grows <span class="ar">الشجرة</span></h4>
    <p style="margin:0 0 10px">A track is a run of sections (Intro, A, B…) with transitions between them. Each section is a tree, from the top down:</p>
    ${LAYERS.map(l => `<div class="l" style="--c:${l.c}"><b>${l.name}</b><span class="muted">${l.role}</span></div>`).join('')}
    <p>Anyone can hold any layer, on any instrument. One pulse runs through the whole track; each layer brings its own part on top of it, whether that’s a groove, a bass line, chords or a melody.</p></div>`;
}

/* ---------- track ---------- */
async function viewTrack(id) {
  if (S.pickedTrack !== id) { S.picked = new Set(); S.pickedTrack = id; }
  const cached = S.track && S.track.id === id ? S.track : null;
  if (cached) renderTrack();
  else $('#app').innerHTML = topBar('', backBtn('')) + '<div class="wrap"><p class="muted">Loading…</p></div>';
  try {
    if (!S.members.length) await loadState();
    S.track = await api('/tracks/' + id);
    renderTrack();
  } catch (e) { toast(e.message); if (!cached) go(''); return; }
  poll(async () => {
    if (location.hash.replace(/^#\/?/, '') !== 't/' + id || Player.on || playing.size || $('.scrim')) return;
    const t = await api('/tracks/' + id);
    if (t.updated_at !== S.track.updated_at || t.ideas.length !== S.track.ideas.length) { S.track = t; renderTrack(); }
  });
}

function selectView(sid, transition) {
  stopEverything();
  S.view[S.track.id] = { sid, transition: !!transition };
  renderTrack();
  const el = $('.form .sel'); if (el) el.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
}

function cellsHtml(b, layerKey, mp) {
  const bar = barOf(b), sub = subOf(b), w = 100 / (sub * mp);
  const row = bar * Math.max(1, Math.floor(mp / barPulses(b) + 1e-9));
  const rows = [];
  for (let i = 0; i < b.pattern.length; i += row) {
    rows.push(`<div class="cells">${b.pattern.slice(i, i + row).split('').map((c, j) => `<i class="${c === '-' ? 'R' : c}${j && j % bar === 0 ? ' bs' : ''}" style="width:${w}%"><b></b></i>`).join('')}</div>`);
  }
  return `<div class="lanes" data-cells="${layerKey}">${rows.join('')}</div>`;
}

function composeHtml(lane) {
  return `<div class="compose">
    <button class="rec" onclick="openRecorder('${lane}')">${ICON.mic}Record</button>
    ${HAS_MIDI ? `<button onclick="openMidi('${lane}')">${ICON.keys}MIDI</button>` : ''}
    ${lane !== 'transition' ? `<button onclick="editBeat('${lane}')">${ICON.rhythm}Rhythm</button>` : ''}
    <button onclick="openNote('${lane}')">${ICON.note}Note</button>
    <button onclick="openLink('${lane}')">${ICON.link}Link</button>
  </div>`;
}

function ideasHtml(sid, lane, prevSeen) {
  const ideas = ideasOf(sid, lane).sort((a, b) => b.starred - a.starred || b.created_at - a.created_at);
  if (!ideas.length) return '';
  const k = sid + lane, open = S.expanded[k];
  const shown = open ? ideas : ideas.slice(0, 3);
  return `<div class="ideas">${shown.map(i => ideaHtml(i, prevSeen)).join('')}
    ${ideas.length > 3 ? `<button class="more" onclick="S.expanded['${k}']=${!open};renderTrack()">${open ? 'Show fewer' : 'Show all ' + ideas.length + ' ideas'}</button>` : ''}</div>`;
}

function renderTrack() {
  const t = S.track;
  const prevSeen = S.seenBefore && S.seenBefore.id === t.id ? S.seenBefore.at : (S.seen[t.id] || 0);
  S.seenBefore = { id: t.id, at: prevSeen };
  S.seen[t.id] = Date.now(); store.set('seen', S.seen);
  const { sec, transition } = curView();

  const maqam = t.maqam ? t.maqam + (t.tonic ? ' on ' + t.tonic : '') : '';
  const chips = `<button class="chip${maqam ? '' : ' ghost'}" onclick="editTrack()">${maqam ? `<span class="k">Maqam</span>${esc(maqam)}` : '+ maqam'}</button>` +
    `<button class="chip${t.tempo ? '' : ' ghost'}" onclick="editTrack()">${t.tempo ? `<span class="k">Pulse</span>${t.tempo} bpm` : '+ pulse'}</button>` +
    `<button class="chip${t.genre ? '' : ' ghost'}" onclick="editTrack()">${t.genre ? `<span class="k">Genre</span>${esc(t.genre)}` : '+ genre'}</button>`;
  const trackNotes = t.notes ? `<button class="notes" onclick="editTrack('f-notes')">${esc(t.notes)}</button>` : '';

  const form = sections().map((s, i) => {
    const dots = LAYERS.map(l => `<i style="--c:${l.c}" class="${holdersOf(s.id, l.key).length || beatOf(s.id, l.key) || ideasOf(s.id, l.key).length ? 'on' : ''}"></i>`).join('');
    const pill = `<button class="sec-pill${s.id === sec.id && !transition ? ' sel' : ''}" onclick="selectView('${s.id}')"><span class="nm">${esc(s.name)}</span><span class="pill-foot"><span class="dots">${dots}</span>${energyBars(s.energy)}</span></button>`;
    if (i === sections().length - 1) return pill;
    const n = ideasOf(s.id, 'transition').length;
    return pill + `<button class="tr-pill${n ? ' has' : ''}${s.id === sec.id && transition ? ' sel' : ''}" aria-label="Transition" onclick="selectView('${s.id}', true)">→${n ? `<b>${n}</b>` : ''}</button>`;
  }).join('') + `<button class="add-pill" onclick="newSection()">+ section</button>`;

  let panel;
  if (transition) {
    const nx = nextSection(sec);
    panel = `<div class="sec-head"><h2>${esc(sec.name)} <span style="color:var(--brand-yellow)">→</span> ${esc(nx.name)}</h2><span class="sp"></span><span class="ar" style="font-size:22px;color:var(--muted)">انتقال</span></div>
      <div class="transition-card" style="--c:var(--brand-yellow)">
        <p class="lede">How we get from ${esc(sec.name)} into ${esc(nx.name)}: fills, cues, stops, who leads. Recording here plays ${esc(sec.name)} underneath.</p>
        ${ideasHtml(sec.id, 'transition', prevSeen)}
        ${composeHtml('transition')}
      </div>`;
  } else {
    const secBeats = t.beats.filter(b => b.section_id === sec.id);
    const mp = Math.max(2, secBarPulses(sec), ...secBeats.map(barPulses));
    const layers = LAYERS.map((l, li) => {
      const hs = holdersOf(sec.id, l.key);
      const beat = beatOf(sec.id, l.key);
      const pc = li ? LAYERS[li - 1].c : l.c;
      const beatHtml = beat
        ? `<button class="beat" onclick="editBeat('${l.key}')"><div class="beat-top"><span class="k">Rhythm</span><span class="nm">${esc(beat.name || 'Untitled')}</span><span class="ln">${beatMeta(beat)}</span></div>${cellsHtml(beat, l.key, mp)}</button>`
        : '';
      return `<section class="layer" style="--c:${l.c};--pc:${pc}" id="L-${l.key}">
        <div class="layer-head"><div class="layer-glyph">${STAR}<svg class="g" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${l.glyph}</svg></div>
          <div><div class="layer-name">${l.name}</div><div class="layer-role">${l.role}</div></div><span class="layer-ar ar">${l.ar}</span></div>
        <div class="holders">${hs.length ? hs.map(h => `<button class="holder" onclick="editLineup('${l.key}')">${esc(memberName(h.member_id))}${h.instrument ? ' · ' + esc(h.instrument) : ''}</button>`).join('')
          : `<button class="holder empty" onclick="editLineup('${l.key}')">empty · open for one of you, or production</button>`}</div>
        ${beatHtml}
        ${ideasHtml(sec.id, l.key, prevSeen)}
        ${composeHtml(l.key)}</section>`;
    }).join('');
    const mv = movesOf(sec);
    const own = (v, label) => `<button class="chip${v ? ' own' : ''}" onclick="editSection()"><span class="k">${label}</span>`;
    const facts = [
      own(true, 'Time') + meterLabel(sec) + '</button>',
      sec.maqam || sec.tonic ? own(true, 'Maqam') + esc(maqamOf(sec)) + '</button>' : '',
      sec.tempo ? own(true, 'Pulse') + sec.tempo + '</button>' : '',
      `<button class="chip${sec.energy ? '' : ' ghost'}" onclick="editSection()">${sec.energy ? `<span class="k">Energy</span>${energyBars(sec.energy, 'lg')} ${ENERGY[sec.energy]}` : '+ energy'}</button>`,
    ].join('');
    const movesHtml = MOVES.filter(m => mv[m.k] != null).map(m => `<button class="move" onclick="editSection()"><b>${m.label}</b>${mv[m.k] ? ' · ' + esc(mv[m.k]) : ''}</button>`)
      .concat(Object.keys(mv).filter(k => k.startsWith('x:')).map(k => `<button class="move" onclick="editSection()"><b>${esc(k.slice(2))}</b>${mv[k] ? ' · ' + esc(mv[k]) : ''}</button>`)).join('');
    panel = `<div class="sec-head"><h2>${esc(sec.name)}</h2><span class="sp"></span><button class="icon-btn sm" aria-label="Edit section" onclick="editSection()">${ICON.edit}</button><button class="icon-btn sm" aria-label="Section options" onclick="sectionMenu()">${ICON.more}</button></div>
      <div class="chips sec-facts">${facts}</div>
      <div class="moves">${movesHtml || `<button class="move ghost" onclick="editSection()">+ moves · role swap, unison, silence…</button>`}</div>
      ${progBlock(sec)}
      ${sec.notes ? `<button class="notes" style="margin:0 0 14px" onclick="editSection('s-notes')">${esc(sec.notes)}</button>` : ''}
      ${lineupStrip(sec)}
      <div class="tree">${layers}</div>`;
  }

  $('#app').innerHTML = topBar(esc(t.title), backBtn(''),
    `<button class="icon-btn" aria-label="Share" onclick="shareTrack()">${ICON.share}</button><button class="icon-btn" aria-label="Track options" onclick="trackMenu()">${ICON.more}</button>`) +
    `<div class="wrap${S.picked.size ? ' with-picks' : ''}">
      <div class="hero"><div class="chips">${chips}${t.notes ? '' : `<button class="chip ghost" onclick="editTrack('f-notes')">+ track note</button>`}</div>${trackNotes}</div>
      <div class="form">${form}</div>
      ${panel}
      <p class="small faint">Started ${ago(t.created_at)}${t.created_by ? ' by ' + esc(memberName(t.created_by)) : ''}. ✦ makes an idea the layer’s part: a recording, MIDI, rhythm, note, anything. Play uses each layer’s part (or its latest take) and rhythm.</p>
    </div>
    ${pickBar()}
    <div class="transport"><div class="transport-in">
      <button class="tp-play" id="tpPlay" onclick="togglePlayer()"></button>
      <div class="mixgroup">
        <button class="mix${S.mix.beats ? ' on' : ''}" data-mix="beats" aria-label="Rhythms in playback" title="Rhythms" onclick="toggleMix('beats')">${ICON.rhythm}</button>
        <button class="mix${S.mix.recs ? ' on' : ''}" data-mix="recs" aria-label="Parts in playback" title="Parts" onclick="toggleMix('recs')">${ICON.wave}</button>
        <button class="mix${S.mix.chords !== false ? ' on' : ''}" data-mix="chords" aria-label="Chords in playback" title="Chords" onclick="toggleMix('chords')">${ICON.chords}</button>
        <button class="mix${S.mix.click ? ' on' : ''}" data-mix="click" aria-label="Click in playback" title="Click" onclick="toggleMix('click')">${ICON.metro}</button>
      </div>
      <div class="tempo"><button aria-label="Slower" onclick="nudgeTempo(-2)">−</button><div class="v${curView().sec.tempo || t.tempo ? '' : ' unset'}" onclick="${curView().sec.tempo ? 'editSection()' : 'editTrack()'}"><b id="bpm">${curPulse()}</b><span>${curView().sec.tempo ? 'section' : 'pulse'}</span></div><button aria-label="Faster" onclick="nudgeTempo(2)">+</button></div>
    </div></div>`;
  updateTransport();
}

function updateTransport() {
  const b = $('#tpPlay');
  if (!b || !S.track) return;
  b.classList.toggle('on', Player.on);
  const n = S.picked.size;
  const what = n ? `${n} stacked take${n > 1 ? 's' : ''}` : curView().sec.name;
  b.innerHTML = Player.on ? ICON.stop + '<span>Stop</span>' : ICON.play + `<span>${n ? 'Stack' : 'Play'}</span>`;
  b.setAttribute('aria-label', Player.on ? 'Stop' : 'Play ' + what);
}
function toggleMix(k) {
  S.mix[k] = k === 'chords' ? S.mix.chords === false : !S.mix[k]; store.set('mix', S.mix);
  toast(`${{ beats: 'Rhythms', recs: 'Parts', click: 'Click', chords: 'Chords' }[k]} ${S.mix[k] ? 'on' : 'off'} in playback`);
  document.querySelectorAll(`[data-mix="${k}"]`).forEach(b => b.classList.toggle('on', S.mix[k]));
  if (Player.on) togglePlayer().then(togglePlayer);
}
function pickedIdeas() { return S.track ? S.track.ideas.filter(i => S.picked.has(i.id)) : []; }
function togglePick(id) {
  if (S.picked.has(id)) S.picked.delete(id); else S.picked.add(id);
  const i = S.track.ideas.find(x => x.id === id);
  if (i && i.kind === 'audio' && S.picked.has(id)) audioBuffer(i).catch(() => {});
  if (Player.on) Player.stop();
  renderTrack();
}
function clearPicks() { S.picked.clear(); if (Player.on) Player.stop(); renderTrack(); }
function pickBar() {
  const list = pickedIdeas();
  if (!list.length) return '';
  const who = list.map(i => `${esc(memberName(i.author_id))} · ${esc(laneOf(i.layer).short)}${sections().length > 1 ? ' · ' + esc((secOfIdea(i) || {}).name || '') : ''}`).join(', ');
  return `<div class="pickbar"><div class="pb-in">${ICON.stack}<span class="pb-txt"><b>${list.length} take${list.length > 1 ? 's' : ''} stacked</b><span>${who}</span></span><button class="btn" onclick="clearPicks()">Clear</button></div></div>`;
}
async function togglePlayer() {
  if (Player.on) { Player.stop(); return; }
  const picked = pickedIdeas();
  const r = await Player.start({ sec: curView().sec, beats: S.mix.beats, recs: S.mix.recs, click: S.mix.click, chords: S.mix.chords !== false, ideas: picked.length ? picked : null, onStop: updateTransport });
  if (!r) toast(S.mix.click ? 'Nothing to play' : 'Nothing to play yet. Record a part or a rhythm, or switch on the click.');
  updateTransport();
}

let tempoSave = null;
function nudgeTempo(d) {
  const { sec } = curView(), own = sec.tempo ? sec : S.track;
  own.tempo = Math.max(30, Math.min(300, curPulse() + d));
  $('#bpm').textContent = own.tempo;
  $('#bpm').parentElement.classList.remove('unset');
  Beat.setBpm(own.tempo);
  clearTimeout(tempoSave);
  const path = own === sec ? '/sections/' + sec.id : '/tracks/' + S.track.id;
  tempoSave = setTimeout(() => api(path, { method: 'PATCH', body: { tempo: own.tempo } }).then(x => { S.track.updated_at = x.updated_at; }).catch(e => toast(e.message)), 900);
}

function ideaHtml(i, prevSeen) {
  const isNew = i.created_at > prevSeen && i.author_id !== S.me;
  let body = '';
  if (i.kind === 'audio') body = `<div class="player" data-audio="${esc(i.id)}"><button class="play" aria-label="Play" onclick="togglePlay('${esc(i.id)}')">${ICON.play}</button><div class="bar"><i></i></div><span class="time">${fmtTime(i.duration)}</span></div>${i.body ? `<div class="idea-body">${esc(i.body)}</div>` : ''}`;
  else if (i.kind === 'midi') {
    const take = parseTake(i);
    body = `<div class="player" data-take="${esc(i.id)}"><button class="play" aria-label="Play" onclick="toggleTake('${esc(i.id)}')">${ICON.play}</button><span class="small muted">${take.notes.length} notes · ${fmtTime(take.len * 60 / pulseOf(secOfIdea(i)))} · MIDI</span></div>${rollSvg(take, i.id)}${i.body ? `<div class="idea-body">${esc(i.body)}</div>` : ''}`;
  }
  else if (i.kind === 'link') body = `<div class="idea-body"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(prettyUrl(i.url))}</a>${i.body ? '\n' + esc(i.body) : ''}</div>`;
  else body = `<div class="idea-body">${esc(i.body)}</div>`;
  return `<div class="idea"><div class="idea-top"><span class="by">${esc(memberName(i.author_id))}</span><span>${ago(i.created_at)}</span>${isNew ? '<span class="new-tag">new</span>' : ''}<span class="sp"></span>
    ${i.starred && i.layer !== 'transition' ? '<span class="part-tag">the part</span>' : ''}
    ${i.kind === 'audio' || i.kind === 'midi' ? `<button class="pick${S.picked.has(i.id) ? ' on' : ''}" aria-label="Play together with other picked takes" onclick="togglePick('${esc(i.id)}')">${ICON.stack}<span>${S.picked.has(i.id) ? 'in stack' : 'stack'}</span></button>` : ''}
    <button class="star${i.starred ? ' on' : ''}" aria-label="Make this the part" onclick="toggleStar('${esc(i.id)}')">${i.starred ? '✦' : '✧'}</button>
    <button class="kebab" aria-label="More" onclick="ideaMenu('${esc(i.id)}')">⋯</button></div>${body}</div>`;
}
function prettyUrl(u) { try { const x = new URL(u); return x.hostname.replace(/^www\./, '') + (x.pathname.length > 1 ? x.pathname.slice(0, 28) + (x.pathname.length > 28 ? '…' : '') : ''); } catch { return u; } }

async function toggleStar(id) {
  const i = S.track.ideas.find(x => x.id === id);
  i.starred = i.starred ? 0 : 1; renderTrack();
  try { await api('/ideas/' + id, { method: 'PATCH', body: { starred: !!i.starred } }); } catch (e) { toast(e.message); }
}

function ideaMenu(id) {
  const i = S.track.ideas.find(x => x.id === id);
  const lanes = [...LAYERS, ...(nextSection(sections().find(s => s.id === i.section_id)) ? [TRANSITION] : [])].filter(l => l.key !== i.layer);
  sheet(`<h3>This idea</h3><p class="lede">${esc(laneOf(i.layer).name)} · by ${esc(memberName(i.author_id))} · ${ago(i.created_at)}</p>
    <label class="field">Move to</label>
    <div class="sugs">${lanes.map(l => `<button class="sug" style="color:${l.c}" data-move="${l.key}">${l.name}</button>`).join('')}</div>
    <label class="field">${i.kind === 'text' ? 'Note' : 'Caption'}</label><textarea id="cap" rows="2">${esc(i.body)}</textarea>
    <div class="actions"><button class="btn danger" id="del">Delete</button><button class="btn primary" id="save">Save</button></div>`, root => {
    root.querySelectorAll('[data-move]').forEach(b => b.onclick = async () => {
      closeSheet();
      try { await api('/ideas/' + id, { method: 'PATCH', body: { layer: b.dataset.move } }); i.layer = b.dataset.move; renderTrack(); } catch (e) { toast(e.message); }
    });
    $('#save', root).onclick = async () => {
      const body = $('#cap', root).value;
      if (i.kind === 'text' && !body.trim()) return toast('A note can’t be empty');
      closeSheet();
      try { await api('/ideas/' + id, { method: 'PATCH', body: { body } }); i.body = body.trim(); renderTrack(); } catch (e) { toast(e.message); }
    };
    $('#del', root).onclick = () => confirmSheet('Delete this idea?', `${esc(laneOf(i.layer).name)} · by ${esc(memberName(i.author_id))}${i.kind === 'audio' ? ', and its recording' : ''}. It can’t be undone.`, 'Delete idea', async () => {
      await api('/ideas/' + id, { method: 'DELETE' }); S.track.ideas = S.track.ideas.filter(x => x.id !== id); renderTrack();
    });
  });
}

function menuSheet(title, items) {
  sheet(`<h3>${title}</h3><div class="menu">${items.map((it, i) => `<button class="menu-item${it.danger ? ' danger' : ''}" data-i="${i}">${it.icon || ''}<span><b>${esc(it.label)}</b>${it.hint ? `<span class="small muted">${esc(it.hint)}</span>` : ''}</span></button>`).join('')}</div>
    <div class="actions"><button class="btn block" onclick="closeSheet()">Cancel</button></div>`, root => {
    root.querySelectorAll('.menu-item').forEach(b => b.onclick = () => { closeSheet(); items[+b.dataset.i].run(); });
  });
}
function confirmSheet(title, detail, label, fn) {
  sheet(`<h3>${title}</h3><p class="lede">${detail}</p>
    <div class="actions"><button class="btn" onclick="closeSheet()">Keep it</button><button class="btn danger-solid" id="ok">${esc(label)}</button></div>`, root => {
    $('#ok', root).onclick = async () => { $('#ok', root).disabled = true; try { await fn(); closeSheet(); } catch (e) { toast(e.message); $('#ok', root).disabled = false; } };
  });
}
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

function trackMenu(id) {
  const t = id ? S.tracks.find(x => x.id === id) : S.track;
  if (!t) return;
  const onPage = !id || (S.track && S.track.id === id && location.hash.includes(id));
  menuSheet(esc(t.title), [
    ...(onPage ? [{ label: 'Edit track details', hint: 'title, maqam, pulse, genre, notes', icon: ICON.edit, run: () => editTrack() },
      { label: 'Add a section', icon: ICON.note, run: () => newSection() }] : [{ label: 'Open', icon: ICON.play, run: () => go('t/' + t.id) }]),
    { label: 'Delete track', hint: 'every section, idea and recording in it', icon: ICON.trash, danger: true, run: () => deleteTrack(t) },
  ]);
}
function deleteTrack(t) {
  const nSec = (t.sections || []).length;
  const nIdeas = Array.isArray(t.ideas) ? t.ideas.length : t.ideas || 0;
  confirmSheet(`Delete ${esc(t.title)}?`, `This removes ${plural(nSec, 'section')} and ${plural(nIdeas, 'idea')}, recordings included, for the whole band. It can’t be undone.`, 'Delete track', async () => {
    await api('/tracks/' + t.id, { method: 'DELETE' });
    S.tracks = S.tracks.filter(x => x.id !== t.id);
    if (S.track && S.track.id === t.id) S.track = null;
    if (location.hash.replace(/^#\/?/, '') === '') route(); else go('');
    toast('Track deleted');
  });
}
function sectionMenu() {
  const { sec } = curView();
  const idx = sections().indexOf(sec);
  menuSheet(`Section · ${esc(sec.name)}`, [
    { label: 'Edit section', hint: 'maqam, pulse, time, energy, moves', icon: ICON.edit, run: () => editSection() },
    { label: 'Line-up', hint: 'who is where', icon: ICON.people, run: () => editLineup() },
    { label: 'New section after this', icon: ICON.note, run: () => newSection() },
    ...(sections().length > 1 ? [{ label: 'Delete section', hint: 'its line-up, rhythms, ideas and recordings', icon: ICON.trash, danger: true, run: () => deleteSection(sec, idx) }] : []),
  ]);
}
function deleteSection(sec, idx) {
  const n = S.track.ideas.filter(i => i.section_id === sec.id).length;
  const nx = nextSection(sec);
  const tr = nx ? S.track.ideas.filter(i => i.section_id === sec.id && i.layer === 'transition').length : 0;
  confirmSheet(`Delete ${esc(sec.name)}?`, `This removes its line-up, rhythms and ${plural(n, 'idea')}${tr ? `, including ${plural(tr, 'transition idea')} into ${esc(nx.name)}` : ''}. It can’t be undone.`, 'Delete section', async () => {
    S.track = await api('/sections/' + sec.id, { method: 'DELETE' });
    selectView(sections()[Math.max(0, idx - 1)].id);
    toast('Section deleted');
  });
}

function confirmBtn(btn, label, fn) {
  let armed = false;
  const orig = btn.textContent;
  btn.onclick = () => {
    if (armed) return fn();
    armed = true; btn.textContent = label;
    setTimeout(() => { armed = false; btn.textContent = orig; }, 4000);
  };
}

/* ---------- sheets ---------- */
function sheet(html, init) {
  closeSheet();
  const s = document.createElement('div');
  s.className = 'scrim';
  s.innerHTML = `<div class="sheet"><div class="grab"></div>${html}</div>`;
  s.onclick = e => { if (e.target === s) closeSheet(); };
  document.body.appendChild(s);
  if (init) init(s);
  return s;
}
function closeSheet() {
  const s = $('.scrim');
  if (!s) return;
  if (s._onclose) s._onclose();
  s.remove();
}
const chipsHtml = (id, items, c) => `<div class="sugs" id="${id}"${c ? ` style="--c:${c}"` : ''}>${items}</div>`;

function trackForm(t) {
  t = t || {};
  return `<label class="field">Title</label><input id="f-title" type="text" value="${esc(t.title)}" placeholder="Working title is fine">
    <div class="row2"><div><label class="field">Maqam / scale</label><input id="f-maqam" type="text" list="maqamat" value="${esc(t.maqam)}" placeholder="e.g. Bayati"></div>
    <div><label class="field">On (tonic)</label><input id="f-tonic" type="text" value="${esc(t.tonic)}" placeholder="e.g. D"></div></div>
    <label class="field">Genre</label><div class="sugs" id="f-genre">${GENRES.map(g => `<button type="button" class="sug${t.genre === g ? ' on' : ''}">${esc(g)}</button>`).join('')}</div>

// Tap on the pulse: needs 3 taps, uses the median of the last 8 gaps so one stray tap can't throw it, resets after a 2 s pause.
function tapTempo(btn, input) {
  const label = btn.textContent;
  let taps = [];
  btn.onclick = e => e.preventDefault();
  btn.onpointerdown = e => {
    e.preventDefault();
    const n = e.timeStamp || performance.now(), last = taps[taps.length - 1];
    if (last && n - last < 120) return;
    if (!last && document.activeElement && document.activeElement !== btn) document.activeElement.blur();
    if (last && n - last > 2000) taps = [];
    taps.push(n); if (taps.length > 9) taps.shift();
    btn.classList.remove('flash'); void btn.offsetWidth; btn.classList.add('flash');
    clearTimeout(btn._reset);
    btn._reset = setTimeout(() => { taps = []; btn.textContent = label; }, 2000);
    if (taps.length < 3) { btn.textContent = taps.length === 1 ? 'Again…' : 'Keep going'; return; }
    const gaps = taps.slice(1).map((x, i) => x - taps[i]).sort((a, b) => a - b);
    const bpm = Math.round(60000 / gaps[Math.floor(gaps.length / 2)]);
    if (bpm >= 30 && bpm <= 300) input.value = bpm;
    btn.textContent = `Tap · ${taps.length}`;
  };
}

/* ---------- line-up ---------- */
// People are the fixed resource: each of you is in one layer per section, or out. Production can fill any number of layers.
function lineupOf(sid) {
  const hs = S.track.holders.filter(h => h.section_id === sid);
  const people = S.members.map(m => {
    const h = hs.find(x => x.member_id === m.id);
    return { id: m.id, name: m.name, layer: h ? h.layer : null, instrument: h ? h.instrument : '' };
  });
  const prod = hs.filter(h => h.member_id === PRODUCTION);
  return { people, prod };
}
function lineupStrip(sec) {
  const { people, prod } = lineupOf(sec.id);
  const inCount = people.filter(p => p.layer).length;
  const chips = LAYERS.flatMap(l => people.filter(p => p.layer === l.key).map(p => `<span class="lu" style="--c:${l.c}">${esc(p.name)}${p.instrument ? ' · ' + esc(p.instrument) : ''}</span>`))
    .concat(prod.map(h => `<span class="lu prod" style="--c:${LAYER[h.layer].c}">Production · ${esc(LAYER[h.layer].short)}${h.instrument ? ' · ' + esc(h.instrument) : ''}</span>`))
    .concat(people.filter(p => !p.layer).map(p => `<span class="lu out">${esc(p.name)} · out</span>`));
  return `<button class="lineup" onclick="editLineup()"><div class="lbl"><b>Line-up · ${inCount} of ${people.length} playing</b><span class="ar">مين فين؟</span></div>${chips.join('')}</button>`;
}

  let prodWhat = (prod[0] && prod[0].instrument) || '';
  const choice = (layer, cur) => [...LAYERS.map(l => `<button class="sug${cur === l.key ? ' on' : ''}" data-l="${l.key}" style="--c:${l.c}">${l.short}</button>`),

  sheet(`<h3>Line-up · ${esc(sec.name)}<span class="ar">مين فين؟</span></h3>

      <div class="sugs" id="prodL">${LAYERS.map(l => `<button class="sug${prodOn[l.key] ? ' on' : ''}" data-l="${l.key}" style="--c:${l.c}">${l.short}</button>`).join('')}</div>

    const sum = () => {

        box.querySelectorAll('.sug').forEach(b => b.onclick = () => { p.instrument = b.textContent; p.auto = false; $('input', r).value = p.instrument; drawInst(); });

        ...LAYERS.filter(l => prodOn[l.key]).map(l => ({ member_id: PRODUCTION, layer: l.key, instrument: prodWhat })),

      try { S.track = await api(`/sections/${sec.id}/lineup`, { method: 'PUT', body: { holders } }); closeSheet(); renderTrack(); } catch (e) { toast(e.message); }

  const { sec } = curView();

  const defSub = sec.meter_sub === 1 ? 2 : sec.meter_sub;
  const defBar = sec.meter_sub === 1 ? sec.meter_n * 2 : sec.meter_n;
  const B = { sub: cur ? subOf(cur) : defSub, bar: cur ? barOf(cur) : defBar, bars: [] };
  const src = cur ? cur.pattern : ('D' + '-'.repeat(defBar - 1));
  for (let i = 0; i < src.length; i += B.bar) B.bars.push(src.slice(i, i + B.bar).split(''));
  const others = S.track.beats.filter(b => b.section_id === sec.id && b.layer !== layerKey);
  let withOthers = others.length > 0;
  stopEverything();

  const lengths = [...new Set([...LENGTHS, B.bar])].sort((a, b) => a - b);
  const s = sheet(`<h3 style="color:${l.c}">${l.name} · rhythm</h3>
