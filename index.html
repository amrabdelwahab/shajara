<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shajara</title>
<meta name="theme-color" content="#15120e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shajara">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --bg: #15120e;
  --surface: #201c17;
  --surface-2: #2a251f;
  --line: #3a332b;
  --text: #f3ebdf;
  --muted: #a99c8b;
  --faint: #6e6457;
  --accent: #e3a95c;
  --danger: #e36b5d;
  --bloom: #ea94aa;
  --bark: #c98d5e;
  --ground: #95b56f;
  --substrate: #8394d0;
  --transition: #d9b36c;
  --radius: 16px;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Arabic", sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 var(--sans); }
body { min-height: 100dvh; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); overscroll-behavior-y: contain; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
a { color: var(--accent); }
.wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 140px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 13px; }
.hidden { display: none !important; }

.top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.top-in { max-width: 640px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 10px; min-height: 58px; }
.top h1 { font: 600 20px/1.2 var(--serif); margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--surface); flex: none; }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn.sm { width: 34px; height: 34px; border-radius: 10px; }
.icon-btn.sm svg { width: 17px; height: 17px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 18px; border-radius: 12px; background: var(--surface-2); font-weight: 600; }
.btn svg { width: 18px; height: 18px; }
.btn.primary { background: var(--accent); color: #1b140b; }
.btn.danger { background: transparent; color: var(--danger); border: 1px solid color-mix(in srgb, var(--danger) 40%, transparent); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; }

input[type=text], input[type=password], input[type=number], input[type=url], textarea {
  width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; outline: none;
}
input:focus, textarea:focus { border-color: var(--accent); }
textarea { resize: vertical; min-height: 90px; }
label.field { display: block; margin: 16px 0 6px; font-size: 13px; color: var(--muted); }

/* gate */
.gate { min-height: 88dvh; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
.gate h2 { font: 600 36px/1.1 var(--serif); margin: 0; }
.gate p { margin: 0 0 8px; }
.people { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.person { background: var(--surface); border-radius: var(--radius); padding: 16px; text-align: left; min-height: 72px; }
.person b { display: block; font-size: 17px; }

/* home */
.hello { margin: 6px 0 18px; }
.hello h2 { font: 600 30px/1.15 var(--serif); margin: 0; }
.track-row { display: block; width: 100%; text-align: left; background: var(--surface); border-radius: var(--radius); padding: 14px 14px 12px; margin-bottom: 12px; position: relative; }
.track-row .t { font: 600 20px/1.25 var(--serif); padding-right: 18px; }
.track-row .meta { font-size: 13px; color: var(--muted); margin: 2px 0 8px; }
.track-row .form-line { font: 14px/1.3 var(--serif); color: color-mix(in srgb, var(--text) 80%, var(--muted)); margin-bottom: 10px; }
.track-row .form-line .ar { color: var(--transition); padding: 0 4px; }
.dot { position: absolute; top: 20px; right: 16px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 20%, transparent); }
.mini-tree { display: flex; flex-direction: column; gap: 4px; }
.mini-layer { display: grid; grid-template-columns: 76px 1fr auto; gap: 8px; align-items: center; border-radius: 8px; padding: 6px 9px; font-size: 13px; background: color-mix(in srgb, var(--c) 11%, transparent); }
.mini-layer .ln { font-weight: 700; font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: var(--c); }
.mini-layer .who { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini-layer .bt { font-size: 12px; color: color-mix(in srgb, var(--c) 75%, var(--text)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px; }
.mini-layer .open { color: var(--faint); }
.empty { text-align: center; padding: 48px 12px; color: var(--muted); }
.fab { position: fixed; right: max(16px, calc(50% - 304px)); bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 6; box-shadow: 0 10px 28px rgba(0,0,0,.5); border-radius: 999px; padding: 15px 22px; }

.legend { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-top: 22px; font-size: 14px; }
.legend h4 { margin: 0 0 8px; font: 600 16px/1.2 var(--serif); }
.legend .l { display: grid; grid-template-columns: 132px 1fr; padding: 3px 0; }
.legend b { color: var(--c); font: 600 15px/1.3 var(--serif); }
.legend p { margin: 10px 0 0; color: var(--muted); font-size: 13px; }

/* track */
.hero { padding: 2px 0 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--surface); border-radius: 999px; padding: 7px 13px; font-size: 14px; display: inline-flex; align-items: baseline; gap: 6px; }
.chip .k { color: var(--muted); font-size: 12px; }
.chip.ghost { color: var(--faint); border: 1px dashed var(--line); background: transparent; }
.notes { display: block; width: 100%; text-align: left; background: var(--surface); border-radius: 12px; padding: 12px 14px; margin-top: 12px; white-space: pre-wrap; font-size: 15px; color: color-mix(in srgb, var(--text) 85%, var(--muted)); }

.form { display: flex; align-items: center; gap: 6px; overflow-x: auto; padding: 4px 16px 12px; margin: 0 -16px 6px; scrollbar-width: none; }
.form::-webkit-scrollbar { display: none; }
.sec-pill { flex: none; padding: 9px 15px; border-radius: 12px; background: var(--surface); font: 600 16px/1.1 var(--serif); display: flex; flex-direction: column; align-items: flex-start; gap: 5px; border: 1.5px solid transparent; }
.sec-pill .dots { display: flex; gap: 3px; }
.sec-pill .dots i { width: 6px; height: 6px; border-radius: 2px; background: var(--c); opacity: .2; }
.sec-pill .dots i.on { opacity: 1; }
.sec-pill.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.tr-pill { flex: none; height: 34px; min-width: 34px; padding: 0 8px; border-radius: 999px; display: grid; place-items: center; color: var(--transition); border: 1.5px dashed color-mix(in srgb, var(--transition) 45%, transparent); font-size: 15px; position: relative; }
.tr-pill.has { border-style: solid; background: color-mix(in srgb, var(--transition) 12%, transparent); }
.tr-pill.sel { background: var(--transition); color: #1b140b; border-color: var(--transition); }
.tr-pill b { font-size: 11px; margin-left: 3px; }
.add-pill { flex: none; padding: 10px 14px; border-radius: 12px; border: 1.5px dashed var(--line); color: var(--muted); font-size: 14px; }

.sec-head { display: flex; align-items: center; gap: 10px; margin: 6px 0 10px; }
.sec-head h2 { font: 600 26px/1.1 var(--serif); margin: 0; }
.sec-head .meter { font: 600 14px/1 var(--sans); padding: 6px 9px; border-radius: 8px; background: var(--surface); color: var(--muted); }
.sec-head .sp { flex: 1; }

.tree { position: relative; }
.layer { position: relative; border-radius: var(--radius); margin-bottom: 14px; background: linear-gradient(160deg, color-mix(in srgb, var(--c) 9%, var(--surface)) 0%, var(--surface) 55%); }
.layer + .layer::before { content: ""; position: absolute; left: 30px; top: -14px; width: 4px; height: 14px; border-radius: 2px; background: linear-gradient(var(--pc), var(--c)); opacity: .7; }
.layer-head { padding: 14px 14px 8px; display: flex; gap: 12px; align-items: center; }
.layer-glyph { width: 36px; height: 36px; border-radius: 11px; background: color-mix(in srgb, var(--c) 22%, transparent); color: var(--c); display: grid; place-items: center; flex: none; }
.layer-glyph svg { width: 21px; height: 21px; }
.layer-name { font: 600 19px/1.15 var(--serif); }
.layer-role { font-size: 12px; color: var(--muted); }
.holders { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 10px 62px; }
.holder { font-size: 13px; padding: 5px 11px; border-radius: 999px; background: color-mix(in srgb, var(--c) 20%, transparent); color: color-mix(in srgb, var(--c) 65%, var(--text)); }
.holder.add { background: transparent; border: 1px dashed color-mix(in srgb, var(--c) 50%, transparent); }

.beat { display: block; width: calc(100% - 28px); margin: 0 14px 12px; text-align: left; background: color-mix(in srgb, var(--bg) 55%, transparent); border-radius: 12px; padding: 10px 12px; }
.beat-top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.beat-top .k { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--c); }
.beat-top .nm { font-weight: 600; font-size: 14px; }
.beat-top .ln { margin-left: auto; font-size: 12px; color: var(--faint); white-space: nowrap; }
.beat.ghost { border: 1px dashed color-mix(in srgb, var(--c) 35%, transparent); background: transparent; color: var(--muted); font-size: 14px; padding: 11px 12px; }
.beat.ghost b { color: var(--c); font-weight: 600; }
.lanes { display: flex; flex-direction: column; gap: 5px; }
.cells { display: flex; }
.cells i { display: block; flex: none; padding-right: 3px; }
.cells i b { display: block; height: 20px; border-radius: 5px; box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--c) 30%, transparent); transition: transform .06s; }
.cells i.D b { background: var(--c); box-shadow: none; }
.cells i.T b { background: color-mix(in srgb, var(--c) 48%, transparent); box-shadow: none; }
.cells i.K b { background: color-mix(in srgb, var(--c) 20%, transparent); box-shadow: none; height: 12px; margin-top: 4px; }
.cells i.bs b { margin-left: 4px; }
.cells i.now b { outline: 2px solid var(--text); outline-offset: 1px; transform: scale(1.08); }

.ideas { padding: 0 14px 2px; }
.idea { border-top: 1px solid color-mix(in srgb, var(--line) 80%, transparent); padding: 10px 0; }
.idea-top { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.idea-top .by { color: var(--text); font-weight: 600; font-size: 13px; }
.idea-top .sp { flex: 1; }
.new-tag { color: var(--accent); font-weight: 700; font-size: 10px; letter-spacing: .07em; text-transform: uppercase; }
.idea-body { margin-top: 4px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; }
.star { color: var(--faint); font-size: 18px; line-height: 1; padding: 4px; }
.star.on { color: var(--accent); }
.kebab { color: var(--faint); padding: 4px 6px; font-size: 18px; line-height: 1; }
.more { display: block; width: 100%; padding: 8px 0 10px; color: var(--muted); font-size: 13px; text-align: left; border-top: 1px solid var(--line); }
.compose { display: flex; gap: 6px; padding: 6px 14px 14px; }
.compose button { flex: 1; min-width: 0; padding: 8px 2px 7px; border-radius: 11px; background: color-mix(in srgb, var(--bg) 45%, var(--surface-2)); font-size: 11px; font-weight: 600; letter-spacing: .02em; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: color-mix(in srgb, var(--text) 85%, var(--muted)); }
.compose button svg { width: 18px; height: 18px; flex: none; }
.part-tag { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--c, var(--accent)); }
.lineup { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; text-align: left; margin: 0 0 14px; padding: 10px 12px; border-radius: 14px; background: var(--surface); }
.lineup .lbl { width: 100%; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
.lineup .lbl span { color: var(--accent); letter-spacing: 0; text-transform: none; font-weight: 600; font-size: 12px; }
.lu { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: color-mix(in srgb, var(--c) 22%, transparent); color: color-mix(in srgb, var(--c) 65%, var(--text)); white-space: nowrap; }
.lu.out { --c: var(--faint); color: var(--faint); background: transparent; border: 1px dashed var(--line); }
.lu.prod { border: 1px dashed color-mix(in srgb, var(--c) 60%, transparent); background: transparent; }
.lu-sum { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 12px 0 4px; }
.lu-sum div { border-radius: 10px; padding: 7px 10px; font-size: 12px; background: color-mix(in srgb, var(--c) 12%, transparent); min-height: 44px; }
.lu-sum b { display: block; color: var(--c); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; }
.lu-sum .empty-l { color: var(--faint); }
.lu-row { background: var(--surface); border-radius: 12px; padding: 12px 14px; margin-top: 8px; }
.lu-row .top-l { display: flex; align-items: center; gap: 10px; }
.lu-row .top-l b { font-size: 16px; min-width: 64px; }
.lu-row .top-l input { flex: 1; padding: 8px 10px; font-size: 14px; }
.lu-row .sugs { margin-top: 10px; }
.lu-row .sug.on { background: var(--c); }
.lu-row.prod { border: 1px dashed var(--line); background: transparent; }
.holder.empty { color: var(--faint); background: transparent; border: 1px dashed var(--line); }
.help { margin-top: 10px; background: var(--surface); border-radius: 12px; padding: 10px 14px; font-size: 13px; color: var(--muted); }
.help summary { cursor: pointer; color: var(--text); font-weight: 600; }
.help ol { margin: 8px 0 0; padding-left: 18px; }
.help li { margin: 4px 0; }
.compose .rec { color: #ffd9d3; background: color-mix(in srgb, var(--danger) 26%, var(--surface-2)); }
.transition-card { border-radius: var(--radius); background: linear-gradient(160deg, color-mix(in srgb, var(--transition) 10%, var(--surface)) 0%, var(--surface) 60%); border: 1px dashed color-mix(in srgb, var(--transition) 40%, transparent); padding-top: 4px; }
.transition-card .lede { padding: 10px 14px 6px; color: var(--muted); font-size: 14px; margin: 0; }

.player { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.play { width: 38px; height: 38px; border-radius: 50%; background: var(--c, var(--accent)); color: #17120c; display: grid; place-items: center; flex: none; }
.play svg { width: 16px; height: 16px; }
.bar { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-2); position: relative; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--c, var(--accent)); }
.time { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 38px; text-align: right; }
.roll { display: block; width: 100%; height: 56px; margin-top: 6px; border-radius: 8px; background: color-mix(in srgb, var(--bg) 55%, transparent); }
.roll .ph { stroke: var(--text); stroke-width: 1.5; opacity: 0; }
.roll.on .ph { opacity: .9; }

/* transport */
.transport { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--line); padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); }
.transport-in { max-width: 640px; margin: 0 auto; padding: 0 12px; display: flex; gap: 6px; align-items: stretch; }
.tp-play { flex: 1; min-width: 64px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 13px; background: var(--accent); color: #1b140b; font-weight: 700; font-size: 15px; min-height: 50px; }
.tp-play svg { width: 18px; height: 18px; flex: none; }
.tp-play span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tp-play { min-width: 0; padding: 0 10px; }
.tp-play.on { background: var(--text); }
.tp-play:disabled { opacity: .4; }
.mix { flex: none; width: 50px; border-radius: 13px; background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--faint); }
.mix svg { width: 17px; height: 17px; }
.mix span { font-size: 9px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.mix.on { color: var(--text); background: var(--surface-2); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--accent) 55%, transparent); }
.tempo { display: flex; align-items: center; border-radius: 13px; background: var(--surface); flex: none; }
.tempo button { width: 28px; height: 50px; font-size: 20px; color: var(--muted); }
.tempo .v { min-width: 40px; text-align: center; line-height: 1; cursor: pointer; }
.tempo .v b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
.tempo .v span { font-size: 9px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.tempo .v.unset b { color: var(--faint); }

/* sheet */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 20; display: flex; align-items: flex-end; justify-content: center; animation: fade .15s ease-out; }
.sheet { width: 100%; max-width: 640px; max-height: 92dvh; overflow: auto; background: var(--bg); border-radius: 22px 22px 0 0; padding: 10px 16px calc(20px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); animation: rise .2s ease-out; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(24px); opacity: .6; } }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
.sheet h3 { font: 600 23px/1.2 var(--serif); margin: 0 0 4px; }
.sheet .lede { color: var(--muted); font-size: 14px; margin: 0 0 4px; }
.sheet .actions { display: flex; gap: 10px; margin-top: 20px; }
.sheet .actions .btn { flex: 1; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tempo-row { display: flex; gap: 8px; }
.tempo-row input { flex: 1; }
.pick { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.pick-row { background: var(--surface); border-radius: 12px; padding: 12px 14px; border: 1.5px solid transparent; }
.pick-row.on { border-color: var(--c, var(--accent)); }
.pick-row .nm { display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
.pick-row input { margin-top: 10px; }
.check { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--line); display: grid; place-items: center; font-size: 14px; }
.pick-row.on .check { background: var(--c, var(--accent)); border-color: var(--c, var(--accent)); color: #17120c; }
.sugs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.sug { font-size: 13px; padding: 6px 11px; border-radius: 999px; background: var(--surface-2); }
.sug.on { background: var(--c, var(--accent)); color: #17120c; font-weight: 600; }
.sug-group { font-size: 11px; color: var(--faint); letter-spacing: .06em; text-transform: uppercase; margin: 10px 0 -2px; }
.meter-preview { font: 600 28px/1 var(--serif); margin-top: 10px; }

/* beat editor */
.grid { display: grid; gap: 6px; margin-top: 8px; }
.grid button { aspect-ratio: 1; border-radius: 10px; border: 2px solid color-mix(in srgb, var(--c) 35%, transparent); font-weight: 700; font-size: 15px; color: #17120c; }
.grid button.D { background: var(--c); border-color: var(--c); }
.grid button.T { background: color-mix(in srgb, var(--c) 48%, transparent); border-color: transparent; color: var(--text); }
.grid button.K { background: color-mix(in srgb, var(--c) 18%, transparent); border-color: transparent; color: var(--muted); }
.grid button.R { color: var(--faint); font-weight: 400; }
.grid button.now { outline: 2px solid var(--text); outline-offset: 2px; }
.grid-key { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 10px; flex-wrap: wrap; }
.grid-key i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; }
.bar-label { font-size: 11px; color: var(--faint); letter-spacing: .06em; text-transform: uppercase; margin: 12px 0 0; }
.pulse-hint { font-size: 12px; color: var(--faint); margin-top: 8px; }

/* recorders */
.rec-stage { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px 0 6px; }
.rec-big { width: 96px; height: 96px; border-radius: 50%; background: var(--danger); display: grid; place-items: center; transition: box-shadow .08s; }
.rec-big i { width: 34px; height: 34px; border-radius: 50%; background: #fff; transition: border-radius .2s, width .2s, height .2s; }
.rec-big.on i { width: 30px; height: 30px; border-radius: 6px; }
.rec-time { font: 600 30px/1 var(--sans); font-variant-numeric: tabular-nums; }
.count { font: 600 15px/1 var(--sans); color: var(--accent); min-height: 16px; letter-spacing: .04em; }
.toggle { display: flex; align-items: center; gap: 12px; background: var(--surface); padding: 11px 14px; border-radius: 12px; width: 100%; text-align: left; margin-top: 8px; }
.toggle .sw { width: 42px; height: 26px; border-radius: 13px; background: var(--line); position: relative; flex: none; transition: background .2s; }
.toggle .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left .2s; }
.toggle.on .sw { background: var(--accent); }
.toggle.on .sw::after { left: 19px; }
.midi-status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin-top: 6px; }
.midi-status i { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.midi-status.live i { background: var(--ground); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ground) 25%, transparent); }
.midi-status.hit i { background: var(--accent); }

.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; z-index: 40; font-size: 14px; max-width: 90vw; }
.member-row { background: var(--surface); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px; }
.member-row .nm { display: flex; justify-content: space-between; align-items: center; }
.member-row .nm b { font-size: 17px; }
.me-tag { font-size: 11px; color: var(--accent); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
</style>
</head>
<body>
<div id="app"></div>

<datalist id="maqamat">
  <option>Rast</option><option>Bayati</option><option>Hijaz</option><option>Saba</option><option>Nahawand</option>
  <option>Kurd</option><option>Ajam</option><option>Sikah</option><option>Huzam</option><option>Nawa Athar</option>
  <option>Hijazkar</option><option>Shahnaz</option><option>Suznak</option><option>Jiharkah</option><option>Husseini</option>
</datalist>

<script>
const API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
  ? 'http://localhost:8787'
  : 'https://shajara-api.amrabdelwahab.workers.dev';

const LAYERS = [
  { key: 'bloom', name: 'Flowers & Leaves', short: 'Flowers', role: 'melody & ornaments', c: 'var(--bloom)', k: 1.5,
    glyph: '<path d="M12 7.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Z"/><path d="M12 7.5C12 4 9.5 3 8 4s-1 4 1.5 5M12 7.5C12 4 14.5 3 16 4s1 4-1.5 5M9.5 11C6 11 5 13.5 6 15s4 1 5-1.5M14.5 11c3.5 0 4.5 2.5 3.5 4s-4 1-5-1.5M12 12.5V21"/>' },
  { key: 'bark', name: 'Tree Bark', short: 'Bark', role: 'harmony', c: 'var(--bark)', k: 1.2,
    glyph: '<path d="M8 21V9c0-2 1-4 4-6 3 2 4 4 4 6v12"/><path d="M10.5 8v3M13.5 11v4M10.5 15v3"/>' },
  { key: 'ground', name: 'Ground', short: 'Ground', role: 'bass & low line', c: 'var(--ground)', k: 0.8,
    glyph: '<path d="M3 14c3-2 6-2 9 0s6 2 9 0"/><path d="M3 19c3-2 6-2 9 0s6 2 9 0"/><path d="M12 11V4M12 6c-1.5-1.5-3.5-1.5-4.5-.5M12 7c1.5-1.5 3.5-1.5 4.5-.5"/>' },
  { key: 'substrate', name: 'Substrate', short: 'Substrate', role: 'rhythm & groove', c: 'var(--substrate)', k: 1,
    glyph: '<circle cx="6" cy="17" r="2.5"/><circle cx="13" cy="18.5" r="1.8"/><circle cx="18" cy="16" r="2.2"/><circle cx="9" cy="11" r="1.6"/><circle cx="15.5" cy="10.5" r="1.3"/><path d="M3 21h18"/>' },
];
const LAYER = Object.fromEntries(LAYERS.map(l => [l.key, l]));
const TRANSITION = { key: 'transition', name: 'Transition', short: 'Transition', c: 'var(--transition)', k: 1 };
const laneOf = key => LAYER[key] || TRANSITION;
const INSTRUMENTS = ['oud', 'piano', 'bass', 'drums', 'darbuka', 'riq', 'daf', 'bendir', 'guitar', 'violin', 'nay', 'qanun', 'voice', 'synth', 'percussion'];
const SECTION_NAMES = ['Intro', 'A', 'B', 'C', 'Chorus', 'Bridge', 'Taqsim', 'Solo', 'Break', 'Outro'];

// D = dum / kick, T = tak / snare, K = ka / hi-hat or light stroke. One string per bar.
const GROOVES = [
  { group: 'Arabic', items: [
    { name: 'Maqsum', sub: 2, p: 'DT-TD-T-' },
    { name: 'Baladi', sub: 2, p: 'DD-TD-T-' },
    { name: 'Saidi', sub: 2, p: 'DT-DD-T-' },
    { name: 'Malfuf', sub: 4, p: 'D--T--T-' },
    { name: 'Fallahi', sub: 4, p: 'DT-TD-T-' },
    { name: 'Masmoudi Kabir', sub: 1, p: 'DD-T-D-T' },
    { name: 'Karsilama 9/8', sub: 2, p: 'D-T-D-TTT' },
  ] },
  { group: 'Rock, blues & pop', items: [
    { name: 'Rock', sub: 2, p: 'DKTKDKTK' },
    { name: 'Rock ballad', sub: 2, p: 'DKTKDDTK' },
    { name: 'Half-time', sub: 2, p: 'DKKKTKKK' },
    { name: 'Shuffle 12/8', sub: 3, p: 'D-KT-KD-KT-K' },
    { name: 'Slow blues 12/8', sub: 3, p: 'DKKTKKDKKTKK' },
    { name: 'Funk 16ths', sub: 4, p: 'DKKKTKKDKKDKTKKK' },
    { name: 'One drop', sub: 2, p: '-K-KDK-K' },
    { name: '6/8 groove', sub: 2, p: 'DKKTKK' },
  ] },
];
const LENGTHS = [3, 4, 5, 6, 7, 8, 9, 10, 12, 16];
const SUBS = [
  { v: 1, label: 'Quarters', sym: '¼' },
  { v: 2, label: 'Eighths', sym: '⅛' },
  { v: 3, label: 'Triplets', sym: '⅛³' },
  { v: 4, label: 'Sixteenths', sym: '1⁄16' },
];
const METER_SUBS = [{ v: 1, d: 4 }, { v: 2, d: 8 }, { v: 4, d: 16 }];
const DEFAULT_BPM = 90;
const MAX_REC_SEC = 300;
const HAS_MIDI = !!navigator.requestMIDIAccess;

const ICON = {
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  share: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>',
  people: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c.5-3.5 3-5.5 6-5.5s5.5 2 6 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14.5c2.3.2 3.7 1.8 4 4.5"/></svg>',
  edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4Z"/><path d="M13.5 6.5l4 4"/></svg>',
  mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  note: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14M5 10h14M5 15h9"/></svg>',
  link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>',
  keys: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 5v8M12 5v8M16 5v8M8 13v6M12 13v6M16 13v6"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4.2" height="15" rx="1"/><rect x="13.8" y="4.5" width="4.2" height="15" rx="1"/></svg>',
  stop: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>',
  drum: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="7" rx="8" ry="3"/><path d="M4 7v8c0 1.7 3.6 3 8 3s8-1.3 8-3V7"/></svg>',
  wave: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"/></svg>',
  rhythm: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="8" width="4" height="8" rx="1.2" fill="currentColor"/><rect x="10" y="8" width="4" height="8" rx="1.2"/><rect x="17" y="8" width="4" height="8" rx="1.2" fill="currentColor" fill-opacity=".45"/></svg>',
  metro: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6l4 18H5L9 3Z"/><path d="M12 17l5-9"/><path d="M8 13h8"/></svg>',
};

const store = {
  get(k, d) { try { const v = localStorage.getItem('sj_' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('sj_' + k, JSON.stringify(v)); } catch {} },
};

const S = {
  key: store.get('key', ''),
  me: store.get('me', ''),
  seen: store.get('seen', {}),
  mix: store.get('mix', { beats: true, recs: true, click: false }),
  members: [],
  tracks: [],
  track: null,
  view: {},
  expanded: {},
};

const $ = (sel, root) => (root || document).querySelector(sel);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const PRODUCTION = 'production';
const memberName = id => id === PRODUCTION ? 'Production' : (S.members.find(m => m.id === id) || {}).name || 'Someone';
const fmtTime = s => { s = Math.max(0, Math.round(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const bpmOf = t => (t && t.tempo) || DEFAULT_BPM;
const parseData = i => { if (i._d === undefined) { try { i._d = i.data ? JSON.parse(i.data) : {}; } catch { i._d = {}; } } return i._d; };
function ago(ts) {
  const d = (Date.now() - ts) / 1000;
  if (d < 60) return 'just now';
  if (d < 3600) return Math.floor(d / 60) + 'm ago';
  if (d < 86400) return Math.floor(d / 3600) + 'h ago';
  if (d < 86400 * 7) return Math.floor(d / 86400) + 'd ago';
  return new Date(ts).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
}
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

/* ---------- sections & beats ---------- */
const sections = () => S.track.sections;
const curView = () => {
  const v = S.view[S.track.id] || {};
  const sec = sections().find(s => s.id === v.sid) || sections()[0];
  return { sec, transition: !!v.transition && sections().indexOf(sec) < sections().length - 1 };
};
const nextSection = sec => sections()[sections().indexOf(sec) + 1];
const holdersOf = (sid, layer) => S.track.holders.filter(h => h.section_id === sid && h.layer === layer);
const beatOf = (sid, layer) => S.track.beats.find(b => b.section_id === sid && b.layer === layer);
const ideasOf = (sid, layer) => S.track.ideas.filter(i => i.section_id === sid && i.layer === layer);
const meterLabel = sec => `${sec.meter_n}/${(METER_SUBS.find(m => m.v === sec.meter_sub) || METER_SUBS[0]).d}`;
const secBarPulses = sec => sec.meter_n / sec.meter_sub;
const subOf = b => b.sub || 2;
const barOf = b => b.bar || b.pattern.length;
const barPulses = b => barOf(b) / subOf(b);
const subSym = v => (SUBS.find(x => x.v === v) || SUBS[1]).sym;
function beatMeta(b) {
  const bars = b.pattern.length / barOf(b);
  return `${bars > 1 ? bars + ' bars · ' : ''}${barOf(b)} × ${subSym(subOf(b))}`;
}

async function api(path, opts) {
  opts = opts || {};
  const headers = { 'X-Band-Key': S.key, 'X-Member': S.me };
  let body = opts.body;
  if (body && !(body instanceof Blob)) { headers['Content-Type'] = 'application/json'; body = JSON.stringify(body); }
  if (body instanceof Blob) headers['Content-Type'] = body.type || 'application/octet-stream';
  const res = await fetch(API + '/api' + path, { method: opts.method || 'GET', headers, body });
  if (res.status === 401) { S.key = ''; store.set('key', ''); route(); throw new Error('Wrong passcode'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

async function loadState() {
  const d = await api('/state');
  S.members = d.members;
  S.tracks = d.tracks;
}

/* ---------- routing ---------- */
function route() {
  stopEverything();
  const h = location.hash.replace(/^#\/?/, '');
  if (!S.key) return viewGate();
  if (h === 'band') return viewBand();
  if (!S.me || (S.members.length && !S.members.some(m => m.id === S.me))) return viewWho();
  if (h.startsWith('t/')) return viewTrack(h.slice(2));
  return viewHome();
}
window.addEventListener('hashchange', route);
const go = h => { location.hash = h; };

function topBar(title, left, right) {
  return `<div class="top"><div class="top-in">${left || ''}<h1>${title}</h1>${right || ''}</div></div>`;
}
const backBtn = to => `<button class="icon-btn" aria-label="Back" onclick="go('${to}')">${ICON.back}</button>`;

/* ---------- gate & identity ---------- */
function viewGate() {
  $('#app').innerHTML = `<div class="wrap"><div class="gate">
    <div>${treeMark(60)}</div>
    <h2>Shajara</h2>
    <p class="muted">Where ‘ala bab allah grows tracks, layer by layer. Enter the band passcode.</p>
    <input id="pc" type="password" autocomplete="current-password" autocapitalize="off" placeholder="Band passcode">
    <button class="btn primary block" id="enter">Enter</button>
  </div></div>`;
  const submit = async () => {
    const v = $('#pc').value.trim();
    if (!v) return;
    S.key = v;
    try { await loadState(); store.set('key', v); route(); }
    catch (e) { S.key = ''; toast(e.message); }
  };
  $('#enter').onclick = submit;
  $('#pc').onkeydown = e => { if (e.key === 'Enter') submit(); };
}

async function viewWho() {
  if (!S.members.length) { try { await loadState(); } catch (e) { return toast(e.message); } }
  $('#app').innerHTML = `<div class="wrap"><div class="gate">
    <h2>Who's this?</h2>
    <p class="muted">So the band knows who posted what. You can change it later under Band.</p>
    <div class="people">${S.members.map(m => `<button class="person" data-id="${esc(m.id)}"><b>${esc(m.name)}</b><span class="small muted">${esc(m.instruments) || '&nbsp;'}</span></button>`).join('')}</div>
    <button class="btn block" onclick="go('band')">Someone else? Add to the band</button>
  </div></div>`;
  $('#app').querySelectorAll('.person').forEach(b => b.onclick = () => { S.me = b.dataset.id; store.set('me', S.me); route(); });
}

/* ---------- home ---------- */
function viewHome() {
  const render = () => {
    const me = S.members.find(m => m.id === S.me);
    const list = S.tracks.map(t => {
      const unseen = (S.seen[t.id] || 0) < t.updated_at;
      const meta = [t.maqam && (t.maqam + (t.tonic ? ' on ' + t.tonic : '')), t.tempo && t.tempo + ' bpm', t.ideas && t.ideas + ' idea' + (t.ideas > 1 ? 's' : '')].filter(Boolean).map(esc).join(' · ');
      const form = t.sections.length > 1 ? `<div class="form-line">${t.sections.map(s => esc(s.name)).join('<span class="ar">→</span>')}</div>` : '';
      const mini = LAYERS.map(l => {
        const names = [...new Set(t.holders.filter(h => h.layer === l.key).map(h => memberName(h.member_id)))];
        const beats = [...new Set(t.beats.filter(b => b.layer === l.key).map(b => b.name || 'beat'))];
        return `<div class="mini-layer" style="--c:${l.c}"><span class="ln">${l.short}</span><span class="who">${names.length ? names.map(esc).join(', ') : '<span class="open">open</span>'}</span><span class="bt">${beats.length ? '◆ ' + beats.map(esc).join(' / ') : ''}</span></div>`;
      }).join('');
      return `<button class="track-row" onclick="go('t/${esc(t.id)}')">${unseen ? '<i class="dot"></i>' : ''}
        <div class="t">${esc(t.title)}</div><div class="meta">${meta ? meta + ' · ' : ''}${ago(t.updated_at)}</div>
        ${form}<div class="mini-tree">${mini}</div></button>`;
    }).join('');
    $('#app').innerHTML = topBar('Shajara', `<span style="width:34px;display:grid;place-items:center">${treeMark(30)}</span>`,
      `<button class="icon-btn" aria-label="Band" onclick="go('band')">${ICON.people}</button>`) +
      `<div class="wrap">
        <div class="hello"><h2>Ahlan${me ? ', ' + esc(me.name) : ''}</h2><div class="muted small">${S.tracks.length} track${S.tracks.length === 1 ? '' : 's'} growing</div></div>
        ${list || `<div class="empty">No tracks yet.<br>Plant the first one.</div>`}
        ${legend()}
      </div>
      <button class="btn primary fab" onclick="newTrack()">+ New track</button>`;
  };
  render();
  loadState().then(render).catch(e => toast(e.message));
  poll(() => loadState().then(() => { if (location.hash.replace(/^#\/?/, '') === '') render(); }));
}

function legend() {
  return `<div class="legend"><h4>How a track grows</h4>
    <p style="margin:0 0 10px">A track is a run of sections (Intro, A, B…) with transitions between them. Each section is a tree, from the top down:</p>
    ${LAYERS.map(l => `<div class="l" style="--c:${l.c}"><b>${l.name}</b><span class="muted">${l.role}</span></div>`).join('')}
    <p>Anyone can hold any layer, on any instrument. One pulse runs through the whole track; each layer brings its own part on top of it, whether that’s a groove, a bass line, chords or a melody.</p></div>`;
}

function treeMark(size) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 64 64" aria-hidden="true">
    <circle cx="32" cy="20" r="13" fill="var(--bloom)" opacity=".92"/><circle cx="20" cy="26" r="9" fill="var(--bloom)" opacity=".7"/><circle cx="44" cy="26" r="9" fill="var(--bloom)" opacity=".7"/>
    <path d="M28 52V32h8v20z" fill="var(--bark)"/><path d="M8 52h48v4H8z" fill="var(--ground)"/><path d="M12 58h40v3H12z" fill="var(--substrate)"/></svg>`;
}

/* ---------- track ---------- */
async function viewTrack(id) {
  const cached = S.track && S.track.id === id ? S.track : null;
  if (cached) renderTrack();
  else $('#app').innerHTML = topBar('', backBtn('')) + '<div class="wrap"><p class="muted">Loading…</p></div>';
  try {
    if (!S.members.length) await loadState();
    S.track = await api('/tracks/' + id);
    renderTrack();
  } catch (e) { toast(e.message); if (!cached) go(''); return; }
  poll(async () => {
    if (location.hash.replace(/^#\/?/, '') !== 't/' + id || Player.on || playing.size || $('.scrim')) return;
    const t = await api('/tracks/' + id);
    if (t.updated_at !== S.track.updated_at || t.ideas.length !== S.track.ideas.length) { S.track = t; renderTrack(); }
  });
}

function selectView(sid, transition) {
  stopEverything();
  S.view[S.track.id] = { sid, transition: !!transition };
  renderTrack();
  const el = $('.form .sel'); if (el) el.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
}

function cellsHtml(b, layerKey, mp) {
  const bar = barOf(b), sub = subOf(b), w = 100 / (sub * mp);
  const row = bar * Math.max(1, Math.floor(mp / barPulses(b) + 1e-9));
  const rows = [];
  for (let i = 0; i < b.pattern.length; i += row) {
    rows.push(`<div class="cells">${b.pattern.slice(i, i + row).split('').map((c, j) => `<i class="${c === '-' ? 'R' : c}${j && j % bar === 0 ? ' bs' : ''}" style="width:${w}%"><b></b></i>`).join('')}</div>`);
  }
  return `<div class="lanes" data-cells="${layerKey}">${rows.join('')}</div>`;
}

function composeHtml(lane) {
  return `<div class="compose">
    <button class="rec" onclick="openRecorder('${lane}')">${ICON.mic}Record</button>
    ${HAS_MIDI ? `<button onclick="openMidi('${lane}')">${ICON.keys}MIDI</button>` : ''}
    ${lane !== 'transition' ? `<button onclick="editBeat('${lane}')">${ICON.rhythm}Rhythm</button>` : ''}
    <button onclick="openNote('${lane}')">${ICON.note}Note</button>
    <button onclick="openLink('${lane}')">${ICON.link}Link</button>
  </div>`;
}

function ideasHtml(sid, lane, prevSeen) {
  const ideas = ideasOf(sid, lane).sort((a, b) => b.starred - a.starred || b.created_at - a.created_at);
  if (!ideas.length) return '';
  const k = sid + lane, open = S.expanded[k];
  const shown = open ? ideas : ideas.slice(0, 3);
  return `<div class="ideas">${shown.map(i => ideaHtml(i, prevSeen)).join('')}
    ${ideas.length > 3 ? `<button class="more" onclick="S.expanded['${k}']=${!open};renderTrack()">${open ? 'Show fewer' : 'Show all ' + ideas.length + ' ideas'}</button>` : ''}</div>`;
}

function renderTrack() {
  const t = S.track;
  const prevSeen = S.seenBefore && S.seenBefore.id === t.id ? S.seenBefore.at : (S.seen[t.id] || 0);
  S.seenBefore = { id: t.id, at: prevSeen };
  S.seen[t.id] = Date.now(); store.set('seen', S.seen);
  const { sec, transition } = curView();

  const maqam = t.maqam ? t.maqam + (t.tonic ? ' on ' + t.tonic : '') : '';
  const chips = `<button class="chip${maqam ? '' : ' ghost'}" onclick="editTrack()">${maqam ? `<span class="k">Maqam</span>${esc(maqam)}` : '+ maqam'}</button>` +
    `<button class="chip${t.tempo ? '' : ' ghost'}" onclick="editTrack()">${t.tempo ? `<span class="k">Pulse</span>${t.tempo} bpm` : '+ pulse'}</button>`;
  const trackNotes = t.notes ? `<button class="notes" onclick="editTrack('f-notes')">${esc(t.notes)}</button>` : '';

  const form = sections().map((s, i) => {
    const dots = LAYERS.map(l => `<i style="--c:${l.c}" class="${holdersOf(s.id, l.key).length || beatOf(s.id, l.key) || ideasOf(s.id, l.key).length ? 'on' : ''}"></i>`).join('');
    const pill = `<button class="sec-pill${s.id === sec.id && !transition ? ' sel' : ''}" onclick="selectView('${s.id}')">${esc(s.name)}<span class="dots">${dots}</span></button>`;
    if (i === sections().length - 1) return pill;
    const n = ideasOf(s.id, 'transition').length;
    return pill + `<button class="tr-pill${n ? ' has' : ''}${s.id === sec.id && transition ? ' sel' : ''}" aria-label="Transition" onclick="selectView('${s.id}', true)">→${n ? `<b>${n}</b>` : ''}</button>`;
  }).join('') + `<button class="add-pill" onclick="newSection()">+ section</button>`;

  let panel;
  if (transition) {
    const nx = nextSection(sec);
    panel = `<div class="sec-head"><h2>${esc(sec.name)} <span style="color:var(--transition)">→</span> ${esc(nx.name)}</h2></div>
      <div class="transition-card" style="--c:var(--transition)">
        <p class="lede">How we get from ${esc(sec.name)} into ${esc(nx.name)}: fills, cues, stops, who leads. Recording here plays ${esc(sec.name)} underneath.</p>
        ${ideasHtml(sec.id, 'transition', prevSeen)}
        ${composeHtml('transition')}
      </div>`;
  } else {
    const secBeats = t.beats.filter(b => b.section_id === sec.id);
    const mp = Math.max(2, secBarPulses(sec), ...secBeats.map(barPulses));
    const layers = LAYERS.map((l, li) => {
      const hs = holdersOf(sec.id, l.key);
      const beat = beatOf(sec.id, l.key);
      const pc = li ? LAYERS[li - 1].c : l.c;
      const beatHtml = beat
        ? `<button class="beat" onclick="editBeat('${l.key}')"><div class="beat-top"><span class="k">Rhythm</span><span class="nm">${esc(beat.name || 'Untitled')}</span><span class="ln">${beatMeta(beat)}</span></div>${cellsHtml(beat, l.key, mp)}</button>`
        : '';
      return `<section class="layer" style="--c:${l.c};--pc:${pc}" id="L-${l.key}">
        <div class="layer-head"><div class="layer-glyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${l.glyph}</svg></div>
          <div><div class="layer-name">${l.name}</div><div class="layer-role">${l.role}</div></div></div>
        <div class="holders">${hs.length ? hs.map(h => `<button class="holder" onclick="editLineup('${l.key}')">${esc(memberName(h.member_id))}${h.instrument ? ' · ' + esc(h.instrument) : ''}</button>`).join('')
          : `<button class="holder empty" onclick="editLineup('${l.key}')">empty · open for one of you, or production</button>`}</div>
        ${beatHtml}
        ${ideasHtml(sec.id, l.key, prevSeen)}
        ${composeHtml(l.key)}</section>`;
    }).join('');
    panel = `<div class="sec-head"><h2>${esc(sec.name)}</h2><button class="meter" onclick="editSection()">${meterLabel(sec)}</button><span class="sp"></span><button class="icon-btn sm" aria-label="Edit section" onclick="editSection()">${ICON.edit}</button></div>
      ${sec.notes ? `<button class="notes" style="margin:0 0 14px" onclick="editSection('s-notes')">${esc(sec.notes)}</button>` : ''}
      ${lineupStrip(sec)}
      <div class="tree">${layers}</div>`;
  }

  $('#app').innerHTML = topBar(esc(t.title), backBtn(''),
    `<button class="icon-btn" aria-label="Share" onclick="shareTrack()">${ICON.share}</button><button class="icon-btn" aria-label="Edit" onclick="editTrack()">${ICON.edit}</button>`) +
    `<div class="wrap">
      <div class="hero"><div class="chips">${chips}${t.notes ? '' : `<button class="chip ghost" onclick="editTrack('f-notes')">+ track note</button>`}</div>${trackNotes}</div>
      <div class="form">${form}</div>
      ${panel}
      <p class="small faint">Started ${ago(t.created_at)}${t.created_by ? ' by ' + esc(memberName(t.created_by)) : ''}. ★ makes an idea the layer’s part: a recording, MIDI, rhythm, note, anything. Play uses each layer’s part (or its latest take) and rhythm.</p>
    </div>
    <div class="transport"><div class="transport-in">
      <button class="tp-play" id="tpPlay" onclick="togglePlayer()"></button>
      <button class="mix${S.mix.beats ? ' on' : ''}" data-mix="beats" onclick="toggleMix('beats')">${ICON.rhythm}<span>Rhythm</span></button>
      <button class="mix${S.mix.recs ? ' on' : ''}" data-mix="recs" onclick="toggleMix('recs')">${ICON.wave}<span>Parts</span></button>
      <button class="mix${S.mix.click ? ' on' : ''}" data-mix="click" onclick="toggleMix('click')">${ICON.metro}<span>Click</span></button>
      <div class="tempo"><button aria-label="Slower" onclick="nudgeTempo(-2)">−</button><div class="v${t.tempo ? '' : ' unset'}" onclick="editTrack()"><b id="bpm">${bpmOf(t)}</b><span>pulse</span></div><button aria-label="Faster" onclick="nudgeTempo(2)">+</button></div>
    </div></div>`;
  updateTransport();
}

function updateTransport() {
  const b = $('#tpPlay');
  if (!b || !S.track) return;
  b.classList.toggle('on', Player.on);
  b.innerHTML = Player.on ? ICON.stop + '<span>Stop</span>' : ICON.play + `<span>Play ${esc(curView().sec.name)}</span>`;
}
function toggleMix(k) {
  S.mix[k] = !S.mix[k]; store.set('mix', S.mix);
  document.querySelectorAll(`[data-mix="${k}"]`).forEach(b => b.classList.toggle('on', S.mix[k]));
  if (Player.on) togglePlayer().then(togglePlayer);
}
async function togglePlayer() {
  if (Player.on) { Player.stop(); return; }
  const r = await Player.start({ sec: curView().sec, beats: S.mix.beats, recs: S.mix.recs, click: S.mix.click, onStop: updateTransport });
  if (!r) toast(S.mix.click ? 'Nothing to play' : 'Nothing to play yet. Record a part or a rhythm, or switch on the click.');
  updateTransport();
}

let tempoSave = null;
function nudgeTempo(d) {
  const t = S.track;
  t.tempo = Math.max(30, Math.min(300, bpmOf(t) + d));
  $('#bpm').textContent = t.tempo;
  $('#bpm').parentElement.classList.remove('unset');
  Beat.setBpm(t.tempo);
  clearTimeout(tempoSave);
  tempoSave = setTimeout(() => api('/tracks/' + t.id, { method: 'PATCH', body: { tempo: t.tempo } }).then(x => { S.track.updated_at = x.updated_at; }).catch(e => toast(e.message)), 900);
}

function ideaHtml(i, prevSeen) {
  const isNew = i.created_at > prevSeen && i.author_id !== S.me;
  let body = '';
  if (i.kind === 'audio') body = `<div class="player" data-audio="${esc(i.id)}"><button class="play" aria-label="Play" onclick="togglePlay('${esc(i.id)}')">${ICON.play}</button><div class="bar"><i></i></div><span class="time">${fmtTime(i.duration)}</span></div>${i.body ? `<div class="idea-body">${esc(i.body)}</div>` : ''}`;
  else if (i.kind === 'midi') {
    const take = parseTake(i);
    body = `<div class="player" data-take="${esc(i.id)}"><button class="play" aria-label="Play" onclick="toggleTake('${esc(i.id)}')">${ICON.play}</button><span class="small muted">${take.notes.length} notes · ${fmtTime(take.len * 60 / bpmOf(S.track))} · MIDI</span></div>${rollSvg(take, i.id)}${i.body ? `<div class="idea-body">${esc(i.body)}</div>` : ''}`;
  }
  else if (i.kind === 'link') body = `<div class="idea-body"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(prettyUrl(i.url))}</a>${i.body ? '\n' + esc(i.body) : ''}</div>`;
  else body = `<div class="idea-body">${esc(i.body)}</div>`;
  return `<div class="idea"><div class="idea-top"><span class="by">${esc(memberName(i.author_id))}</span><span>${ago(i.created_at)}</span>${isNew ? '<span class="new-tag">new</span>' : ''}<span class="sp"></span>
    ${i.starred && i.layer !== 'transition' ? '<span class="part-tag">the part</span>' : ''}
    <button class="star${i.starred ? ' on' : ''}" aria-label="Make this the part" onclick="toggleStar('${esc(i.id)}')">${i.starred ? '★' : '☆'}</button>
    <button class="kebab" aria-label="More" onclick="ideaMenu('${esc(i.id)}')">⋯</button></div>${body}</div>`;
}
function prettyUrl(u) { try { const x = new URL(u); return x.hostname.replace(/^www\./, '') + (x.pathname.length > 1 ? x.pathname.slice(0, 28) + (x.pathname.length > 28 ? '…' : '') : ''); } catch { return u; } }

async function toggleStar(id) {
  const i = S.track.ideas.find(x => x.id === id);
  i.starred = i.starred ? 0 : 1; renderTrack();
  try { await api('/ideas/' + id, { method: 'PATCH', body: { starred: !!i.starred } }); } catch (e) { toast(e.message); }
}

function ideaMenu(id) {
  const i = S.track.ideas.find(x => x.id === id);
  const lanes = [...LAYERS, ...(nextSection(sections().find(s => s.id === i.section_id)) ? [TRANSITION] : [])].filter(l => l.key !== i.layer);
  sheet(`<h3>This idea</h3><p class="lede">${esc(laneOf(i.layer).name)} · by ${esc(memberName(i.author_id))} · ${ago(i.created_at)}</p>
    <label class="field">Move to</label>
    <div class="sugs">${lanes.map(l => `<button class="sug" style="color:${l.c}" data-move="${l.key}">${l.name}</button>`).join('')}</div>
    <label class="field">${i.kind === 'text' ? 'Note' : 'Caption'}</label><textarea id="cap" rows="2">${esc(i.body)}</textarea>
    <div class="actions"><button class="btn danger" id="del">Delete</button><button class="btn primary" id="save">Save</button></div>`, root => {
    root.querySelectorAll('[data-move]').forEach(b => b.onclick = async () => {
      closeSheet();
      try { await api('/ideas/' + id, { method: 'PATCH', body: { layer: b.dataset.move } }); i.layer = b.dataset.move; renderTrack(); } catch (e) { toast(e.message); }
    });
    $('#save', root).onclick = async () => {
      const body = $('#cap', root).value;
      if (i.kind === 'text' && !body.trim()) return toast('A note can’t be empty');
      closeSheet();
      try { await api('/ideas/' + id, { method: 'PATCH', body: { body } }); i.body = body.trim(); renderTrack(); } catch (e) { toast(e.message); }
    };
    confirmBtn($('#del', root), 'Tap again to delete', async () => {
      closeSheet();
      try { await api('/ideas/' + id, { method: 'DELETE' }); S.track.ideas = S.track.ideas.filter(x => x.id !== id); renderTrack(); } catch (e) { toast(e.message); }
    });
  });
}

function confirmBtn(btn, label, fn) {
  let armed = false;
  const orig = btn.textContent;
  btn.onclick = () => {
    if (armed) return fn();
    armed = true; btn.textContent = label;
    setTimeout(() => { armed = false; btn.textContent = orig; }, 4000);
  };
}

/* ---------- sheets ---------- */
function sheet(html, init) {
  closeSheet();
  const s = document.createElement('div');
  s.className = 'scrim';
  s.innerHTML = `<div class="sheet"><div class="grab"></div>${html}</div>`;
  s.onclick = e => { if (e.target === s) closeSheet(); };
  document.body.appendChild(s);
  if (init) init(s);
  return s;
}
function closeSheet() {
  const s = $('.scrim');
  if (!s) return;
  if (s._onclose) s._onclose();
  s.remove();
}
const chipsHtml = (id, items, c) => `<div class="sugs" id="${id}"${c ? ` style="--c:${c}"` : ''}>${items}</div>`;

function trackForm(t) {
  t = t || {};
  return `<label class="field">Title</label><input id="f-title" type="text" value="${esc(t.title)}" placeholder="Working title is fine">
    <div class="row2"><div><label class="field">Maqam</label><input id="f-maqam" type="text" list="maqamat" value="${esc(t.maqam)}" placeholder="e.g. Bayati"></div>
    <div><label class="field">On (tonic)</label><input id="f-tonic" type="text" value="${esc(t.tonic)}" placeholder="e.g. D"></div></div>
    <label class="field">Pulse (bpm, quarter note), shared by every section and layer</label><div class="tempo-row"><input id="f-tempo" type="number" inputmode="numeric" value="${t.tempo || ''}" placeholder="e.g. 96"><button class="btn" id="tap" type="button">Tap</button></div>
    <label class="field">Notes on the whole track</label><textarea id="f-notes" placeholder="Form, feel, references, who brought it…">${esc(t.notes)}</textarea>`;
}
function readTrackForm(root) {
  return { title: $('#f-title', root).value, maqam: $('#f-maqam', root).value, tonic: $('#f-tonic', root).value,
    tempo: $('#f-tempo', root).value, notes: $('#f-notes', root).value };
}
function wireTap(root) {
  let taps = [];
  $('#tap', root).onclick = () => {
    const n = performance.now();
    taps = taps.filter(x => n - x < 2500); taps.push(n);
    if (taps.length > 1) {
      const gaps = taps.slice(1).map((x, i) => x - taps[i]);
      $('#f-tempo', root).value = Math.round(60000 / (gaps.reduce((a, b) => a + b, 0) / gaps.length));
    }
  };
}

function newTrack() {
  sheet(`<h3>New track</h3><p class="lede">Only the title is needed. Sections, layers and beats grow later.</p>${trackForm()}
    <div class="actions"><button class="btn" onclick="closeSheet()">Cancel</button><button class="btn primary" id="save">Plant it</button></div>`, root => {
    wireTap(root);
    setTimeout(() => $('#f-title', root).focus(), 50);
    $('#save', root).onclick = async () => {
      const f = readTrackForm(root);
      if (!f.title.trim()) return toast('Give it a name, even a working one');
      $('#save', root).disabled = true;
      try { const t = await api('/tracks', { method: 'POST', body: f }); S.track = t; closeSheet(); go('t/' + t.id); }
      catch (e) { toast(e.message); $('#save', root).disabled = false; }
    };
  });
}

function editTrack(focusId) {
  const t = S.track;
  sheet(`<h3>Track details</h3>${trackForm(t)}
    <div class="actions"><button class="btn" onclick="closeSheet()">Cancel</button><button class="btn primary" id="save">Save</button></div>
    <div style="margin-top:28px"><button class="btn danger block" id="del">Delete track</button></div>`, root => {
    wireTap(root);
    if (focusId) setTimeout(() => $('#' + focusId, root).focus(), 50);
    $('#save', root).onclick = async () => {
      const f = readTrackForm(root);
      if (!f.title.trim()) return toast('Title can’t be empty');
      try { S.track = await api('/tracks/' + t.id, { method: 'PATCH', body: f }); closeSheet(); renderTrack(); } catch (e) { toast(e.message); }
    };
    confirmBtn($('#del', root), 'Tap again: deletes every section, idea and recording', async () => {
      try { await api('/tracks/' + t.id, { method: 'DELETE' }); closeSheet(); S.track = null; go(''); } catch (e) { toast(e.message); }
    });
  });
}

function meterPicker(root, M) {
  const draw = () => {
    root.querySelectorAll('#mn .sug').forEach(b => b.classList.toggle('on', +b.dataset.n === M.n));
    root.querySelectorAll('#md .sug').forEach(b => b.classList.toggle('on', +b.dataset.v === M.sub));
    $('#mprev', root).textContent = `${M.n}/${METER_SUBS.find(m => m.v === M.sub).d}`;
  };
  root.querySelectorAll('#mn .sug').forEach(b => b.onclick = () => { M.n = +b.dataset.n; draw(); });
  root.querySelectorAll('#md .sug').forEach(b => b.onclick = () => { M.sub = +b.dataset.v; draw(); });
  draw();
}
const meterHtml = () => `<label class="field">Time signature (drives the click and count-in)</label>
  <div class="meter-preview" id="mprev"></div>
  ${chipsHtml('mn', [2, 3, 4, 5, 6, 7, 9, 10, 11, 12, 15].map(n => `<button class="sug" data-n="${n}">${n}</button>`).join(''))}
  ${chipsHtml('md', METER_SUBS.map(m => `<button class="sug" data-v="${m.v}">/ ${m.d}</button>`).join(''))}`;

function newSection() {
  const { sec } = curView();
  const used = sections().map(s => s.name);
  const suggestion = SECTION_NAMES.find(n => !used.includes(n)) || '';
  let copy = false;
  sheet(`<h3>New section</h3><p class="lede">Each section is its own tree, with its own holders, beats and ideas. The pulse stays the track’s.</p>
    <label class="field">Name</label><input id="s-name" type="text" value="${esc(suggestion)}" placeholder="e.g. Chorus">
    ${chipsHtml('names', SECTION_NAMES.filter(n => !used.includes(n)).map(n => `<button class="sug">${n}</button>`).join(''))}
    <button class="toggle" id="copy"><span class="sw"></span><span><b>Start as a copy of ${esc(sec.name)}</b><br><span class="small muted">Same holders, beats and time signature; no ideas.</span></span></button>
    <div class="actions"><button class="btn" onclick="closeSheet()">Cancel</button><button class="btn primary" id="save">Add section</button></div>`, root => {
    root.querySelectorAll('#names .sug').forEach(b => b.onclick = () => { $('#s-name', root).value = b.textContent; });
    $('#copy', root).onclick = () => { copy = !copy; $('#copy', root).classList.toggle('on', copy); };
    $('#save', root).onclick = async () => {
      const name = $('#s-name', root).value.trim();
      if (!name) return toast('Give the section a name');
      try {
        const r = await api(`/tracks/${S.track.id}/sections`, { method: 'POST', body: { name, copy_from: copy ? sec.id : '' } });
        S.track = r; closeSheet(); selectView(r.new_section);
      } catch (e) { toast(e.message); }
    };
  });
}

function editSection(focusId) {
  const { sec } = curView();
  const idx = sections().indexOf(sec);
  const M = { n: sec.meter_n, sub: sec.meter_sub };
  sheet(`<h3>Section · ${esc(sec.name)}</h3>
    <label class="field">Name</label><input id="s-name" type="text" value="${esc(sec.name)}">
    ${meterHtml()}
    <label class="field">Notes on this section</label><textarea id="s-notes" placeholder="Feel, dynamics, how many times round, cues…">${esc(sec.notes)}</textarea>
    <div class="sugs" style="margin-top:14px">
      <button class="sug" id="mvL" ${idx === 0 ? 'disabled style="opacity:.4"' : ''}>← Move earlier</button>
      <button class="sug" id="mvR" ${idx === sections().length - 1 ? 'disabled style="opacity:.4"' : ''}>Move later →</button>
    </div>
    <div class="actions"><button class="btn" onclick="closeSheet()">Cancel</button><button class="btn primary" id="save">Save</button></div>
    ${sections().length > 1 ? '<div style="margin-top:22px"><button class="btn danger block" id="del">Delete section</button></div>' : ''}`, root => {
    meterPicker(root, M);
    if (focusId) setTimeout(() => $('#' + focusId, root).focus(), 50);
    const move = async d => {
      const other = sections()[idx + d];
      try {
        await api('/sections/' + sec.id, { method: 'PATCH', body: { position: other.position } });
        S.track = await api('/sections/' + other.id, { method: 'PATCH', body: { position: sec.position } });
        closeSheet(); selectView(sec.id);
      } catch (e) { toast(e.message); }
    };
    if (idx > 0) $('#mvL', root).onclick = () => move(-1);
    if (idx < sections().length - 1) $('#mvR', root).onclick = () => move(1);
    $('#save', root).onclick = async () => {
      try { S.track = await api('/sections/' + sec.id, { method: 'PATCH', body: { name: $('#s-name', root).value, notes: $('#s-notes', root).value, meter_n: M.n, meter_sub: M.sub } }); closeSheet(); renderTrack(); }
      catch (e) { toast(e.message); }
    };
    const del = $('#del', root);
    if (del) confirmBtn(del, 'Tap again: deletes its ideas and recordings', async () => {
      try { S.track = await api('/sections/' + sec.id, { method: 'DELETE' }); closeSheet(); selectView(sections()[Math.max(0, idx - 1)].id); } catch (e) { toast(e.message); }
    });
  });
}

/* ---------- line-up ---------- */
// People are the fixed resource: each of you is in one layer per section, or out. Production can fill any number of layers.
function lineupOf(sid) {
  const hs = S.track.holders.filter(h => h.section_id === sid);
  const people = S.members.map(m => {
    const h = hs.find(x => x.member_id === m.id);
    return { id: m.id, name: m.name, layer: h ? h.layer : null, instrument: h ? h.instrument : '' };
  });
  const prod = hs.filter(h => h.member_id === PRODUCTION);
  return { people, prod };
}
function lineupStrip(sec) {
  const { people, prod } = lineupOf(sec.id);
  const inCount = people.filter(p => p.layer).length;
  const chips = LAYERS.flatMap(l => people.filter(p => p.layer === l.key).map(p => `<span class="lu" style="--c:${l.c}">${esc(p.name)}${p.instrument ? ' · ' + esc(p.instrument) : ''}</span>`))
    .concat(prod.map(h => `<span class="lu prod" style="--c:${LAYER[h.layer].c}">Production · ${esc(LAYER[h.layer].short)}${h.instrument ? ' · ' + esc(h.instrument) : ''}</span>`))
    .concat(people.filter(p => !p.layer).map(p => `<span class="lu out">${esc(p.name)} · out</span>`));
  return `<button class="lineup" onclick="editLineup()"><div class="lbl">Line-up · ${inCount} of ${people.length} playing<span>edit</span></div>${chips.join('')}</button>`;
}

function editLineup(focusLayer) {
  const { sec } = curView();
  const { people, prod } = lineupOf(sec.id);
  const P = people.map(p => ({ ...p }));
  const prodOn = Object.fromEntries(LAYERS.map(l => [l.key, prod.some(h => h.layer === l.key)]));
  let prodWhat = (prod[0] && prod[0].instrument) || '';
  const choice = (layer, cur) => [...LAYERS.map(l => `<button class="sug${cur === l.key ? ' on' : ''}" data-l="${l.key}" style="--c:${l.c}">${l.short}</button>`),
    `<button class="sug${!cur ? ' on' : ''}" data-l="" style="--c:var(--faint)">Out</button>`].join('');

  sheet(`<h3>Line-up · ${esc(sec.name)}</h3>
    <p class="lede">There are ${P.length} of you. Each of you is in one layer in this section, or out. Layers can stay empty, and production can fill the gaps.</p>
    <div class="lu-sum" id="sum"></div>
    ${P.map((p, i) => `<div class="lu-row" data-i="${i}"><div class="top-l"><b>${esc(p.name)}</b><input type="text" placeholder="on what?" value="${esc(p.instrument)}"></div>
      <div class="sugs">${choice(i, p.layer)}</div></div>`).join('')}
    <div class="lu-row prod"><div class="top-l"><b>Production</b><input type="text" id="prodWhat" placeholder="e.g. Live pad, backing track" value="${esc(prodWhat)}"></div>
      <div class="sugs" id="prodL">${LAYERS.map(l => `<button class="sug${prodOn[l.key] ? ' on' : ''}" data-l="${l.key}" style="--c:${l.c}">${l.short}</button>`).join('')}</div>
      <div class="small faint" style="margin-top:8px">Can cover as many layers as needed.</div></div>
    <div class="actions"><button class="btn" onclick="closeSheet()">Cancel</button><button class="btn primary" id="save">Save line-up</button></div>`, root => {
    const sum = () => {
      $('#sum', root).innerHTML = LAYERS.map(l => {
        const names = P.filter(p => p.layer === l.key).map(p => esc(p.name));
        if (prodOn[l.key]) names.push('<i>production</i>');
        return `<div style="--c:${l.c}"><b>${l.short}</b>${names.length ? names.join(', ') : '<span class="empty-l">empty</span>'}</div>`;
      }).join('');
    };
    root.querySelectorAll('.lu-row[data-i]').forEach(r => {
      const p = P[+r.dataset.i];
      r.querySelectorAll('.sug').forEach(b => b.onclick = () => {
        p.layer = b.dataset.l || null;
        r.querySelectorAll('.sug').forEach(x => x.classList.toggle('on', x === b));
        if (p.layer && !p.instrument) {
          const first = (S.members.find(m => m.id === p.id).instruments.split(',')[0] || '').trim();
          if (first) { p.instrument = first; $('input', r).value = first; }
        }
        sum();
      });
      $('input', r).oninput = e => { p.instrument = e.target.value; };
    });
    root.querySelectorAll('#prodL .sug').forEach(b => b.onclick = () => { prodOn[b.dataset.l] = !prodOn[b.dataset.l]; b.classList.toggle('on', prodOn[b.dataset.l]); sum(); });
    $('#save', root).onclick = async () => {
